[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vinc-agent-framework"
version = "0.1.9"
description = "Vinc for Microsoft Agent Framework: bring decisions and records from your knowledge graph into each agent run, without writing anything on its own."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Vinculums" }]
keywords = ["vinc", "agent-framework", "context-provider", "knowledge-graph", "memory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = ["vinc-client>=0.1.13,<0.2", "agent-framework-core>=1.8.1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://vincs.io"
Documentation = "https://vincs.io/docs/"

[tool.hatch.build.targets.wheel]
packages = ["src/vinc_agent_framework"]

[tool.pytest.ini_options]
testpaths = ["tests"]
