[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vincs"
version = "0.1.5"
description = "Vinc Python SDK, framework integrations and terminal CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Vinculums" }]
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3"]

[project.optional-dependencies]
langgraph = ["langgraph>=1.0", "langchain-core>=1.0", "langchain>=1.0"]
agent-framework = ["agent-framework-core>=1.8.1"]
all = ["vincs[langgraph,agent-framework]"]
test = ["pytest>=8", "anyio>=4"]

[project.scripts]
vinc = "vinc.cli:main"

[project.urls]
Homepage = "https://vincs.io"
Documentation = "https://vincs.io/docs/"

[tool.hatch.build.targets.wheel]
packages = ["src/vinc"]

[tool.hatch.build.targets.sdist]
include = ["src", "pyproject.toml", "README.md", "hatch_build.py", "tests"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
