[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vinc-client"
version = "0.1.20"
description = "Python client for the Vinc REST v1 API: read a knowledge graph you share with AI, and write episodes to it on purpose."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Vinculums" }]
keywords = ["vinc", "knowledge-graph", "agents", "memory", "rest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "anyio>=4"]

[project.urls]
Homepage = "https://vincs.io"
Documentation = "https://vincs.io/docs/"

[tool.hatch.build.targets.wheel]
packages = ["src/vinc_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
