[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vinc"
version = "0.0.1"
description = "Vinc — 독립 설치형 데이터 마이닝 데스크톱 앱 (임베디드 그래프 스토어)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "weg-9000" }]
dependencies = []

# 데스크톱 동결 전용 — PyPI 미배포. Vinc 는 임베디드 전용(서버 Neo4j 미탑재).
[project.optional-dependencies]
# 임베디드 그래프 스토어 — P1-0 실측 확인: PyPI `ladybug` = LadybugDB v0.18.0.
# 빌드 시 정확한 버전 핀(명칭 churn 대비 §2-2). kuzu 0.11.3 은 폴백.
embedded = ["ladybug"]        # LadybugDB (Kùzu 계보). fallback: kuzu==0.11.3
embed    = ["sentence-transformers"]  # 영어 retrieval bge-base-en 768d (§8)

[tool.setuptools]
py-modules = []
