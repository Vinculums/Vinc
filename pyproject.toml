[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vinc"
version = "0.0.1"
description = "Vinc — 독립 설치형 데이터 마이닝 데스크톱 앱 (임베디드 그래프 스토어)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "weg-9000" }]
dependencies = []

# 데스크톱 동결 전용 — PyPI 미배포. Vinc 는 임베디드 전용(서버 Neo4j 미탑재).
[project.optional-dependencies]
# 임베디드 그래프 스토어 — P1-0 실측 확인: PyPI `ladybug` = LadybugDB v0.18.0.
# 빌드 시 정확한 버전 핀(명칭 churn 대비 §2-2). 드라이버 = ladybug 단일(v0.5.3 —
# kuzu 제거, 테스트 기간·기존 사용자 없음 확인).
embedded = ["ladybug==0.18.0"]        # LadybugDB (Kùzu 계보)
embed    = ["sentence-transformers"]  # 영어 retrieval bge-base-en 768d (§8)
# 사이드카(M4·P2) 로컬 로그인 자격 해시 — argon2id(설계 §3-1). HTTP 서버 자체는
# stdlib(http.server). 이 extra 없이도 코어·조회·서버 기동은 동작하며, 온보딩·
# 패스프레이즈 검증만 불가하다(F5: 키 없이 기동).
server   = ["argon2-cffi"]    # argon2id 자격 해시(로컬 로그인 F4)
# PDF 원문 적재(D45 입력 어댑터, api/textextract). **코어는 여전히 무의존**이며
# 이것도 extra 다 — 없으면 PDF 만 executed=False 로 강등되고 텍스트 경로는 그대로
# 동작한다. ⚠ 선언 지점이 여기 하나가 아니다: release.yml(동결 빌드 pip 목록)·
# ci.yml·Dockerfile.hub·packaging/sidecar.spec(collect_all) 을 함께 봐야 한다 —
# 한 곳만 빠지면 "빌드는 초록, 런타임은 사망"(v0.5.1 회귀)이 그대로 재현된다.
pdf      = ["pypdf"]          # PDF → 텍스트(순수 파이썬, 오프라인·키 0)

[tool.setuptools]
py-modules = []
