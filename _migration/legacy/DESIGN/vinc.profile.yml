# Vinc 디자인 엔진 프로파일 (weg-9000-design 오버라이드)
#
# weg-9000-design 엔진(_meta/design_rules/profile.py 의 DEFAULT_PROFILE)을 Vinc
# 팔레트 'Ink & Paper / Notation'(모노크롬 + 단일 포인트)에 맞춰 오버라이드한다.
# 여기에 적은 키만 코드 기본값을 덮어쓴다. 룰 코드(.py)는 건드리지 않는다.
#
# 사용:
#   python weg-9000-design/scripts/gen_tokens.py \
#     --profile Vinc-docs/DESIGN/vinc.profile.yml \
#     --src Vinc-docs/DESIGN/design-tokens.json --out Vinc-docs/DESIGN/tokens.css
#   python weg-9000-design/scripts/validate_design.py \
#     --tokens Vinc-docs/DESIGN/design-tokens.json --profile Vinc-docs/DESIGN/vinc.profile.yml

name: vinc

# ── 토큰 생성기 라벨 (tokens.css 헤더) ─────────────────────────────────────
ssot_label: "Vinc-docs/DESIGN"

# ── 텍스트/전경 금지 primitive (배경·칩 전용) ──────────────────────────────
# warn_bg = 경고 배경 전용(웜 그레이). *-foreground 에 쓰이면 BLOCK.
text_forbidden_primitives: [warn_bg]

# ── 명암비 회귀 앵커 (Ink & Paper 팔레트 실측·박제) ────────────────────────
# [라벨, fg_hex, bg_hex, expected] — 엔진 명암비 산식 회귀 감시(데이터 무관, 고정 hex).
# 값은 validate_design.py --audit-table 실측(2026-07-05, tol 0.1).
contrast_anchors:
  - [foreground/ink, "#14110D", "#EFEAE1", 15.7]
  - [muted-foreground/ink_mute, "#6A6252", "#EFEAE1", 5.0]
  - [info-strong/ink_soft, "#47423A", "#EFEAE1", 8.3]
  - [primary/point, "#3E4C63", "#EFEAE1", 7.2]
  - [paper-on-point, "#EFEAE1", "#3E4C63", 7.2]
  - [paper-on-ink, "#EFEAE1", "#14110D", 15.7]
  - [ink-on-warn, "#14110D", "#D9D0BF", 12.3]
  - [ink-on-accent, "#14110D", "#E1DBD0", 13.7]
