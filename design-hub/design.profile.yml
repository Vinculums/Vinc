# design.profile.yml — Vinc Design Hub instance profile
#
# Single source for every domain-dependent value the lime-design engine uses.
# Code defaults live in the plugin's _meta/design_rules/profile.py; this file
# overrides what Vinc needs. Skills pass it via `--profile ./design.profile.yml`.

name: vinc-design

# ── Token generator labels (rendered into the tokens.css header) ────────────
generator_label: "lime-design gen_tokens"
ssot_label: "DESIGN/design-tokens.json"
theme_mode_default: light-first
dark_selector: '[data-theme="dark"]'

# ── Accessibility (WCAG 2.2 AA) ──────────────────────────────────────────────
# a11y_text_min: 4.5
# a11y_large_min: 3.0
# a11y_nontext_min: 3.0
#
# Contrast pairs default to the standard semantic set (foreground/background,
# primary, info, success, danger, warning-foreground). Vinc keeps the standard
# semantic token names, so the defaults apply. Override here if names diverge.

# Primitives that must never be used as text/foreground (surface/chip only).
text_forbidden_primitives:
  - warn_bg
  - d_warn_bg

# ── Data paths (informational — skills always pass explicit --tokens/--src) ──
data_tokens_relpath: "DESIGN/design-tokens.json"
data_css_relpath: "DESIGN/tokens.css"
data_design_md_relpath: "DESIGN/DESIGN.md"
