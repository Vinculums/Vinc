# 허브(사이드카+MCP, vinc-hub) CD — main 브랜치 push 시 자동 배포.
#
# release.yml(데스크탑 앱, PyInstaller+Tauri)과 완전히 별개 파이프라인이다 —
# 허브는 컨테이너 이미지(Dockerfile.hub)로 서버에만 배포되고 데스크탑 릴리스와
# 무관하게 독립적으로 나간다(DEPLOYMENT.md §4.4 의 "데스크탑과 소스는 같지만
# 배포는 분리" 원칙을 CI 레벨에서도 유지).
#
# ⚠ 데이터 영속성: 허브는 Azure Files 볼륨(hub-storage)에 그래프 DB를 두므로
# 이미지 교체(리비전 갱신)만으로는 데이터가 사라지지 않는다(실측 확인됨 — 재시작
# 후 데이터 보존). 단, **저장 포맷이 바뀌는 변경**이면 이 워크플로만으로는
# 안전하지 않다 — 배포 전 별도로 데이터 이관 절차가 필요하다(수동 게이트, 아래
# workflow_dispatch 로만 그런 변경을 내보낼 것을 권장).
name: hub-deploy

# ── main 의 CI 가 끝나면 돈다 (2026-09-26) ─────────────────────────────────────
# 전에는 main push 로 곧장 돌면서 `gate` 잡이 테스트 스위트를 **한 번 더** 돌렸다. ci.yml
# 과 병렬이라 "CI 는 빨간데 배포는 나가는" 창을 막으려면 그것밖에 없었다(워크플로 간
# needs 는 걸 수 없다). 대가는 허브를 건드린 머지마다 같은 스위트가 셋이 겹쳐 도는
# 것이었다 — ci 의 core·core-pkns 와 이 게이트가 러너 둘을 두고 다퉜고, 셋 다 같은
# 노트북의 같은 8코어다.
#
# `workflow_run` 이 그 "워크플로 간 needs" 다. 이제 CI 가 유일한 게이트이고, 이
# 워크플로는 **CI 의 core 잡이 초록인 가장 새 main 커밋**을 내보낸다. 불러낸 커밋이 아니라
# 가장 새 초록을 고르는 이유와 옛 `paths` 필터가 어디로 갔는지는
# `scripts/hub_deploy_pick.py` 머리말에 있다(판정 전부가 거기 있고 테스트가 붙어 있다).
#
# ⚠ `workflow_run` 런에서 `github.sha` 는 **내보낼 커밋이 아니다** — 런이 시작될 때의
# main 머리다. 아래 잡들은 `needs.plan.outputs.sha` 만 쓴다. `github.sha` 를 다시 쓰면
# 검증 안 된 커밋이 나갈 수 있다(tests/platform/test_hub_deploy_pick.py 가 막는다).
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# 허브 배포는 **취소하지 않고 직렬화**한다(cancel-in-progress: false). 단일 writer +
# 포맷 변경 민감성 때문에 배포 도중 취소는 위험하다. 앞 배포가 끝난 뒤 다음이 돈다.
# 대기 중인 런은 GitHub 이 하나만 남기는데(뒤에 온 것이 앞의 대기 런을 지운다), 어느
# 런이 남든 `plan` 이 같은 답(가장 새 초록)을 내므로 지워진 런의 커밋도 빠지지 않는다.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  # 무엇을 내보낼지 고른다 — 또는 안 내보낸다. 테스트는 여기서 돌지 않는다: 이 런이
  # 불렸다는 것 자체가 ci.yml 이 끝났다는 뜻이고, 초록인지는 picker 가 커밋마다 묻는다.
  # (2026-09-26 까지 이 자리는 스위트를 다시 도는 `gate` 잡이었다 — 파일 머리말 참조.)
  # 아래 러너 문단들은 그때 이 자리에 붙어 있던 것이고 이 워크플로 전체의 러너 판단이다.
  # ── 왜 호스티드인가 (2026-08-30) ────────────────────────────────────────────
  # 이 워크플로는 `vinc-local` 위에 있었고 그 러너는 유지보수자의 노트북이다. 노트북이
  # 꺼지면 **배포가 실패가 아니라 큐에 남는다** — 즉 머지된 커밋이 조용히 안 나간
  # 채로 있다. 실제로 2026-08-30 에 #117 머지분이 그 상태로 남았다.
  #
  # 옮겨도 잃는 것이 없다는 근거: 인증은 OIDC(federated credential)이고 그 subject 는
  # **리포와 ref** 지 실행 기계가 아니다. 이미지는 이 러너가 짓고 민다(아래 build 스텝).
  # 호스티드 러너에는 도커가 있으므로 어느 호스티드 리눅스에서든 같다.
  #
  # 대가는 정직하게 적는다: 여기서부터 **GitHub 분을 쓴다.** 배포 경로에만 붙는 비용이고
  # (경로 필터가 이미 있어 아무 push 나 오지 않는다), 그 대가로 배포가 사람의 기계에서
  # 풀려난다. CI(ci.yml)는 셀프호스티드 그대로다 — 그쪽이 분을 태우는 양이 훨씬 크다.

  # ── timeout-minutes 는 무엇을 막고 무엇을 못 막나 ────────────────────────────
  # 이 워크플로는 `group: ${{ github.workflow }}` 로 **모든 허브 배포를 한 줄에 세운다**
  # (직렬화는 의도다 — 단일 writer 스토어라 배포 도중 취소가 위험하다). 대가는 줄의 맨
  # 앞이 안 끝나면 뒤가 전부 막힌다는 것이고, 2026-08-30 에 실제로 배포 넷이 그렇게
  # 밀렸다(`Vinc#129`).
  #
  # ⚠ **그 사고를 이 설정이 고치는 것은 아니다.** `timeout-minutes` 는 잡이 **실행된**
  # 시간을 세고, 러너 배정을 기다리는 큐 시간은 세지 않는다 — 타이머는 러너가 잡을 집은
  # 순간 시작한다. 그러니 영원히 배정 안 되는 런에는 영영 안 걸린다. 그날 그룹을 푼 것은
  # 타임아웃이 아니라 사람이 그 런을 취소한 것이었다.
  #
  # 그런데도 거는 이유는 **이슈가 이름 붙이지 않은 다른 고장**이 같은 결과를 내기
  # 때문이다: 시작은 했는데 끝나지 않는 런(ACR 빌드가 행에 걸리는 등)도 똑같이 그룹을
  # 무한정 붙잡는다. 그쪽은 이것이 정확히 막는다.
  #
  # 값은 실측에서 나왔다(`0401236`, 호스티드, 2026-08-30):
  #   gate              3분 30초 (테스트 스위트 3분 17초)
  #   build-and-deploy  3분 52초 (ACR 빌드 1분 57초 · 리비전 교체 · 헬스 확인)
  # 여유를 크게 둔 것은 의도다. 이것은 일정을 조이는 장치가 아니라 **행을 잡는 장치**라,
  # 정상 변동(ACR 캐시가 식은 빌드 등)에 걸리면 안 된다. 정상의 다섯 배쯤에서 끊는다.
  # ── 왜 셀프호스티드로 되돌렸나 (2026-09-06) ─────────────────────────────────
  # 위 문단이 2026-08-30 에 호스티드로 옮긴 이유를 적고 있고 그 이유는 지금도 참이다.
  # 바뀐 것은 전제 셋이다.
  #
  # ① 포함분이 말랐다. 호스티드 2,000분이 9월 5일에 소진돼 지출 한도로 도는 중이고,
  #    그 한도는 `prevent_further_usage` 라 넘으면 과금이 아니라 **정지**다. 호스티드에
  #    남기는 쪽이 오히려 "배포가 안 나가는" 상태를 부른다 — 위 문단이 막으려던 바로 그것.
  # ② 러너가 조용히 사라지던 기제가 닫혔다. 원인은 도커 데스크탑이 닫히면 WSL 이 내려가
  #    리눅스 라벨이 org 에서 사라지는 것이었고, 상주 작업 `wsl-runner-autostart`
  #    (15분 반복)이 붙잡는다. 고장을 일부러 재현해 확인했다.
  # ③ **복구 수단이 생겼다.** 이 워크플로는 구 리비전을 먼저 내리고(레플리카 0 확인) 새
  #    이미지를 올린다(단일 writer 무결성 때문에 의도된 순서). 그래서 잡이 도중에 죽으면
  #    큐에 남는 것이 아니라 **허브가 내려간 채로 남는다.** 여태 사람이 그것을 손으로
  #    되살릴 수 없었다 — 로컬 신원이 Reader 뿐이라 리비전 activate 도 로그 조회도
  #    거부됐다. 2026-09-06 에 `Container Apps Operator` 를 vincsRG 범위로 받았고
  #    (restart · activate · deactivate · getAuthToken), 실제로 로그 스트림이 열리는
  #    것까지 확인했다. 앱 자체를 고치는 write 는 일부러 안 받았다 — 그것은 이 워크플로의
  #    배포 신원이 할 일이고 사람이 손댈 자리가 아니다.
  #
  # 되돌릴 조건: 분이 다시 넉넉해지거나, 러너가 다시 조용히 사라지거나, Operator 역할이
  # 회수되면. 셋 중 하나라도 참이면 위 문단의 판단이 다시 이긴다.
  # ── 다시 호스티드로 (2026-10-02) ───────────────────────────────────────────────
  # 위 조건 ①이 풀렸다: 10월 포함분 2,000분이 새로 찼다. 그리고 분을 태우는 쪽이 배포가
  # 아니라 CI 라는 것을 9월 청구로 쟀다 — 전부 호스티드였던 9월 1~6일은 하루 약 400분,
  # 배포만 떼면 이 워크플로 약 5분 · site-deploy 약 8분 · account-deploy 약 6분이라
  # 매 push 마다 다 돌아도 하루 90분 안쪽이다. 그래서 **배포 셋만** 호스티드로 옮기고
  # CI(ci.yml)는 셀프호스티드에 둔다.
  # 옮기는 이유는 08-30 문단 그대로다. 같은 날 사이트 배포가 노트북 러너 셋이 PR CI 로
  # 바쁜 동안 큐에 서 있었고, 전날에는 노트북이 잠들어 이 워크플로가 통신을 잃었다.
  # 잡 넷을 **모두** 옮긴다. `close-report` 가 끝나야 다음 배포가 줄에서 풀리므로 그 잡만
  # 노트북에 남기면 줄이 다시 노트북을 기다린다.
  # 되돌릴 조건: 월 포함분이 다시 바닥에 가까워지면(정지는 배포까지 멈춘다).
  plan:
    runs-on: ubuntu-latest
    # git fetch · az 한 번 · API 몇 번이다. 걸린 호출 하나가 배포 줄을 붙잡지 않게 짧게.
    timeout-minutes: 10
    permissions:
      id-token: write    # azure/login — 허브에 지금 떠 있는 이미지 태그를 읽는다
      contents: read
      actions: read      # 커밋마다 ci.yml 런의 결론을 읽는다
    outputs:
      deploy: ${{ steps.pick.outputs.deploy }}
      sha: ${{ steps.pick.outputs.sha }}
      withheld: ${{ steps.pick.outputs.withheld }}
    steps:
      # 손으로 돌리는 실행은 운영 담당만(repo 변수 PROD_OPERATORS, 쉼표로 구분한 로그인).
      # 실수 방지이지 보안 경계가 아니다: 쓰기 권한자는 이 단계를 지운 브랜치 판을 dispatch 할 수 있다.
      - name: 운영 실행은 운영 담당만
        if: github.event_name == 'workflow_dispatch' && !contains(format(',{0},', vars.PROD_OPERATORS), format(',{0},', github.triggering_actor))
        env:
          ACTOR: ${{ github.triggering_actor }}
        run: |
          echo "::error::이 워크플로를 손으로 돌릴 수 있는 계정은 PROD_OPERATORS 에 있는 것뿐이다(지금 $ACTOR). 필요하면 소유자에게 요청할 것."
          exit 1
      # main 머리를 받는다(워크플로 런의 기본 ref). picker 는 first-parent 를 훑고
      # 떠 있는 커밋과 diff 하므로 이력이 전부 있어야 한다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # build-and-deploy 의 같은 스텝과 같은 이유(그 잡의 주석이 근거다).
      - name: Azure 프로필을 이 잡 전용으로 (러너가 사람과 공유하는 기계다)
        run: echo "AZURE_CONFIG_DIR=$RUNNER_TEMP/azure-$GITHUB_RUN_ID-plan" >> "$GITHUB_ENV"
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # 표준 라이브러리만 쓴다 — setup-python 없이 러너의 python3 로 돈다.
      # `DISPATCH_SHA` 는 workflow_dispatch 에서만 읽힌다. 이 워크플로에서 `github.sha`
      # 가 허용되는 유일한 자리다(파일 머리말).
      - id: pick
        name: 무엇을 내보낼지 고른다 (core 잡이 초록인 가장 새 main 커밋)
        env:
          EVENT: ${{ github.event_name }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          # 불러낸 런은 목록이 아니라 id 로 읽는다 — 목록은 끝난 런을 늦게 싣는다(picker 머리말).
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          DISPATCH_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
        run: python3 -X utf8 scripts/hub_deploy_pick.py

  build-and-deploy:
    needs: plan
    if: needs.plan.outputs.deploy == 'true'
    # 러너는 plan 과 같은 이유(그 잡 위의 문단들이 근거다).
    runs-on: ubuntu-latest
    # 실측 3분 52초. plan 위의 timeout 문단이 값의 근거와 이 설정의 한계를 함께 적는다.
    timeout-minutes: 30
    # 이 잡이 내보내는 커밋. `github.sha` 가 아니다(파일 머리말).
    env:
      DEPLOY_SHA: ${{ needs.plan.outputs.sha }}
    # ⚠ 아래 `AZURE_CONFIG_DIR` 스텝의 유래. 이 잡이 셀프호스티드였을 때 러너는
    # 유지보수자의 대화형 셸과 **같은 기계**였고, az 는 기본으로 `~/.azure` 를 쓰므로
    # 둘이 한 프로필을 공유했다. 2026-08-28 에 그것으로 배포가 죽었다: 잡이 도는 동안
    # 사람이 `az login` 을 한 번 했고, 그 로그인이 `azure/login` 이 써 둔 프로필을
    # 덮어써 다음 az 호출이 `does not exist in MSAL token cache` 로 실패했다
    # (프로필 mtime 06:05:06Z, 잡 실패 06:05:05Z). 마침 그 배포는 그때 죽어 있던
    # 허브를 되살렸을 배포였다. 정본: vinc.ops.incident-2026-08-28-hub-sidecar §5.
    #
    # 호스티드는 잡마다 새 VM 이라 그 충돌 자체가 없다. 그래도 스텝을 **남긴다** —
    # 지우면 셀프호스티드로 되돌릴 때 사고도 같이 돌아오고, 되돌리는 사람이 그 사고를
    # 겪은 사람일 이유가 없다. 호스티드에서는 무해한 한 줄이다.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      # 모델 굽기 스텝이 쓴다(아래). 이미지와 같은 3.12 로 맞춘다 — 산출물은 ONNX 라
      # 버전에 안 묶이지만, `python` 이라는 이름이 있어야 그 스텝이 돈다.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ⚠ `runner.temp` 표현식을 job 의 `env:` 에 쓰지 않는다 — 그 컨텍스트는 거기서
      # 못 쓰고, 쓰면 워크플로가 **jobs 0 으로 검증 실패**한다(이 리포가 이미 물린 자리).
      # `run:` 안에서는 `RUNNER_TEMP` 환경변수로 같은 값을 얻으므로 그것으로 넣는다.
      - name: Azure 프로필을 이 잡 전용으로 (러너가 사람과 공유하는 기계다)
        run: echo "AZURE_CONFIG_DIR=$RUNNER_TEMP/azure-$GITHUB_RUN_ID" >> "$GITHUB_ENV"

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 주소와 시크릿 참조만 준비한다. 실제 env 변경은 구 리비전을 내린 뒤의 update에서 한다.
      - name: 배치 앱의 구조와 공용 시크릿 준비 여부
        run: python scripts/layout_app.py hub-env --out "$GITHUB_ENV"

      # ⚠ 배포 **전** env 게이트. 허브 런타임 env 는 IaC 가 아니라 손으로 넣은 값이라
      # 앱을 재생성하면 조용히 빠진다 — 실제로 `VINC_MCP_ISSUER` 하나가 빠져 커넥터가
      # 전면 불가였는데 `/health` 는 200 이었다(2026-07-30). 빠진 채로 배포하면
      # "기동은 되지만 기능이 죽은" 리비전이 나가므로 여기서 막는다.
      - name: Gate — 허브 런타임 env 존재 검증
        run: |
          az containerapp show --name vinc-hub -g vincsRG \
            --query "properties.template.containers[0].env" -o json \
            | python scripts/check_hub_env.py

      # ⚠ 배포 **전** 리비전 접미사 게이트(2026-08-03 신설). 아래 배포 단계는
      # `--revision-suffix` 를 주지 않으므로 앱 템플릿의 `revisionSuffix` 가 그대로
      # 재사용된다. 비어 있어야 Azure 가 `vinc-hub--00000NN` 로 자동 번호를 매긴다.
      # 손으로 `revision copy --revision-suffix <이름>` 을 쓰면 그 이름이 템플릿에
      # **남아**, 다음 배포가 같은 이름의 리비전을 또 만들려다 실패한다(실측: 운영 중
      # `restorecheck` 가 박혀 있었다). 비우는 것은 CLI 로 안 된다 —
      # `--revision-suffix ""` 는 클라이언트 검증이 거부하고, ARM PATCH 로 template
      # 전체를 보내며 빈 문자열을 넣어야 한다(DEPLOYMENT.md §4.3.1). 사후에 알아채면
      # 비싸므로 여기서 미리 막는다.
      - name: Gate — 리비전 접미사가 비어 있는가(자동 번호 유지)
        run: |
          set -euo pipefail
          suffix=$(az containerapp show --name vinc-hub -g vincsRG \
            --query "properties.template.revisionSuffix" -o tsv)
          if [ -n "$suffix" ]; then
            echo "::error::앱 템플릿에 revisionSuffix='$suffix' 가 박혀 있다 — 이대로" \
                 "배포하면 같은 이름의 리비전을 다시 만들려다 실패한다." >&2
            echo "복구: ARM PATCH 로 template.revisionSuffix 를 '' 로" \
                 "되돌릴 것(DEPLOYMENT.md §4.3.1)." >&2
            exit 1
          fi
          echo "revisionSuffix 비어 있음 — 자동 번호 유지"

      # ── 모델을 여기서 굽는다 (ACR 이 아니라) ─────────────────────────────────
      #
      # ACR 빌드 에이전트는 아티팩트를 **못 담는 게 아니다.** fp32 를 다 받고 나서
      # `quantize_dynamic` 에서 OOM 으로 죽는다(실측 exit 137, bge-m3 2.27GB,
      # bake-probe run 33716383547). vincacr 는 Basic 티어라 에이전트에 메모리를 더 줄
      # 수 없다 — 전용 에이전트 풀은 Premium 기능이다. 그래서 **메모리를 쓰는 호출
      # 하나만** 이 러너로 옮겼다(호스티드 러너는 약 16GB).
      #
      # 아티팩트는 아래 `docker build … .` 의 끝 점이 빌드 컨텍스트로 담는다. 저장소도
      # 자격증명도 새 워크플로도 필요 없다. 검증은 이미지 안에 남아 있다 —
      # `Dockerfile.hub` 의 `RUN` 이 **COPY 된 그 바이트**를 열어 폭을 대조한다.
      #
      # ⚠ 세 값을 여기 하드코딩하지 않는다. 그러면 이 스텝이 Dockerfile ENV 의 **네
      # 번째 독자**가 되고, 두 CI 테스트(Dockerfile↔EMBEDDING_DIM_BY_MODEL, basename
      # 정확 일치)가 초록인 채로 갈릴 수 있다. Dockerfile 에서 읽어 쓴다.
      # ⚠ **굽기는 캐시가 비었을 때만 한다.** 이 스텝이 배포마다 fp32 2.27GB 를 받아
      # `quantize_dynamic` 을 돌렸고, 그 피크가 이 러너(WSL 몫 7.7GB)를 넘겼다. 죽는
      # 것은 스텝만이 아니다 — 2026-09-18 과 2026-09-19 에 **러너 서비스 자체가
      # oom-kill** 됐고, 유닛에 재시작 정책이 없어 하루 넘게 꺼진 채였다. 그동안 CI 와
      # 배포 전부가 반쪽 풀에서 돌았다. 즉 이 스텝의 메모리 피크는 한 번의 실패가
      # 아니라 **용량의 영구 손실**로 나타난다.
      #
      # 고치는 방향이 "메모리를 더 준다"가 아닌 이유: 호스트가 15.9GB 이고 WSL 은
      # 기본으로 그 절반을 받는데, 나머지 절반은 윈도우와 Docker 가 쓴다. 늘려 봐야
      # 스왑이다. 그래서 **같은 것을 두 번 굽지 않는** 쪽으로 간다.
      #
      # 장치는 이미 `packaging/bake_embed_model.py` 안에 있다: 산출물이 둘 다 있으면
      # `skip-bake` 로 빠지고 **검증만** 한다. 그러니 캐시가 할 일은 산출물을 제자리에
      # 갖다 놓는 것뿐이고, 검증(`verify_embedding_width`)은 캐시된 바이트에도 그대로
      # 돈다 — 잘린 파일이 조용히 통과하지 않는다는 성질을 잃지 않는다.
      #
      # 키는 모델·폭·굽는 스크립트다. 셋 중 하나라도 바뀌면 다시 굽는다. 캐시는 러너
      # 로컬 디스크에 둔다(업로드 없음) — 리눅스 러너 둘이 같은 WSL 의 같은 `runner`
      # 계정이라 한 벌을 나눠 쓴다.
      - name: 모델을 굽는다 (캐시가 비었을 때만 — 러너 로컬)
        run: |
          set -euo pipefail
          export $(grep -E '^ENV VINC_EMBED_(MODEL|MODEL_PATH|DIM)=' Dockerfile.hub | sed 's/^ENV //')
          name="$(basename "$VINC_EMBED_MODEL_PATH")"
          key="$(printf '%s|%s|%s' "$VINC_EMBED_MODEL" "$VINC_EMBED_DIM" \
                   "$(sha256sum packaging/bake_embed_model.py | cut -d' ' -f1)" \
                 | sha256sum | cut -c1-32)"
          cache="${VINC_BAKE_CACHE:-$HOME/.cache/vinc-bake}/$key"
          mkdir -p models
          if [ -s "$cache/$name" ] && [ -s "$cache/tokenizer.json" ]; then
            echo "캐시 적중: $cache"
            cp "$cache/$name" "$cache/tokenizer.json" models/
          else
            echo "캐시 없음 → 굽는다: $VINC_EMBED_MODEL → $name (폭 $VINC_EMBED_DIM)"
          fi
          python -m pip install --quiet --disable-pip-version-check \
            onnx onnxruntime tokenizers numpy huggingface_hub
          # 컨테이너 절대경로를 컨텍스트 상대경로로 옮긴다. basename 은 Dockerfile 이
          # 정한 그대로 쓴다 — 그래야 `artifact_name(모델)` 대조가 계속 성립한다.
          # 캐시가 적중했으면 이 호출은 굽지 않고 검증만 한다(skip-bake).
          VINC_EMBED_MODEL_PATH="models/$name" \
            python packaging/bake_embed_model.py
          # 방금 구운 것만 캐시에 넣는다. 원자적으로 옮겨 반쪽 파일이 남지 않게 한다 —
          # 반쪽이 캐시에 앉으면 다음 배포가 그것을 "있다"로 읽고 검증에서 죽는다.
          if [ ! -s "$cache/$name" ]; then
            mkdir -p "$cache"
            cp "models/$name" "$cache/.$name.tmp" && mv "$cache/.$name.tmp" "$cache/$name"
            cp models/tokenizer.json "$cache/.tokenizer.tmp" && mv "$cache/.tokenizer.tmp" "$cache/tokenizer.json"
            echo "캐시에 넣었다: $cache"
          fi
          ls -la models
          # The same commit can be rebuilt with different cached model bytes.
          # Bind both deployed roles to the actual ONNX and tokenizer artifact.
          artifact_hash=$(sha256sum "models/$name" models/tokenizer.json | sha256sum | cut -d' ' -f1)
          echo "VINC_ENCODER_BUILD=$DEPLOY_SHA-$artifact_hash" >> "$GITHUB_ENV"

      # 이미지는 이 러너에서 짓고 vincacr 로 민다. ACR Tasks 는 빌드 vCPU 초를 따로 청구하는데
      # 이 잡은 그 원격 빌드를 기다리는 동안에도 러너 분을 쓴다. 구운 모델도 이미 이 디스크에
      # 있다. 태그 둘과 빌드 인자를 바꾸면 아래 스텝들이 읽는 이미지 이름이 어긋난다.
      - name: Build & push image (runner)
        run: |
          set -euo pipefail
          az acr login --name vincacr
          docker build \
            --build-arg "VINC_ENCODER_BUILD=$VINC_ENCODER_BUILD" \
            -t "vincacr.azurecr.io/vinc-hub:$DEPLOY_SHA" \
            -t vincacr.azurecr.io/vinc-hub:latest \
            -f Dockerfile.hub .
          docker push "vincacr.azurecr.io/vinc-hub:$DEPLOY_SHA"
          docker push vincacr.azurecr.io/vinc-hub:latest

      # ── 리비전 전환: 구 리비전을 먼저 내리지 않는다 ──────────────────────────────
      # 단일 writer 의 순서는 배포 층이 아니라 기동 순서가 지킨다. 새 리비전의 MCP 가 먼저
      # 포트를 열고 요청을 붙잡는다 → 플랫폼이 트래픽을 넘기고 구 리비전에 SIGTERM →
      # 구 리비전이 최종 스냅샷을 올리고 넘김 표식을 쓴다 → 새 리비전은 그 표식을 본 뒤에야
      # 복원한다. 그래서 복원은 언제나 최종 스냅샷 뒤에 오고(인과), 그사이 요청은 실패하지
      # 않고 기다린다. 아래 "writer 인계 확인" 스텝이 표식으로 그것을 대조한다.
      # 근거: [[vinc.plan.hub-writer-handoff-2026-10-17]]
      #
      # 종료 유예는 60초로 둔다. 구 리비전이 사이드카를 닫고(최대 VINC_SIDECAR_STOP_WAIT_S)
      # 최종 스냅샷을 올릴 시간이다. 유예는 리비전 단위 값이라 이번 배포의 새 리비전부터 걸린다.
      - name: Read probe through the switch (start)
        env:
          PROBE_TOKEN: ${{ secrets.VINC_MCP_TOKEN }}
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/read-probe.log"
          nohup sh -c '
            while [ ! -f "$RUNNER_TEMP/read-probe.stop" ]; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 100 \
                https://vinc-hub.grayplant-559d42e3.koreacentral.azurecontainerapps.io/mcp \
                -X POST -H "Authorization: Bearer $PROBE_TOKEN" -H "Content-Type: application/json" \
                -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/list\",\"params\":{}}" || true)
              echo "$(date +%s) $code" >> "$RUNNER_TEMP/read-probe.log"
              sleep 2
            done' > /dev/null 2>&1 &
          echo "read probe started"

      - name: Deploy to Container Apps
        run: |
          set -euo pipefail
          APP="--name vinc-hub -g vincsRG"
          IMAGE="vincacr.azurecr.io/vinc-hub:$DEPLOY_SHA"
          prev=$(az containerapp show $APP --query "properties.latestRevisionName" -o tsv)
          echo "PREV_REV=$prev" >> "$GITHUB_ENV"
          echo "serving revision: $prev"
          # 인코더는 허브 컨테이너 안에서 돈다(2 CPU·4 GiB). 원격 인코더 env 가 아직 있으면 이번
          # 갱신에서 뺀다 — 있을 때만 넘긴다(없는 이름을 지우라고 하지 않는다).
          RMARGS=()
          have=$(az containerapp show $APP --query "properties.template.containers[0].env[].name" -o tsv)
          for n in VINC_EMBED_REMOTE VINC_EMBED_ENCODE_TOKEN; do
            if printf '%s\n' "$have" | grep -qx "$n"; then RMARGS+=("$n"); fi
          done
          [ "${#RMARGS[@]}" = 0 ] || RMARGS=(--remove-env-vars "${RMARGS[@]}")
          # 허브 env 는 **여기서만** 바꾼다. 콘솔이나 bare `az containerapp update
          # --set-env-vars` 는 이 워크플로의 직렬화(concurrency hub-deploy)를 비켜 간다.
          # 리포 변수 VINC_QUOTA_EXEMPT_OWNERS 가 비어 있으면 env 는 건드리지 않는다.
          ENVVARS=()
          if [ -n "${{ vars.VINC_QUOTA_EXEMPT_OWNERS }}" ]; then
            ENVVARS+=("VINC_QUOTA_EXEMPT_OWNERS=${{ vars.VINC_QUOTA_EXEMPT_OWNERS }}")
          fi
          # 임베딩 적용 멈춤 스위치. 위와 달리 **매번 싣는다**: 변수를 비우면 off 가
          # 들어가 멈춤이 풀린다(건너뛰면 한 번 켠 on 이 env 에 영영 남는다).
          ENVVARS+=("VINC_EMBED_APPLY_PAUSED=${{ vars.VINC_EMBED_APPLY_PAUSED || 'off' }}")
          # 스페이스당 분당 툴 호출 상한(모든 플랜 같음). 매번 싣고, 변수가 비면 60 이다.
          ENVVARS+=("VINC_BURST_PER_MINUTE=${{ vars.VINC_BURST_PER_MINUTE || '60' }}")
          ENVVARS+=("VINC_TOPIC_CONVERSION=1")
          # 임베딩 적용이 청크 벡터 색인을 버리지 않고 이어 넣는다(질의는 배타 가드 안). 매번 싣는다:
          # 리포 변수를 off 로 두면 다음 배포부터 예전처럼 드롭한다(되돌리는 스위치).
          # 근거: [[record:keep-index-mode-survived-104-trials-on-ladybug-0-21-2-at-two-cores-while-the-unguarded-control-crashed-1-of-20-2026-10-18]]
          ENVVARS+=("VINC_KEEP_VECTOR_INDEX=${{ vars.VINC_KEEP_VECTOR_INDEX || 'on' }}")
          if [ "${LAYOUT_PRESENT:-0}" = '1' ]; then
            ENVVARS+=("VINC_LAYOUT_REMOTE=$LAYOUT_REMOTE" "VINC_LAYOUT_TOKEN=secretref:layout-token")
          fi
          # Azure keeps only the last occurrence of this option. Pass all values once.
          ENVARGS=(--set-env-vars "${ENVVARS[@]}")
          if ! az containerapp update $APP --image "$IMAGE" --termination-grace-period 60 --cpu 2 --memory 4Gi ${RMARGS[@]+"${RMARGS[@]}"} "${ENVARGS[@]}" --output none; then
            echo "::error::이미지 갱신 실패 — 허브는 구 리비전($prev)으로 계속 서비스한다." >&2
            exit 1
          fi
          latest=$(az containerapp show $APP --query "properties.latestRevisionName" -o tsv)
          echo "latest revision: $latest"
          echo "LATEST_REV=$latest" >> "$GITHUB_ENV"

          # 같은 SHA 로 다시 돌리면 템플릿이 그대로라 새 리비전이 안 생긴다(no-op). 구
          # 리비전이 그대로 서비스 중이므로 할 일이 없다 — 인계도 없다.
          if [ "$latest" = "$prev" ]; then
            echo "새 리비전이 생기지 않았다(이미지 동일) — $prev 가 계속 서비스한다"
            echo "HANDOFF_EXPECTED=0" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "HANDOFF_EXPECTED=1" >> "$GITHUB_ENV"

          for i in $(seq 1 40); do
            st=$(az containerapp revision show $APP --revision "$latest" --query "properties.runningState" -o tsv 2>/dev/null || echo "?")
            old=$(az containerapp revision show $APP --revision "$prev" --query "properties.replicas" -o tsv 2>/dev/null || echo "?")
            echo "  new=$st old_replicas=${old:-0}"
            case "$st" in Running|RunningAtMaxScale)
              case "${old:-0}" in 0|None) exit 0 ;; esac ;;
            esac
            sleep 15
          done
          # 단일 리비전 모드는 새 리비전이 준비되기 전까지 트래픽을 구 리비전에 둔다. 새 것이
          # 끝내 못 뜨면 구 것이 계속 서비스하므로 허브는 내려가 있지 않다. 다만 반쯤 뜬 새
          # 리비전이 스토어를 만졌을 수 있으니 구 이미지로 되돌리는 것은 사람이 보고 정한다.
          echo "::error::새 리비전 $latest 이 10분 안에 서지 않았다(구 리비전 $prev 상태를 확인할 것)." >&2
          echo "  img=\$(az containerapp revision show -n vinc-hub -g vincsRG --revision $prev --query 'properties.template.containers[0].image' -o tsv)" >&2
          echo "  az containerapp update -n vinc-hub -g vincsRG --image \"\$img\"" >&2
          exit 1

      # 인코더는 같은 이미지를 쓴다 — 접두·풀링·양자화 규약이 한 파일에 있고, 허브와
      # 인코더가 다른 리비전을 들면 **에러 없이 벡터만 갈라진다**(접두 유무의 코사인이
      # 0.95~0.97 이라 눈에 안 띈다). 그래서 같은 SHA 로 함께 올린다.
      # 앱이 없으면 조용히 건너뛴다 — 인코더 도입 전 상태에서도 이 워크플로가 돌아야 한다.
      # 스토어를 안 물으므로 단일 writer 순서 조정(위)이 필요 없다.
      - name: Deploy encoder (same image) — 없는 것과 확인 못 한 것을 가른다
        # 🔴 전에는 `2>/dev/null` 로 조회 실패를 통째로 "없음"으로 읽고 `exit 0` 했다.
        # 일시적 API 오류·스로틀링 하나면 허브만 새 이미지로 가고 인코더는 옛것에 남는다.
        # 그 상태가 위험한 이유는 모델이 **이미지의 ENV** 로 오기 때문이다 — 통과 접두를
        # 붙이는 허브 워커와 질의 접두를 붙이는 vinc-encode 가 서로 다른 모델이 되고,
        # 그러면 벡터가 다른 공간에 놓인다. 코사인 0.95~0.97 에 예외 0건이라 헬스체크도
        # 로그도 통과한다. 모델 교체(Decision B)에서 정확히 이것이 막아야 할 고장이다.
        run: |
          set -euo pipefail
          if err=$(az containerapp show -n vinc-encode -g vincsRG --output none 2>&1); then
            echo "ENCODE_PRESENT=1" >> "$GITHUB_ENV"
          elif printf '%s' "$err" | grep -qiE 'ResourceNotFound|was not found|could not be found'; then
            echo "vinc-encode 없음 — 건너뛴다"
            echo "ENCODE_PRESENT=0" >> "$GITHUB_ENV"
            exit 0
          fi
          # --min-replicas 0: 허브가 인코더를 제 컨테이너 안에 들었으므로 vinc-encode 를 부르는 쪽이
          # 없다. 같은 이미지를 유지한 채(되돌릴 때 그대로 쓰도록) 유휴 레플리카 0 으로 둔다.
          # 기준선(app-config-baseline.json)도 같은 커밋에서 0 이다.
          python scripts/reconcile_encoder_update.py \
            --image "vincacr.azurecr.io/vinc-hub:$DEPLOY_SHA" --min-replicas 0
          echo "vinc-encode 갱신: $DEPLOY_SHA (minReplicas 0)"

      - name: 두 앱이 같은 이미지인가 (인코더 공간 일치)
        # 위 스텝이 성공을 보고해도 갱신이 라이브에 반영됐는지는 별개다. 여기서 다시
        # 읽어 대조한다 — 같은 이미지 = 같은 ENV = 같은 인코더 공간이고, 이 리포에는
        # 두 앱을 잇는 코드가 없어서 이 대조 말고는 확인할 자리가 없다.
        if: env.ENCODE_PRESENT == '1'
        run: |
          set -euo pipefail
          h=$(az containerapp show -n vinc-hub    -g vincsRG --query 'properties.template.containers[0].image' -o tsv)
          e=$(az containerapp show -n vinc-encode -g vincsRG --query 'properties.template.containers[0].image' -o tsv)
          echo "hub    = ${h}"
          echo "encode = ${e}"
          [ "$h" = "$e" ] || {
            echo "::error::두 앱의 이미지가 다르다 — 통과 인코더와 질의 인코더가 다른 공간에 있다" >&2
            exit 1
          }
          echo "인코더 공간 일치 확인"

      # 리비전이 Running 이 되는 것은 MCP 가 붙잡기 모드로 포트를 연 순간이다 — 스토어는
      # 그 뒤 writer 인계를 기다렸다가 복원된다. 그래서 첫 응답이 붙잡힌 끝의 503 일 수 있고,
      # 앱이 설 때까지 되묻는다. 뒤의 검증 스텝들은 이 스텝이 통과한 뒤라 준비된 허브를 본다.
      - name: Verify health (MCP tools/list)
        run: |
          sleep 15
          deadline=$(( $(date +%s) + 360 ))
          i=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            i=$((i + 1))
            code=$(curl -s -o "$RUNNER_TEMP/tools.json" -w '%{http_code}' --max-time 100 \
              https://vinc-hub.grayplant-559d42e3.koreacentral.azurecontainerapps.io/mcp \
              -X POST -H "Authorization: Bearer ${{ secrets.VINC_MCP_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' || true)
            if [ "$code" = "200" ] && grep -q '"tools"' "$RUNNER_TEMP/tools.json"; then
              echo "tools/list 200 (시도 $i)"; exit 0
            fi
            echo "  tools/list $code — 아직 준비 중, 다시 묻는다"
            sleep 15
          done
          echo "::error::허브가 tools/list 에 답하지 않는다" >&2
          exit 1

      - name: Read probe through the switch (result)
        if: always()
        run: |
          touch "$RUNNER_TEMP/read-probe.stop"
          sleep 3
          log="$RUNNER_TEMP/read-probe.log"
          [ -s "$log" ] || { echo "read probe: no samples"; exit 0; }
          total=$(wc -l < "$log")
          bad=$(awk '$2 != "200"' "$log" | wc -l)
          span=$(awk '$2 != "200" { if (!s) s=$1; e=$1; next } { if (s) { d=e-s; if (d>m) m=d; s=0 } } END { if (s) { d=e-s; if (d>m) m=d } print m+0 }' "$log")
          echo "read probe: $bad of $total requests were not 200 (longest run of failures: ${span}s)"
          {
            echo "### Read probe through the switch"
            echo
            echo "- requests: $total, not 200: $bad, longest failing run: ${span}s"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$bad" = "0" ] || echo "::warning::read probe saw $bad failed requests during the deploy"

      # ⚠ tools/list 200 은 **OAuth 가 살아있다는 증거가 아니다.** 정적 bearer 로 붙기
      # 때문에 OAuth 가 통째로 꺼져도 통과한다 — 2026-07-30 사고가 정확히 그 상태였다
      # (`/health` 200 · tools/list 200 · 그런데 커넥터는 전면 불가).
      # 그래서 커넥터가 실제로 밟는 discovery 경로를 공개 도메인으로 확인한다.
      # DEPLOYMENT.md §4.4.2 의 수기 점검을 CD 로 옮긴 것.
      # VINC_GRAPH_SPACE(저장소 변수, 팀 uuid)가 있으면 검색 확인과 인용 대조가 그 팀을 읽는다.
      # 비어 있으면 개인 그래프다. vinc 토픽이 팀으로 옮겨 가면 그 팀 id 를 넣는다.
      - name: Verify temporal search through the existing read only account key
        env:
          VINC_GRAPH_READONLY_KEY: ${{ secrets.VINC_GRAPH_READONLY_KEY }}
          VINC_MCP_TOKEN: ${{ secrets.VINC_MCP_TOKEN }}
          VINC_GRAPH_SPACE: ${{ vars.VINC_GRAPH_SPACE }}
        run: python scripts/verify_search_temporal_remote.py

      - name: Verify connector surface (OAuth discovery)
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            https://mcp.vincs.io/.well-known/oauth-protected-resource)
          [ "$code" = "200" ] || {
            echo "::error::oauth-protected-resource 가 $code — VINC_MCP_ISSUER 미설정이면 404 다" >&2
            exit 1; }

          # 미인증 POST 의 WWW-Authenticate 가 https 를 가리켜야 한다. issuer 가 없으면
          # `http://{Host}` 로 폴백해 클라이언트가 discovery 를 포기한다.
          hdr=$(curl -s -D - -o /dev/null -X POST https://mcp.vincs.io/mcp \
                 -H 'Content-Type: application/json' -d '{}' \
                 | tr -d '\r' | grep -i '^www-authenticate:' || true)
          echo "  $hdr"
          case "$hdr" in
            *'resource_metadata="https://'*) echo "  connector surface OK" ;;
            *) echo "::error::WWW-Authenticate 가 https 가 아니다: $hdr" >&2; exit 1 ;;
          esac

      # ── 레지스트리 정리 ─────────────────────────────────────────────────────
      # 왜 여기 생겼나. 배포마다 `:latest` 와 `:<sha>` 두 태그를 밀고 **아무것도 안
      # 지웠다**. 2026-09-01 실측: vincacr 가 23.51GB / 포함분 11GB = **219%**,
      # vinc-hub 매니페스트 87개. Basic 티어라 retention policy 를 못 켠다(그 기능은
      # Premium 전용이다 — 정책 객체가 `status: disabled` 로 남아 있는 게 그 흔적).
      # 그래서 정리는 설정이 아니라 행위여야 하고, 태그가 생기는 자리가 그 자리다.
      # 근거: [[record:the-registry-passed-its-included-storage-and-nothing-prunes-it]]
      #
      # ⚠ **검증 스텝들 뒤에 온다.** 배포가 실패하면 옛 이미지가 유일한 롤백 경로다
      # (이 앱은 리비전을 하나만 들고 있어서 `revision activate` 로 되돌아갈 자리가
      # 없다 — 2026-09-01 실측). 실패한 배포가 자기 탈출로를 지우면 안 된다.
      #
      # 앱 구조 드리프트 게이트 — Terraform(infra/)이 의도적으로 안 드는 층
      # (컨테이너 앱 셋)의 기준선 대조. 값이 아니라 구조만 본다: env 이름·스케일·
      # ingress·auth(excludedPaths). 이미지·리비전은 안 봐서 정상 배포로는 안 운다.
      #
      # ⚠ 이 스텝의 빨강은 **드리프트 경보이지 배포 실패가 아니다** — 배포·헬스
      # 검증은 이 앞에서 이미 초록이었다. 멀쩡한 리비전을 다시 배포하러 가지 말 것.
      # 의도한 변경이면 `python scripts/gate_app_config.py --write` 로 기준선을
      # 같은 커밋에 갱신한다. 08-30 사고(excludedPaths 소실, 경보도 배포도 초록)가
      # 이 게이트의 존재 이유다. 포털 수동 변경은 다음 배포의 이 스텝에서 걸린다.
      - name: 저장 배치가 계정 경로에서 ready이고 그래프 표식과 맞는가
        if: env.LAYOUT_PRESENT == '1'
        env:
          VINC_GRAPH_READONLY_KEY: ${{ secrets.VINC_GRAPH_READONLY_KEY }}
        run: python scripts/verify_layout_remote.py

      - name: 새 앱을 포함한 라이브 기준선 수집 (시크릿 값 제외)
        if: env.LAYOUT_PRESENT == '1'
        run: |
          python scripts/gate_app_config.py --write --require-present --apps vinc-hub vinc-encode vinc-account vinc-layout \
            --baseline "$RUNNER_TEMP/layout-app-config.json"

      - uses: actions/upload-artifact@v4
        if: env.LAYOUT_PRESENT == '1'
        with:
          name: layout-app-config-${{ github.run_id }}
          path: ${{ runner.temp }}/layout-app-config.json
          retention-days: 7

      - name: App config drift gate (구조 기준선 대조)
        run: python3 scripts/gate_app_config.py

      # 기동 중 미러 교체는 읽기에도 store_busy를 낸다. 완료 상태를 먼저 관측해
      # 인용 대조가 정상적인 초기화와 경쟁하지 않게 한다. 재구축 요청은 보내지 않는다.
      # ── 노드 미러 재구축 결과 (2026-09-10) ──────────────────────────────────
      # 재구축은 기동 때 배경으로 돌고, 완료 파일에서 읽은 안전한 상태가 헬스에 남는다.
      # 최근 로그 300줄은 완료 표식을 잃을 수 있다. 이 스텝이 없으면
      # "미러가 다시 만들어졌는가"와 "쓰기를 얼마나 붙들었는가"를 아무도 확인할 수 없다.
      #
      # 그 확인이 필요한 이유는 이 리포의 이력이다: 배경 작업이 조용히 죽고 겉은 초록인
      # 채로 오래 가는 일이 두 번 있었다(임베딩 워커 38시간 방치). 재구축은 정확히 같은
      # 신분이다 — 실패해도 검색은 제목 팔·그래프 팔로 답하므로 증상이 없다.
      #
      # ⚠ **배포를 실패로 만들지 않는다.** 앞의 헬스·커넥터 검증은 이미 통과했다.
      # 재구축은 부가 기능이다. 여기서 죽으면 실제로는 나간 배포가 빨간
      # 런으로 남고, 그것을 본 사람이 멀쩡한 리비전을 다시 배포하러 간다(레지스트리
      # 정리 스텝이 `continue-on-error` 인 것과 같은 이유).
      - name: Node mirror rebuild result (재구축이 실제로 돌았는가)
        continue-on-error: true
        timeout-minutes: 14
        run: |
          # 최근 로그 300줄은 완료 표식을 잃는다. 완료 파일의 안전한 상태를 헬스로 읽는다.
          # 재구축을 다시 요청하지 않는다. 완료면 즉시 끝나고 실패/미확인은 경고로 남는다.
          python3 scripts/check_node_mirror.py

      # 인용 생존 대조(라이브) — ci 의 스냅샷 게이트는 '인용 ⊆ 매니페스트'만 본다.
      # 매니페스트에 실린 id 가 그 뒤 그래프에서 죽으면(2026-08-28 재키잉 실측) 그
      # 게이트는 초록인 채 인용이 썩는다. 여기서 라이브 그래프에 직접 묻는다 —
      # 인용된 id 만, 읽기 전용으로. ⚠ 빨강은 "코드 주석이 없는 노드를 가리킨다"는
      # 경보이지 배포 실패가 아니다(드리프트 게이트와 같은 신분).
      #
      # 키는 읽기 전용 계층(vinc_ro_*)을 쓴다 — 쓰기 키를 CI 에 두지 않는 것이
      # W18 스코프 키 분리의 요지다. 시크릿 미설정이면 건너뛰되 조용하지 않게
      # 말한다(넣는 순간 저절로 작동한다).
      - name: Graph citation liveness (라이브 인용 대조)
        env:
          VINC_REMOTE_MCP_TOKEN: ${{ secrets.VINC_GRAPH_READONLY_KEY }}
          VINC_GRAPH_SPACE: ${{ vars.VINC_GRAPH_SPACE }}
        run: |
          if [ -z "$VINC_REMOTE_MCP_TOKEN" ]; then
            echo "::notice::VINC_GRAPH_READONLY_KEY 시크릿 미설정 — 라이브 인용 대조를 건너뛴다. vinc_ro_* 키를 발급해 시크릿에 넣으면 이 스텝이 작동한다."
            exit 0
          fi
          python3 scripts/refresh_graph_refs.py --check

      # ⚠ 첫 실행은 밀린 것까지 한꺼번에 지우므로 오래 걸린다(87 → KEEP). 한 번뿐이다.
      #
      # ⚠ **정리 실패가 배포를 실패로 만들면 안 된다.** 이 스텝은 잡의 **마지막**이고
      # 그 앞에서 헬스·커넥터 표면 검증이 이미 통과했다 — 여기서 죽으면 실제로는
      # 나간 배포가 빨간 런으로 남고, 그것을 본 사람이 멀쩡한 리비전을 다시 배포하러
      # 간다. `set -e` 아래에서 죽을 자리가 여럿이다: `containerapp show` 가 실패하면
      # `live` 를 못 구하고, `manifest delete` 하나가 실패하면 while 루프가 통째로
      # 끊기며, 마지막 `show-usage` 가 빈 값을 주면 f-string 이 SyntaxError 를 낸다.
      # 셋 다 청소의 실패이지 배포의 실패가 아니다. 실패는 로그에 남고 다음 배포가
      # 다시 시도한다 — 지울 것은 도망가지 않는다.
      - name: Prune old image tags (the registry bills what it keeps)
        continue-on-error: true
        env:
          KEEP: "10"
        run: |
          set -euo pipefail
          live=$(az containerapp show --name vinc-hub -g vincsRG \
                   --query "properties.template.containers[0].image" -o tsv | sed 's/.*://')
          echo "지금 도는 태그: $live (이건 절대 안 지운다)"

          # 시간 역순으로 받아 앞 KEEP 개를 남긴다. `latest` 가 붙은 것과 지금 도는
          # 것은 순위와 무관하게 건너뛴다 — 순위만 믿으면 손으로 배포한 리비전이
          # 밀려났을 때 도는 이미지를 지운다.
          az acr manifest list-metadata -r vincacr -n vinc-hub --orderby time_desc \
            -o json > /tmp/m.json
          total=$(python3 -c "import json;print(len(json.load(open('/tmp/m.json'))))")
          echo "매니페스트 $total 개, $KEEP 개 유지"

          python3 - "$live" "$KEEP" <<'PY' > /tmp/kill.txt
          import json, sys
          live, keep = sys.argv[1], int(sys.argv[2])
          for m in json.load(open("/tmp/m.json"))[keep:]:
              tags = m.get("tags") or []
              if "latest" in tags or live in tags:
                  continue
              print(m["digest"])
          PY

          n=$(wc -l < /tmp/kill.txt)
          if [ "$n" = "0" ]; then echo "지울 것 없음"; exit 0; fi
          echo "지운다: $n 개"
          while read -r d; do
            az acr manifest delete -r vincacr -n "vinc-hub@$d" --yes --output none
          done < /tmp/kill.txt

          # ⚠ **이 숫자는 방금 지운 것을 아직 반영하지 않는다.** ACR 은 매니페스트를
          # 지워도 레이어를 즉시 회수하지 않는다(가비지 컬렉션이 지연 실행된다).
          # 실측 2026-09-01, 이 스텝의 첫 실행: 81개를 지웠는데 23.51GB → 24.12GB 로
          # **늘었다** — 늘어난 것은 방금 푸시한 새 이미지이고, 지운 81개의 레이어는
          # 아직 그대로 있다. 그대로 "정리 후" 라고 적으면 읽는 사람이 **"81개를
          # 지웠는데 커졌다 = 정리가 안 먹는다"** 로 읽는다. 실제로 그렇게 읽혔다.
          #
          # 그래서 지운 개수(이 스텝이 실제로 한 일)와 현재 용량(나중에 줄어드는
          # 값)을 갈라서 적고, 시차를 문장으로 말한다. 진짜 감소는 다음 배포의
          # 이 줄에서 보인다.
          size=$(az acr show-usage -n vincacr --query "value[?name=='Size'].currentValue|[0]" -o tsv)
          echo "지운 매니페스트: $n 개"
          echo "지금 레지스트리: $(python3 -c "print(f'{$size/1e9:.2f}')") GB"
          echo "  ⚠ 이 용량은 방금 삭제분을 아직 안 담는다 — ACR 레이어 회수가 지연된다."
          echo "  실제 감소는 다음 배포의 이 줄에서 보인다."

      # writer 인계 확인. 헬스가 통과했다는 것은 새 리비전이 복원을 마치고 자격을 가져갔다는
      # 뜻이다. 남은 질문은 "구 리비전이 넘긴 **뒤에** 복원했는가"이고, 영속 공유의 표식이
      # 그것을 적는다: `.writer` 가 새 리비전, `.released` 가 구 리비전이어야 한다.
      # `.released` 가 다르면 새 리비전이 대기 상한에서 그대로 진행한 것이다 — 구 리비전의
      # 마지막 주기 스냅샷 이후 쓰기가 빠졌을 수 있으므로 빨강으로 남겨 사람이 본다.
      # 잡의 **맨 끝**에 두고 취소가 아니면 늘 돈다. 앞에 두면 이 빨강이 뒤의 검증(OAuth
      # 표면·구조 기준선·인용 생존·레지스트리 정리)을 통째로 건너뛰게 한다 — 인계가 늦었을
      # 뿐 서비스는 떠 있는데, 정작 서비스를 확인하는 스텝들이 안 돈다.
      - name: Verify writer handoff (markers on the persistent share)
        if: ${{ !cancelled() && env.HANDOFF_EXPECTED == '1' }}
        run: |
          set -euo pipefail
          p=$(az containerapp show -n vinc-hub -g vincsRG \
                --query "properties.template.containers[0].env[?name=='VINC_STORE_SNAPSHOT'].value | [0]" -o tsv)
          [ -n "$p" ] || p=$(az containerapp show -n vinc-hub -g vincsRG \
                --query "properties.template.containers[0].env[?name=='VINC_DATA_DIR'].value | [0]" -o tsv)
          case "$p" in /data/*) ;; *) echo "::error::스냅샷 경로가 /data 밖이다: $p" >&2; exit 1 ;; esac
          rel=${p#/data/}
          for m in writer released; do
            az storage file download --account-name vinchubssd01 --share-name hub-data \
              --path "$rel.$m" --dest "$RUNNER_TEMP/handoff.$m" --output none 2>/dev/null \
              || : > "$RUNNER_TEMP/handoff.$m"
          done
          # 표식 값은 `<리비전>@<레플리카>` 다. 대조는 리비전만 본다.
          w=$(tr -d '[:space:]' < "$RUNNER_TEMP/handoff.writer"); w=${w%%@*}
          r=$(tr -d '[:space:]' < "$RUNNER_TEMP/handoff.released"); r=${r%%@*}
          echo "writer=$w released=$r (expected writer=$LATEST_REV released=$PREV_REV)"
          [ "$w" = "$LATEST_REV" ] || { echo "::error::writer 가 새 리비전이 아니다" >&2; exit 1; }
          [ "$r" = "$PREV_REV" ] || {
            echo "::error::구 리비전($PREV_REV)이 넘기지 못했다 — 새 리비전이 대기 상한에서 진행했다." >&2
            echo "새 리비전 로그의 'vinc: handoff' 줄과 구 리비전의 'final snapshot' 줄을 볼 것." >&2
            exit 1; }
          echo "writer 인계 확인"

  # ── 배포 실패를 조용히 두지 않는다 ─────────────────────────────────────────
  # 🔴 2026-09-18 이 잡의 이유다. `8c7e363` 의 배포가 모델 굽기에서 exit 137 로
  # 죽었고(러너 메모리 부족), **허브가 만 하루 넘게 옛 이미지로 남았는데 아무도
  # 몰랐다**. 소유자가 다른 일로 배포 목록을 열어 보고 나서야 드러났다.
  #
  # 실패한 것은 **배포**이지 CI 가 아니라는 것이 급소다. PR 은 초록으로 머지되고
  # main 의 붉은 것은 Actions 목록에만 남는다. GitHub 은 실행자에게 메일을 보내지만
  # 그 메일은 다른 알림 수백 통과 같은 곳에 쌓인다. 그래서 사라지지 않는 자리에
  # 남긴다: 이슈. 배포 실패는 드물어야 하는 사건이고, 드물지 않게 되면 이슈 목록이
  # 그 사실 자체를 말한다(같은 판단을 Vinc-homepage 의 site-deploy 도 한다).
  #
  # ⚠ 이 잡은 실패를 **삼키지 않는다** — `if: failure()` 는 앞 잡의 결론을 안 바꾸고,
  # 이슈 생성이 실패해도(권한·한도) 경고만 남긴다. 그리고 이것으로 **못 잡는 고장이
  # 하나 있다: 러너가 아예 안 뜨면 이 잡도 안 돈다.** 그때는 실행 목록에 아무것도
  # 안 생기는 것으로만 드러나고, 여기서 막을 방법이 없다.
  #
  # `gh` 대신 REST 를 쓰는 이유는 셀프호스티드 러너에 gh 가 있다는 보장이 없어서였다.
  # 한때 청구가 1분부터라 이 잡만 노트북에 두었지만, 지금은 나머지 잡과 같이 호스티드다
  # (위 2026-10-02 문단: 배포 줄이 노트북을 기다리지 않게).
  #
  # 2026-09-26 부터 **보류**도 여기로 온다. 테스트 게이트가 CI 로 옮겨 가면서, CI 가
  # 빨개 허브 변경이 안 나가는 것은 이 워크플로의 실패가 아니라 `plan` 의 판정이 됐다
  # (런은 초록이다). 그대로 두면 2026-09-18 과 같은 모양으로 조용하다. 그래서
  # `withheld` 가 차 있으면 초록 런에서도 이슈를 연다. 제목 머리가 같으므로 CI 가 다시
  # 초록이 되어 그 커밋을 포함한 배포가 나가면 `close-report` 가 닫는다.
  report:
    needs: [plan, build-and-deploy]
    if: failure() || needs.plan.outputs.withheld != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write      # 이 잡만 — 워크플로 기본 권한은 그대로 둔다
    steps:
      - name: 실패를 이슈로 남긴다
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          API: ${{ github.api_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WHY: ${{ github.event_name }}
          # plan 이 고르기 전에 죽었으면 불러낸 커밋을 적는다.
          SHA: ${{ needs.plan.outputs.sha || github.event.workflow_run.head_sha || github.sha }}
          WITHHELD: ${{ needs.plan.outputs.withheld }}
          PLAN: ${{ needs.plan.result }}
          DEPLOY: ${{ needs.build-and-deploy.result }}
        run: |
          set -uo pipefail
          python3 - > /tmp/issue.json <<'PYEOF'
          import json, os
          e = os.environ
          sha, plan, deploy, held = e["SHA"], e["PLAN"], e["DEPLOY"], e["WITHHELD"]
          failed = "failure" in (plan, deploy)
          if held and not failed:
              sha = held
              body = f"""main 의 CI(core 잡)가 빨개서 이 커밋의 허브 변경을 **내보내지 않았다**.
          허브는 그 앞의 이미지로 남아 있다 — 배포가 실패한 것이 아니라 게이트가 막은 것이다.

          - 실행: {e['RUN_URL']}
          - 보류된 커밋: `{sha}`

          CI 가 옳고 코드 쪽을 고쳐야 한다는 뜻이다. 고친 커밋의 CI 가 초록이 되면 그
          커밋을 내보내는 배포가 저절로 돌고, 이 커밋을 포함하므로 이 이슈도 닫힌다."""
          else:
              which = "계획(plan)" if plan == "failure" else "빌드·배포"
              held_line = f"\n- CI 빨강으로 보류된 커밋도 있다: `{held}`" if held else ""
              body = f"""허브 배포가 실패했다. **허브는 이 실패 시점의 이미지로 남아 있다** —
          `api/**`·`vinc_mcp/**` 를 고쳐 머지해도 실제로는 안 나간다.

          - 실행: {e['RUN_URL']}
          - 죽은 잡: **{which}** (plan={plan}, build-and-deploy={deploy})
          - 무엇이 불렀나: `{e['WHY']}`
          - 커밋: `{sha}`{held_line}

          다음에 볼 것: 어느 스텝이 죽었는가. **exit 137 이면 메모리 부족이고**, 그
          자리는 보통 모델 굽기다(2026-09-18 에 그것으로 하루가 갔다 — VIN-73).
          plan 이라면 CI 상태·az·git 중 하나가 답을 못 한 것이다(로그 첫 `::error::`).

          고친 뒤 Actions → hub-deploy → Run workflow 로 다시 돌린다."""
          print(json.dumps({"title": f"hub-deploy failed ({e['WHY']}, {sha[:7]})",
                            "body": body}, ensure_ascii=False))
          PYEOF
          code=$(curl -sS -o /tmp/issue.out -w '%{http_code}' -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" --data @/tmp/issue.json "$API/repos/$REPO/issues")
          if [ "$code" = "201" ]; then
            echo "실패를 이슈로 남겼다: $(python3 -c "import json;print(json.load(open('/tmp/issue.out'))['html_url'])")"
          else
            echo "::warning::이슈를 만들지 못했다(HTTP $code) — 배포 실패는 그대로다."
            head -c 500 /tmp/issue.out || true
          fi

  # ── 뒤의 배포가 성공하면 그 실패 이슈를 닫는다 ─────────────────────────────
  # 위 `report` 가 연 이슈는 닫는 자리가 없었다. 뒤의 배포가 성공해 허브가 이미 새
  # 이미지로 돌아도 이슈는 열린 채 쌓였고 사람이 손으로 닫았다(2026-09-20 #366·#368).
  # 열린 실패 이슈는 "허브가 지금 옛 이미지에 남아 있다"로만 읽혀야 신호로 남는다.
  # 닫을 것이 없으면 아무것도 안 한다.
  #
  # ⚠ **닫는 것은 이번 커밋이 그 실패 커밋을 포함할 때뿐이다**(compare API 로 판정).
  # 옛 런을 손으로 재실행해 성공하면 허브는 더 옛 이미지로 가고 뒤 커밋의 실패는
  # 여전히 참이다. 그것까지 닫으면 `report` 가 막으려던 "아무도 모르는 옛 이미지"가
  # 그대로 돌아온다. 제목에서 커밋을 못 읽으면(사람이 연 이슈 등) 열어 둔다.
  #
  # 러너·토큰·REST(curl) 는 `report` 와 같고 이유도 같다(그 잡의 주석이 근거다).
  close-report:
    needs: [plan, build-and-deploy]
    # plan 이 "내보낼 것 없음"이면 build-and-deploy 가 skip 되고 이 잡도 따라 skip 된다.
    # 설령 돌더라도 SHA 가 비어 compare 가 실패하므로 아무것도 닫지 않는다 — 닫는 것은
    # 실제로 나간 배포뿐이다.
    if: success()
    runs-on: ubuntu-latest
    # 이 런이 끝나야 다음 허브 배포가 줄에서 풀린다(워크플로 concurrency). 걸린 호출
    # 하나가 배포 줄을 붙잡지 않게 짧게 끊는다.
    timeout-minutes: 5
    permissions:
      contents: read     # compare API(포함 판정)는 이것으로 된다
      issues: write      # 이 잡만 — 워크플로 기본 권한은 그대로 둔다
    steps:
      # ⚠ 배포는 이미 나갔다. 여기서 무엇이 실패해도 런을 빨갛게 만들지 않는다 —
      # 빨간 런을 본 사람이 멀쩡한 리비전을 다시 배포하러 간다(레지스트리 정리
      # 스텝과 같은 이유). 실패는 경고로 남고 다음 성공 배포가 다시 시도한다.
      - name: 성공했으니 열린 실패 이슈를 닫는다
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          API: ${{ github.api_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WHY: ${{ github.event_name }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -uo pipefail
          # HTTP 는 `report` 처럼 curl 로, 판정은 python3 로 한다(러너의 jq 에 기대지 않는다).
          # 이 스크립트는 tests/platform/test_hub_deploy_close_report.py 가 꺼내 돌린다.
          python3 - <<'PYEOF'
          import json, os, re, subprocess
          e = os.environ
          api, repo, sha = e["API"], e["REPO"], e["SHA"]
          PREFIX = "hub-deploy failed ("   # `report` 가 붙이는 제목 머리다. 둘은 같이 바꾼다

          def call(method, path, body=None):
              """curl 한 번. (HTTP 코드, JSON 본문 또는 None) 을 돌려준다."""
              cmd = ["curl", "-sS", "-X", method, "-w", "\n%{http_code}",
                     "-H", "Authorization: Bearer " + e["GH_TOKEN"],
                     "-H", "Accept: application/vnd.github+json"]
              data = None
              if body is not None:
                  cmd += ["--data-binary", "@-"]
                  data = json.dumps(body).encode("utf-8")
              r = subprocess.run(cmd + [api + path], input=data, capture_output=True)
              text, _, code = r.stdout.decode("utf-8", "replace").rpartition("\n")
              try:
                  return code.strip(), (json.loads(text) if text.strip() else None)
              except ValueError:
                  return code.strip(), None

          def main():
              stale = []
              for page in range(1, 11):   # 열린 이슈 1,000개까지 본다
                  code, items = call("GET", f"/repos/{repo}/issues?state=open&per_page=100&page={page}")
                  if code != "200" or not isinstance(items, list):
                      print(f"::warning::열린 이슈를 못 읽었다(HTTP {code}) — 닫지 않고 넘어간다.")
                      return
                  # /issues 는 PR 도 돌려준다. PR 은 건드리지 않는다.
                  stale += [i for i in items
                            if "pull_request" not in i and i.get("title", "").startswith(PREFIX)]
                  if len(items) < 100:
                      break
              if not stale:
                  print("닫을 실패 이슈 없음")
                  return
              closed = 0
              for i in stale:
                  n, title = i["number"], i["title"]
                  m = re.search(r", ([0-9a-f]{7,40})\)$", title)
                  if not m:
                      print(f"::notice::#{n} 제목에서 커밋을 못 읽었다 — 열어 둔다: {title}")
                      continue
                  failed = m.group(1)
                  code, cmp = call("GET", f"/repos/{repo}/compare/{failed}...{sha}?per_page=1")
                  status = (cmp or {}).get("status")
                  # ahead = 이번 커밋이 실패 커밋 뒤에 있다(포함한다). identical = 같은 커밋.
                  if code != "200" or status not in ("ahead", "identical"):
                      print(f"::notice::#{n} 이번 커밋이 {failed} 를 포함하지 않는다"
                            f"(HTTP {code}, {status}) — 그 실패는 아직 참이라 열어 둔다.")
                      continue
                  note = (f"뒤의 배포가 성공해서 닫는다. 허브는 이제 `{sha[:7]}` 의 이미지로 돌고,"
                          f" 이 커밋은 실패한 `{failed}` 를 포함한다.\n\n"
                          f"- 실행: {e['RUN_URL']}\n- 커밋: `{sha}` (`{e['WHY']}`)")
                  code, _ = call("POST", f"/repos/{repo}/issues/{n}/comments", {"body": note})
                  if code != "201":
                      # 이유 없이 닫힌 이슈는 열린 이슈보다 나쁘다. 댓글이 안 붙으면 닫지 않는다.
                      print(f"::warning::#{n} 에 댓글을 못 남겼다(HTTP {code}) — 닫지 않는다.")
                      continue
                  code, _ = call("PATCH", f"/repos/{repo}/issues/{n}",
                                 {"state": "closed", "state_reason": "completed"})
                  if code == "200":
                      closed += 1
                      print(f"#{n} 을 닫았다: {title}")
                  else:
                      print(f"::warning::#{n} 을 닫지 못했다(HTTP {code}).")
              print(f"실패 이슈 {len(stale)}개 중 {closed}개를 닫았다")

          try:
              main()
          except Exception as x:   # 배포는 이미 나갔다. 여기서 죽어 런을 빨갛게 만들지 않는다
              print(f"::warning::실패 이슈 정리가 멈췄다: {x!r}")
          PYEOF
