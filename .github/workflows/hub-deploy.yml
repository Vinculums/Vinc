# 허브(사이드카+MCP, vinc-hub) CD — main 브랜치 push 시 자동 배포.
#
# release.yml(데스크탑 앱, PyInstaller+Tauri)과 완전히 별개 파이프라인이다 —
# 허브는 컨테이너 이미지(Dockerfile.hub)로 서버에만 배포되고 데스크탑 릴리스와
# 무관하게 독립적으로 나간다(DEPLOYMENT.md §4.4 의 "데스크탑과 소스는 같지만
# 배포는 분리" 원칙을 CI 레벨에서도 유지).
#
# ⚠ 데이터 영속성: 허브는 Azure Files 볼륨(hub-storage)에 그래프 DB를 두므로
# 이미지 교체(리비전 갱신)만으로는 데이터가 사라지지 않는다(실측 확인됨 — 재시작
# 후 데이터 보존). 단, **저장 포맷이 바뀌는 변경**이면 이 워크플로만으로는
# 안전하지 않다 — 배포 전 별도로 데이터 이관 절차가 필요하다(수동 게이트, 아래
# workflow_dispatch 로만 그런 변경을 내보낼 것을 권장).
name: hub-deploy

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "store/**"
      - "engines/**"
      - "vinc_mcp/**"
      - "Dockerfile.hub"
      - "packaging/docker-entrypoint.sh"
      - "packaging/embed_worker.py"
      - "packaging/bake_embed_model.py"
      - "packaging/lbug_extensions/**"
      - "pyproject.toml"
      - "scripts/check_hub_env.py"
      - ".github/workflows/hub-deploy.yml"
  workflow_dispatch:

# 허브 배포는 **취소하지 않고 직렬화**한다(cancel-in-progress: false). 단일 writer +
# 포맷 변경 민감성 때문에 배포 도중 취소는 위험하다 — 이 워크플로는 path 필터·main
# 한정이라 실행이 드물어 취소로 아낄 분도 적다. 앞 배포가 끝난 뒤 다음이 돈다.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  # 배포 전 게이트 — ci.yml 과 같은 검증을 여기서 한 번 더 돌린다. ci.yml 은 push 로
  # 병렬 실행되므로 "ci 가 빨간데 배포는 나가는" 창이 생긴다(워크플로 간 needs 는
  # 걸 수 없다). 배포를 막는 것이 목적이므로 같은 잡 안에서 선행시킨다.
  # ⚠ 이전에는 배포 **후** tools/list 를 확인했다 — 이미 나간 뒤라 막지 못했다.
  gate:
    runs-on: [self-hosted, linux, vinc-local]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pytest 는 tests/ 4개 모듈이 실제로 import 한다(ci.yml 주석 참조).
      - run: pip install ladybug==0.18.0 argon2-cffi pyyaml pytest
      # 커밋된 확장을 쓴다(네트워크 불요) — ci.yml 과 같은 이유. INSTALL 은 러너에서
      # SSL 검증 실패로 죽는다.
      - name: Point to bundled G0 extensions (no network)
        run: echo "VINC_LBUG_EXT_DIR=$GITHUB_WORKSPACE/packaging/lbug_extensions" >> "$GITHUB_ENV"
      - name: Assert driver is importable (no silent skips)
        run: |
          python - <<'PY'
          import sys
          from store.embedded_backend import _import_driver
          drv, _ = _import_driver()
          sys.exit(0 if drv else 1)
          PY
      - name: Run test suite
        run: |
          set -o pipefail
          python verify.py 2>&1 | tee verify.log
          ran=$(grep -oE '^Ran [0-9]+ tests' verify.log | grep -oE '[0-9]+' || echo 0)
          [ "$ran" -ge 300 ] || { echo "::error::테스트 ${ran}건만 실행됨(하한 300)" >&2; exit 1; }

  build-and-deploy:
    needs: gate
    runs-on: [self-hosted, linux, vinc-local]
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ⚠ 배포 **전** env 게이트. 허브 런타임 env 는 IaC 가 아니라 손으로 넣은 값이라
      # 앱을 재생성하면 조용히 빠진다 — 실제로 `VINC_MCP_ISSUER` 하나가 빠져 커넥터가
      # 전면 불가였는데 `/health` 는 200 이었다(2026-07-30). 빠진 채로 배포하면
      # "기동은 되지만 기능이 죽은" 리비전이 나가므로 여기서 막는다.
      - name: Gate — 허브 런타임 env 존재 검증
        run: |
          az containerapp show --name vinc-hub -g vincsRG \
            --query "properties.template.containers[0].env" -o json \
            | python scripts/check_hub_env.py

      # ⚠ 배포 **전** 리비전 접미사 게이트(2026-08-03 신설). 아래 배포 단계는
      # `--revision-suffix` 를 주지 않으므로 앱 템플릿의 `revisionSuffix` 가 그대로
      # 재사용된다. 비어 있어야 Azure 가 `vinc-hub--00000NN` 로 자동 번호를 매긴다.
      # 손으로 `revision copy --revision-suffix <이름>` 을 쓰면 그 이름이 템플릿에
      # **남아**, 다음 배포가 같은 이름의 리비전을 또 만들려다 실패한다(실측: 운영 중
      # `restorecheck` 가 박혀 있었다). 비우는 것은 CLI 로 안 된다 —
      # `--revision-suffix ""` 는 클라이언트 검증이 거부하고, ARM PATCH 로 template
      # 전체를 보내며 빈 문자열을 넣어야 한다(DEPLOYMENT.md §4.3.1). 사후에 알아채면
      # 비싸므로 여기서 미리 막는다.
      - name: Gate — 리비전 접미사가 비어 있는가(자동 번호 유지)
        run: |
          set -euo pipefail
          suffix=$(az containerapp show --name vinc-hub -g vincsRG \
            --query "properties.template.revisionSuffix" -o tsv)
          if [ -n "$suffix" ]; then
            echo "::error::앱 템플릿에 revisionSuffix='$suffix' 가 박혀 있다 — 이대로" \
                 "배포하면 같은 이름의 리비전을 다시 만들려다 실패한다." >&2
            echo "복구: ARM PATCH 로 template.revisionSuffix 를 '' 로" \
                 "되돌릴 것(DEPLOYMENT.md §4.3.1)." >&2
            exit 1
          fi
          echo "revisionSuffix 비어 있음 — 자동 번호 유지"

      - name: Build & push image (ACR Tasks)
        run: |
          az acr build \
            --registry vincacr \
            --image vinc-hub:${{ github.sha }} \
            --image vinc-hub:latest \
            -f Dockerfile.hub .

      # ⚠ **순서가 데이터 무결성이다 — 구 리비전을 먼저 내리고 새 이미지를 올린다.**
      #
      # 두 번 이유가 바뀌었다. 처음에는 파일 락이었다: 둘이 같은 Azure Files 볼륨의
      # DB 를 물어 새 리비전이 스토어를 못 열었다(`"driver": null` → 헬스 타임아웃).
      # `VINC_STORE_LOCAL=on` 이 작업본을 컨테이너 로컬로 옮겨 그 락은 사라졌지만,
      # **같은 자리에 더 조용한 고장이 들어섰다**(2026-08-19 실측, 3회 재현):
      #
      #   새 리비전 "store restore: restored"  ← 구 리비전 "final snapshot ok" 보다
      #   22 · 24 · 43초 **앞선다**. 구 리비전의 마지막 주기 스냅샷 이후 쓰기는 그
      #   최종 스냅샷에만 있는데, 새 리비전은 그것을 영영 읽지 않고 자기 스냅샷으로
      #   덮는다. 배포마다 최대 `VINC_STORE_SNAPSHOT_EVERY` 초어치가 **무음으로**
      #   사라진다(문서 1건과 노드·엣지를 실제로 잃었다 — [[vinc.ops.deployment]]).
      #
      # 롤링으로는 못 고친다. 플랫폼이 새 리비전의 헬스를 본 뒤에야 구 리비전에
      # SIGTERM 을 보내므로, 새 리비전이 구 리비전을 기다리면 서로 막힌다(교착).
      # 그래서 **배포 층에서 직렬화한다**: 내리고 → 최종 스냅샷을 기다리고 → 올린다.
      # 단일 writer 라 배포당 1분 안팎의 다운타임은 원래 불가피하다.
      - name: Stop old revision first (final snapshot must land before restore)
        run: |
          set -euo pipefail
          APP="--name vinc-hub -g vincsRG"
          actives=$(az containerapp revision list $APP --query "[?properties.active].name" -o tsv)
          if [ -z "$actives" ]; then
            echo "활성 리비전 없음 — 내릴 것이 없다"
            exit 0
          fi
          for rev in $actives; do
            echo "deactivating: $rev"
            # 실패하면 **떨어진다**. 조용히 옛 순서로 되돌아가면 그 배포가 무엇을
            # 삼켰는지 아무도 모른다 — 이 단계가 존재하는 이유가 그것이다.
            az containerapp revision deactivate $APP --revision "$rev" --output none
          done
          # ⚠ **활성 여부로 재면 안 된다.** `properties.active` 는 deactivate 즉시
          # 뒤집히고 컨테이너 종료를 기다리지 않는다. 우리가 기다리는 것은 종료 훅이
          # 최종 스냅샷을 볼륨에 쓰는 것이므로, 재야 하는 값은 **살아 있는 레플리카**다
          # (entrypoint: SIGTERM → close(2s) → "final snapshot ok").
          gone=0
          for i in $(seq 1 20); do
            act=$(az containerapp revision list $APP \
                  --query "[?properties.active] | length(@)" -o tsv)
            # 비활성 리비전의 replicas 는 null 로 오기도 한다 — 숫자만 더한다.
            reps=$(az containerapp revision list $APP \
                   --query "[].properties.replicas" -o tsv 2>/dev/null \
                   | awk 'BEGIN{s=0} /^[0-9]+$/{s+=$1} END{print s}')
            echo "  active=$act replicas=$reps"
            if [ "$act" = "0" ] && [ "$reps" = "0" ]; then gone=1; break; fi
            sleep 10
          done
          if [ "$gone" != "1" ]; then
            echo "::error::구 리비전의 레플리카가 사라지지 않았다 — 최종 스냅샷을 기다릴 수 없다. 수동 확인 필요." >&2
            exit 1
          fi
          # 레플리카가 사라진 것을 실제로 봤으므로 이 여유는 **볼륨 쓰기가 API 관측보다
          # 늦을 경우**만 덮는다(Azure Files 는 로컬 파일시스템이 아니다).
          sleep 10
          echo "레플리카 0 확인 — 최종 스냅샷이 볼륨에 있다"

      - name: Deploy to Container Apps
        run: |
          set -euo pipefail
          APP="--name vinc-hub -g vincsRG"
          IMAGE="vincacr.azurecr.io/vinc-hub:${{ github.sha }}"
          # ⚠ 여기서 실패하면 **허브가 내려간 채로 남는다** — 앞 단계가 구 리비전을
          # 이미 내렸기 때문이다. `set -e` 로 그냥 죽으면 az 오류만 남고, 지금 서비스가
          # 멈춰 있다는 사실도 되살리는 방법도 아무 데도 안 적힌다. 가장 위험한 창이라
          # 라벨을 붙인다.
          if ! az containerapp update $APP --image "$IMAGE" --output none; then
            echo "::error::이미지 갱신 실패 — **허브는 지금 내려가 있다**(앞 단계가 구 리비전을 내렸다)." >&2
            echo "데이터는 최종 스냅샷까지 안전하다. 서비스만 멈춰 있으므로 마지막 정상 리비전을 되살릴 것:" >&2
            echo "  az containerapp revision list --name vinc-hub -g vincsRG -o table" >&2
            echo "  az containerapp revision activate --name vinc-hub -g vincsRG --revision <이름>" >&2
            exit 1
          fi
          latest=$(az containerapp show $APP --query "properties.latestRevisionName" -o tsv)
          echo "latest revision: $latest"
          for i in $(seq 1 30); do
            st=$(az containerapp revision show $APP --revision "$latest" --query "properties.runningState" -o tsv 2>/dev/null || echo "?")
            echo "  state: $st"
            case "$st" in Running|RunningAtMaxScale) exit 0 ;; esac
            sleep 15
          done
          echo "::error::새 리비전이 기동하지 못했다. 허브는 지금 내려가 있다 — 마지막 정상 리비전을 'az containerapp revision activate' 로 되살릴 것." >&2
          exit 1

      # 인코더는 같은 이미지를 쓴다 — 접두·풀링·양자화 규약이 한 파일에 있고, 허브와
      # 인코더가 다른 리비전을 들면 **에러 없이 벡터만 갈라진다**(접두 유무의 코사인이
      # 0.95~0.97 이라 눈에 안 띈다). 그래서 같은 SHA 로 함께 올린다.
      # 앱이 없으면 조용히 건너뛴다 — 인코더 도입 전 상태에서도 이 워크플로가 돌아야 한다.
      # 스토어를 안 물으므로 단일 writer 순서 조정(위)이 필요 없다.
      - name: Deploy encoder (same image, skip if absent)
        run: |
          set -euo pipefail
          if ! az containerapp show -n vinc-encode -g vincsRG --output none 2>/dev/null; then
            echo "vinc-encode 없음 — 건너뛴다"
            exit 0
          fi
          az containerapp update \
            --name vinc-encode --resource-group vincsRG \
            --image vincacr.azurecr.io/vinc-hub:${{ github.sha }} --output none
          echo "vinc-encode 갱신: ${{ github.sha }}"

      - name: Verify health (MCP tools/list)
        run: |
          sleep 15
          curl -sf https://vinc-hub.grayplant-559d42e3.koreacentral.azurecontainerapps.io/mcp \
            -X POST -H "Authorization: Bearer ${{ secrets.VINC_MCP_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' \
            | grep -q '"tools"'

      # ⚠ tools/list 200 은 **OAuth 가 살아있다는 증거가 아니다.** 정적 bearer 로 붙기
      # 때문에 OAuth 가 통째로 꺼져도 통과한다 — 2026-07-30 사고가 정확히 그 상태였다
      # (`/health` 200 · tools/list 200 · 그런데 커넥터는 전면 불가).
      # 그래서 커넥터가 실제로 밟는 discovery 경로를 공개 도메인으로 확인한다.
      # DEPLOYMENT.md §4.4.2 의 수기 점검을 CD 로 옮긴 것.
      - name: Verify connector surface (OAuth discovery)
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            https://mcp.vincs.io/.well-known/oauth-protected-resource)
          [ "$code" = "200" ] || {
            echo "::error::oauth-protected-resource 가 $code — VINC_MCP_ISSUER 미설정이면 404 다" >&2
            exit 1; }

          # 미인증 POST 의 WWW-Authenticate 가 https 를 가리켜야 한다. issuer 가 없으면
          # `http://{Host}` 로 폴백해 클라이언트가 discovery 를 포기한다.
          hdr=$(curl -s -D - -o /dev/null -X POST https://mcp.vincs.io/mcp \
                 -H 'Content-Type: application/json' -d '{}' \
                 | tr -d '\r' | grep -i '^www-authenticate:' || true)
          echo "  $hdr"
          case "$hdr" in
            *'resource_metadata="https://'*) echo "  connector surface OK" ;;
            *) echo "::error::WWW-Authenticate 가 https 가 아니다: $hdr" >&2; exit 1 ;;
          esac
