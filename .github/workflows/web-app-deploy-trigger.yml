# 웹 Vinc 갱신 트리거 — `v*` 태그가 붙으면 Vinc-homepage 의 site-deploy 를 호출한다.
#
# 왜 별도 워크플로인가. 웹 Vinc(vincs.io/app/)의 소스는 이 레포의 `app/` 인데, 빌드·배포는
# **Vinc-homepage** 의 `site-deploy.yml` 이 한다(SWA 배포 토큰과 site/ 콘텐츠가 그쪽에 있다).
# 그 워크플로의 트리거는 `site/**` push 뿐이라, 이 레포에 앱 변경이 들어가도 저쪽에 site
# 변경이 없으면 웹은 옛 코드로 남았다. 실측(2026-08-03): 0.7.3 앱 변경이 10시간 동안 웹에
# 반영되지 않다가, 릴리스 노트를 고치려고 site/ 를 건드린 push 에 **우연히** 따라 올라왔다.
#
# site-deploy 는 이제 최신 `v*` 태그를 골라 빌드하므로(그쪽 머리주석), 갱신이 필요한
# 시점은 정확히 **새 태그가 붙는 순간**이다. 그 순간을 이 워크플로가 저쪽에 알린다.
# → 불변식: "웹 Vinc 에 있는 것은 항상 어느 릴리스와 정확히 같은 코드".
#
# release.yml 에 합치지 않은 이유: 데스크탑 릴리스 빌드(3 OS · 수십 분)와 수명이 다르고,
# 시크릿이 없을 때 이 잡이 붉게 실패하는 것이 **릴리스 자체를 붉게 만들면 안 된다**.
# 실패는 조용히 넘기지 않는다 — 여기서 넘기면 "웹이 갱신 안 됐다"를 아무도 모른다.
#
# ⚠ 필요 시크릿: `HOMEPAGE_DISPATCH_PAT` — Vinculums/Vinc-homepage 에 대한
#   **actions:write** 권한만 가진 전용 PAT(fine-grained 권장). 기존 PAT 재사용 금지:
#     · VINC_REPO_PAT(Vinc-homepage 에 등록) = Vinc 를 **읽는** 용도, 방향이 반대다.
#     · RELEASE_TOKEN = Vincs-app contents:write, 대상 레포가 다르다.
name: web-app-deploy-trigger

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    # 하는 일이 curl 한 번이라 체크아웃도 툴체인도 필요 없다.
    #
    # ── ⚠ 2026-09-02 에 셀프호스티드에서 호스티드로 옮겼다 (#164 의 후속) ──────
    # 여기 있던 주석이 자기 전제를 적어 두고 있었다: "러너가 꺼져 있으면 실패가
    # 아니라 큐에 남는다. 그래도 옮긴 이유는 **릴리스 빌드 자체가 이미 같은 러너에
    # 의존하기 때문**이고, 이 잡만 호스티드로 남기면 빌드가 안 도는 동안 트리거만
    # 먼저 날아간다."
    #
    # 그 전제가 #164 로 거짓이 됐다 — release.yml 의 네 잡이 전부 호스티드로 돌아갔다.
    # 남은 것은 첫 문장의 고장뿐이다: 큐에 남은 트리거는 나중에 도는 것이 아니라
    # 24시간 뒤 취소되고, 그러면 **웹 Vinc 가 릴리스와 어긋난 채 조용히 남는다** —
    # 이 워크플로가 존재하는 이유가 정확히 그 어긋남이었다(2026-08-03, 10시간).
    #
    # 두 번째 걱정도 성립하지 않는다. 저쪽 site-deploy 는 릴리스 산출물을 쓰지 않고
    # **Vinc 를 최신 v* 태그로 체크아웃해 app/ 을 직접 빌드**한다(그쪽 "Pin web Vinc
    # to a release tag"). 태그는 트리거가 날아가는 순간 이미 있으므로, 데스크탑
    # 빌드가 아직 도는 중이어도 웹은 옳은 소스로 지어진다. 둘은 원래 독립이다.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Vinc-homepage site-deploy
        env:
          PAT: ${{ secrets.HOMEPAGE_DISPATCH_PAT }}
          # 무엇이 이 실행을 일으켰는지 — 태그 push 면 그 태그, 수동이면 그렇게 적는다.
          # `github.ref_name` 을 그냥 쓰면 수동 실행에서 "최신 태그(main)" 처럼 **틀린
          # 문구**가 나온다(실측: run 30814822510). 로그가 거짓을 말하면 안 된다.
          WHY: ${{ github.event_name == 'push' && format('태그 {0}', github.ref_name) || '수동 실행' }}
        run: |
          set -euo pipefail
          if [ -z "${PAT:-}" ]; then
            echo "::error::HOMEPAGE_DISPATCH_PAT 시크릿이 없다 — 웹 Vinc 가 갱신되지" \
                 "않았다($WHY · 데스크탑 릴리스 자체는 영향 없음)." >&2
            echo "지금 반영하려면: Vinc-homepage → Actions → site-deploy → Run workflow." >&2
            echo "영구 해결: Vinc-homepage 에 actions:write 만 가진 PAT 를 이 이름으로 등록." >&2
            exit 1
          fi
          code=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $PAT" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Vinculums/Vinc-homepage/actions/workflows/site-deploy.yml/dispatches" \
            -d '{"ref":"main"}')
          # 204 = 수락(본문 없음). 그 밖은 전부 실패로 본다 — 특히 404 는 시크릿 권한
          # 부족이거나 워크플로 파일명이 바뀐 것이라 조용히 넘기면 원인을 못 찾는다.
          if [ "$code" != "204" ]; then
            echo "::error::site-deploy 호출 실패(HTTP $code) — 웹 Vinc 가 갱신되지 않았다($WHY)." >&2
            cat /tmp/dispatch.out >&2 || true
            exit 1
          fi
          # 어느 릴리스로 빌드되는지는 **site-deploy 가** 최신 v* 태그를 골라 정한다
          # (그쪽 Pin 스텝). 여기서 태그를 단정하지 않는다 — 그 판단은 저쪽 몫이다.
          echo "site-deploy 를 트리거했다($WHY) — 웹 Vinc 가 최신 v* 태그로 재빌드된다."
