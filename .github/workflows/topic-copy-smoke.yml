name: topic-copy-smoke
on:
  pull_request:
    paths:
      - '.github/workflows/topic-copy-smoke.yml'
      - 'scripts/qa/topic_copy_rehearsal.py'
      - 'tests/core/test_topic_copy_rehearsal.py'
      - 'api/topic_conversion*.py'
      - 'store/topic*.py'
permissions:
  contents: read
concurrency:
  group: topic-copy-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify only synthetic data in the execution container
        run: |
          set -euo pipefail
          docker build -t vinc-copy-smoke - <<'DOCKERFILE'
          FROM python:3.12-slim
          RUN pip install --no-cache-dir ladybug==0.21.2 argon2-cffi pyyaml pytest pytest-subtests
          DOCKERFILE
          docker run --rm --network none --cpus 1 --memory 2g --memory-swap 2g --pids-limit 128 \
            --read-only --security-opt no-new-privileges --cap-drop ALL \
            --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,nosuid,nodev,size=1g \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/src,readonly" --workdir /src \
            -e PYTHONDONTWRITEBYTECODE=1 -e VINC_LBUG_EXT_DIR=/src/packaging/lbug_extensions \
            vinc-copy-smoke python -m pytest -p no:cacheprovider tests/core/test_topic_copy_rehearsal.py -q
