# 복원 리허설 — 열어보지 않은 백업은 백업이 아니라 추측이다.
#
# 무엇을 하나. hub-data 공유의 스냅샷을 떠서(직접 복사는 SMB 락이
# FileLockConflict 로 거절한다 — 그래서 스냅샷), DB 파일을 러너로 내려받아
# **실제로 열고**(WAL 재생·확장 로드 포함) 라벨별 행 수를 센다. 판정은
# scripts/restore_rehearsal_check.py — "파일이 있다"가 아니라 "열리고, 행이 있다".
#
# 왜 필요한가. `db.recovered3.bad-20260809` 는 복사가 성공했고 크기도 맞았는데
# 열면 죽었다. 그리고 백업 잡(vincs-backup)의 성공 로그는 "그 파일이 열린다"를
# 말해 주지 않는다. 라이브가 `db.recovered6` 위에서 돈다는 것 자체가 이 검증을
# 미뤄 온 대가의 기록이다. 근거: [[vinc.ops.deployment]]
#
# 언제 돌리나. workflow_dispatch 전용 — 사람이 부른다(분기·월간 등 임의). 자동
# 스케줄을 안 다는 이유: 이 검증의 소비자가 사람이고, 실패 시 대응도 사람이다.
#
# 비용. 스냅샷은 차등 과금이라 몇 센트 수준이고 **마지막 스텝이 지운다**(실패해도
# always 로 지운다). 다운로드 egress 는 DB 크기만큼 1회. 스케일 변경 없음.
#
# ⚠ 로컬(수동) 우회로는 없다 — 로컬 az 신원(vinc-github-actions-plan 계열)은
# Reader 뿐이라 스냅샷 생성·키 조회가 안 된다(2026-09-02 실측). 이 워크플로의
# workflow_dispatch subject 만 Contributor(vinc-github-actions-deploy)를 받는다.
name: restore-rehearsal

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# concurrency 블록을 일부러 안 단다 — 이 리포는 직렬화 워크플로(cancel-in-progress:
# false) 명단을 테스트로 고정한다(test_gate_runner_move). 리허설은 동시에 돌아도
# 무해하다: 스냅샷 이름이 타임스탬프라 안 겹치고, 각 런이 자기 것만 지운다.

jobs:
  rehearse:
    name: restore rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RG: vincsRG
      STORAGE: vinchubssd01
      SHARE: hub-data
      APP: vinc-hub
    steps:
      # 손으로 돌리는 실행은 운영 담당만(repo 변수 PROD_OPERATORS, 쉼표로 구분한 로그인).
      # 실수 방지이지 보안 경계가 아니다: 쓰기 권한자는 이 단계를 지운 브랜치 판을 dispatch 할 수 있다.
      - name: 운영 실행은 운영 담당만
        if: github.event_name == 'workflow_dispatch' && !contains(format(',{0},', vars.PROD_OPERATORS), format(',{0},', github.triggering_actor))
        env:
          ACTOR: ${{ github.triggering_actor }}
        run: |
          echo "::error::이 워크플로를 손으로 돌릴 수 있는 계정은 PROD_OPERATORS 에 있는 것뿐이다(지금 $ACTOR). 필요하면 소유자에게 요청할 것."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # hub-deploy.yml 과 같은 이유 — 러너가 사람과 공유하는 기계일 수 있다.
      - name: Azure 프로필을 이 잡 전용으로
        run: echo "AZURE_CONFIG_DIR=$RUNNER_TEMP/azure-$GITHUB_RUN_ID" >> "$GITHUB_ENV"

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # DB 파일 이름을 하드코딩하지 않는다 — 복구 때마다 이름이 바뀌어 온 값이다
      # (recovered6 이 그 기록이다). 라이브 env 가 정본.
      - name: 라이브 DB 경로 해석 (VINC_DATA_DIR)
        id: live
        run: |
          set -euo pipefail
          env_of() {
            az containerapp show -n "$APP" -g "$RG" \
              --query "properties.template.containers[0].env[?name=='$1'].value | [0]" -o tsv
          }
          P=$(env_of VINC_STORE_SNAPSHOT)
          [ -n "$P" ] || P=$(env_of VINC_DATA_DIR)
          test -n "$P"
          case "$P" in /data/*) ;; *) echo '::error::snapshot is outside /data'; exit 1 ;; esac
          rel=${P#/data/}
          case "$rel" in ""|*/*|*..*) echo '::error::invalid snapshot basename'; exit 1 ;; esac
          durable=$(env_of VINC_DURABLE_ACK)
          case "${durable,,}" in 1|true|on) durable=on ;; *) durable=off ;; esac
          echo "DURABLE_ACK=$durable" >> "$GITHUB_ENV"
          echo "relpath=${P#/data/}" >> "$GITHUB_OUTPUT"
          echo "live DB: $P"

      - name: 공유 스냅샷 생성
        id: snap
        run: |
          set -euo pipefail
          TS=$(az storage share snapshot --account-name "$STORAGE" --name "$SHARE" \
                 --query snapshot -o tsv)
          test -n "$TS"
          echo "ts=$TS" >> "$GITHUB_OUTPUT"
          echo "snapshot: $TS"

      - name: 스냅샷에서 DB 내려받기
        run: |
          set -euo pipefail
          REL="${{ steps.live.outputs.relpath }}"
          TS="${{ steps.snap.outputs.ts }}"
          mkdir -p restored
          python scripts/restore_hub_snapshot.py --account "$STORAGE" --share "$SHARE" \
            --snapshot "$TS" --source "$REL" --out restored/db --durable-ack "$DURABLE_ACK"
          ls -la restored
          # copyStatus:success 인데 0바이트로 온 경합이 실제로 두 번 있었다 — 크기 검증.
          test -s restored/db

      - name: 열어서 센다 (판정)
        run: |
          set -euo pipefail
          engine=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['optional-dependencies']['embedded'][0])")
          case "$engine" in ladybug==0.20.4|ladybug==0.21.2) ;; *) echo '::error::unqualified engine'; exit 1 ;; esac
          pip install --quiet --disable-pip-version-check "$engine" argon2-cffi pyyaml
          export VINC_LBUG_EXT_DIR="$GITHUB_WORKSPACE/packaging/lbug_extensions"
          # 이전 런과의 대조는 사람이 한다 — 직전 런 로그의 카운트 표와 눈으로 비교.
          python -X utf8 scripts/restore_rehearsal_check.py restored/db

      # 같은 사본으로 두 번째 질문에 답한다: **이 파일은 내용만큼 큰가.**
      # 스냅샷은 매 더러운 60초마다 스토어를 통째로 SMB 로 미므로 파일 크기가 곧
      # 트랜잭션량이고, 그것이 3주 만에 3.5배가 됐다(16k → 105k/일, 스냅샷 1회
      # 63MB → 167MB). 내용은 그만큼 안 컸다 — 문서 197건·청크 약 1,500개다.
      # 논리 재구축 전후의 크기 비교만이 "죽은 공간"과 "진짜 내용"을 가른다.
      # 여기 붙이는 이유는 재료가 이미 여기 있어서다: 스냅샷도 사본도 이 잡이 떴다.
      # 근거: [[record:storage-transactions-are-the-snapshot-loop-and-they-tripled-in-three-weeks]]
      - name: 부풀었나 재본다 (논리 재구축 전후 크기)
        run: |
          set -euo pipefail
          export VINC_LBUG_EXT_DIR="$GITHUB_WORKSPACE/packaging/lbug_extensions"
          python -X utf8 scripts/store_size_probe.py restored/db

      # 리허설용 스냅샷은 남기지 않는다(복구 지점은 vincs-backup 볼트가 따로 쥔다).
      # ⚠ TS 가 비면 절대 부르지 않는다 — --snapshot 없는 delete 는 라이브 공유를 지운다.
      - name: 리허설 스냅샷 삭제 (비용 위생)
        if: ${{ always() && steps.snap.outputs.ts != '' }}
        run: |
          set -euo pipefail
          az storage share delete --account-name "$STORAGE" --name "$SHARE" \
            --snapshot "${{ steps.snap.outputs.ts }}" --output none
