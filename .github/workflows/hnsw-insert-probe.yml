# HNSW 삽입 프로브 — 이 브랜치(probe/hnsw-insert)에만 있다. main 에 올리지 않는다.
# 스크립트 정본은 scripts/probe_hnsw_insert.py. 허브와 같은 조합(linux x86_64 · ladybug
# 0.20.4 · 확장 v0.20.0 · 1024차원)과 옛 판(0.18.0)을 같은 스크립트로 잰다.
#
# 2회차: 1회차(런 36715816627)에서 0.20.4 의 interleave 만 10 중 6 이 죽었다. 그 짝을
# 가르는 대조(체크포인트 끔 · 리더 직렬화 · 삽입 없는 새 색인)와, 허브처럼 WAL 관용 재생을
# 켠 kill -9, 그리고 1코어 재빌드 시간을 잰다.
name: hnsw-insert-probe
on:
  push:
    branches: [probe/hnsw-insert]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: overlap, scenarios: "interleave,interleave_nockpt", trials: "10", tolerant: "", cpus: ""}
          - {name: controls, scenarios: "serial,ckptread", trials: "10", tolerant: "", cpus: ""}
          - {name: crash, scenarios: "crash,crashctl", trials: "10", tolerant: "on", cpus: ""}
          - {name: rebuild-1cpu, scenarios: "rebuild", trials: "2", tolerant: "", cpus: "0"}
          - {name: rebuild-2cpu, scenarios: "rebuild", trials: "2", tolerant: "", cpus: "0,1"}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      LBUG: "0.20.4"
      SCEN: ${{ matrix.scenarios }}
      TRIALS: ${{ matrix.trials }}
      GROUP: ${{ matrix.name }}
      CPUS: ${{ matrix.cpus }}
      VINC_WAL_REPLAY_TOLERANT: ${{ matrix.tolerant }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: engine and extensions
        run: |
          set -euo pipefail
          pip install "ladybug==${LBUG}" numpy
          mkdir -p "$RUNNER_TEMP/ext"
          cp packaging/lbug_extensions/*.lbug_extension "$RUNNER_TEMP/ext/"
          sha256sum "$RUNNER_TEMP/ext/"*
          echo "VINC_LBUG_EXT_DIR=$RUNNER_TEMP/ext" >> "$GITHUB_ENV"
          lscpu | head -20
      - name: probe
        run: |
          pin=()
          if [ -n "$CPUS" ]; then pin=(taskset -c "$CPUS"); fi
          "${pin[@]}" python -X utf8 scripts/probe_hnsw_insert.py run --work "$RUNNER_TEMP/work" \
            --scenarios "$SCEN" --trials "$TRIALS" --timeout 2400 \
            --out "$RUNNER_TEMP/probe-${LBUG}-${GROUP}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe2-${{ matrix.name }}
          path: ${{ runner.temp }}/probe-*.json
