# 허브 스토어 재구축 — 엔진의 EXPORT/IMPORT DATABASE 로 모든 행과 인덱스를 새 파일에
# 다시 짓고(measure), 허브를 그 파일로 갈아탄다(apply).
#
# 2026-09-27 사고 대응으로 만들었다. 스냅샷 CHECKPOINT 가 읽기와 겹쳐 엔진이 거듭 죽었고,
# 죽은 작업본이 그대로 다시 열려 영속본까지 갔다. 그 뒤 노드를 새로 넣는 쓰기가 전부
# "Primary-key index contains an invalid local node offset" 로 거절됐다 — `_PK` 가
# 행이 없는 곳을 가리킨다. 행에서 인덱스를 새로 세우는 것 말고 고칠 길이 없다.
# 판정과 절차는 `scripts/rebuild_store_native.py` 머리주석이 정본이다(여기 옮겨 적지 않는다).
#
# measure 는 무중단이다: 공유 스냅샷 사본을 받아 러너에서 재구축하고, 행 수·인덱스·쓰기
# 검사(재구축 전후)를 artifact 로 남긴다. 허브도 볼륨도 건드리지 않는다.
# apply 는 허브를 내리고(쓰기가 사본 뒤로 새지 않게) 같은 일을 한 뒤, 새 파일을 올리고
# VINC_DATA_DIR 을 그것으로 바꾼다. **원본 파일은 그대로 둔다** — 롤백은 VINC_DATA_DIR 을
# 되돌리는 것이다.
#
# 쓰기 권한(공유 스냅샷·키 조회·파일 업로드·env 교체)이 필요해 배포 신원으로만 돈다.
# 유지보수자의 로컬 az 는 Reader 다. pk-migrate.yml·hub-store-recover.yml 과 같은 모양.
#
# ⚠ 자동으로 돌지 않는다. apply 는 확인 문자열을 요구하고 허브를 몇 분 내린다.
#
# step=lex (VIN-273) 는 재구축 대신 v21 검색 색인 이관(`vinc migrate-lex`)을 사본에 돌린다.
# 허브는 기본 `VINC_LEX_BACKFILL=defer` 라 서비스 중에 색인을 옮기지 않는다 — 두 글자 묶음
# 색인 빌드는 DDL 가드로 프로세스 전체를 멈추고 허브 크기면 몇 분이다. measure 가 그 시간을
# 허브 엔진(0.20.4·리눅스)에서 재고, apply 가 같은 사본으로 갈아탄다.
# 근거: [[vinc.plan.korean-retrieval-p1-p2-2026-10-02 §2.7]]
name: hub-store-rebuild
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "measure = 사본으로 재구축·검사만(무중단) · apply = 허브를 내리고 재구축본으로 갈아탄다(중단)"
        type: choice
        options: [measure, apply]
        default: measure
      confirm:
        description: "apply 일 때만: step=rebuild 면 REBUILD, step=lex 면 LEX 라고 정확히 적을 것"
        type: string
        default: ""
      step:
        description: "rebuild = 엔진 EXPORT/IMPORT 재구축 · lex = v21 검색 색인 이관(vinc migrate-lex)"
        type: choice
        options: [rebuild, lex]
        default: rebuild
# hub-deploy 와 같은 줄에 선다 — 재구축 도중 배포가 끼어들면 두 리비전이 겹친다.
concurrency:
  group: hub-deploy
  cancel-in-progress: false
permissions:
  id-token: write
  contents: read
env:
  APP: "--name vinc-hub -g vincsRG"
  ACCOUNT: vincstorage01
  SHARE: hub-data
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Guard
        run: |
          set -euo pipefail
          want=REBUILD
          [ "${{ inputs.step }}" = "lex" ] && want=LEX
          if [ "${{ inputs.mode }}" = "apply" ] && [ "${{ inputs.confirm }}" != "$want" ]; then
            echo "::error::apply 하려면 confirm 에 $want 를 적을 것" >&2
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # ci.yml 과 같은 목록. 여기서 빠지면 스토어를 못 연다.
      - run: pip install ladybug==0.20.4 argon2-cffi pyyaml pypdf
      - name: Azure 프로필을 이 잡 전용으로
        run: echo "AZURE_CONFIG_DIR=$RUNNER_TEMP/azure-$GITHUB_RUN_ID" >> "$GITHUB_ENV"
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Azure Files 데이터 평면은 계정 키나 SAS 만 받는다(pk-migrate.yml 과 같은 이유).
      - name: Storage key
        run: |
          set -euo pipefail
          if ! key=$(az storage account keys list -n "$ACCOUNT" -g vincsRG \
                     --query "[0].value" -o tsv 2>/dev/null) || [ -z "$key" ]; then
            echo "::error::스토리지 계정 키를 못 읽는다 — 배포 주체에 listKeys 권한이 없다." >&2
            exit 1
          fi
          echo "::add-mask::$key"
          echo "AZ_KEY=$key" >> "$GITHUB_ENV"

      # 원본 이름을 적어 두지 않고 **지금 허브가 쓰는 것**을 읽는다. 하드코딩한 이름이
      # 라이브와 어긋나면 엉뚱한 파일을 재구축하고 그것으로 갈아탄다.
      - name: Resolve the live store
        run: |
          set -euo pipefail
          env_of() {
            az containerapp show $APP \
              --query "properties.template.containers[0].env[?name=='$1'].value | [0]" -o tsv
          }
          dir=$(env_of VINC_DATA_DIR)
          case "$dir" in
            /data/*) ;;
            *) echo "::error::VINC_DATA_DIR 이 /data 아래가 아니다: '$dir'" >&2; exit 1 ;;
          esac
          src=${dir#/data/}
          case "$src" in ""|*/*|*..*) echo "::error::원본 파일명이 이상하다: '$src'" >&2; exit 1 ;; esac
          if [ "${{ inputs.step }}" = "lex" ]; then
            dst="db.lex-$(date -u +%Y%m%d%H%M)"
          else
            dst="db.rebuilt-$(date -u +%Y%m%d%H%M)"
          fi
          pkns=$(env_of VINC_PK_NAMESPACED)
          echo "SRC=$src" >> "$GITHUB_ENV"
          echo "DST=$dst" >> "$GITHUB_ENV"
          # 쓰기 검사가 허브와 같은 키 규약으로 쓰게 한다.
          echo "VINC_PK_NAMESPACED=${pkns:-off}" >> "$GITHUB_ENV"
          echo "원본 /data/$src → 재구축본 /data/$dst (VINC_PK_NAMESPACED=${pkns:-off})"

      # ── apply 전용: 허브를 먼저 내린다 ──────────────────────────────────────
      # 재구축본은 스냅샷 시점의 사본이다. 허브가 떠 있으면 그 뒤의 쓰기가 갈아타는
      # 순간 사라진다. 내리면 사이드카가 마지막 스냅샷을 볼륨에 남긴다.
      - name: Stop the hub
        if: inputs.mode == 'apply'
        run: |
          set -euo pipefail
          actives=$(az containerapp revision list $APP --query "[?properties.active].name" -o tsv)
          for rev in $actives; do
            echo "deactivating: $rev"
            az containerapp revision deactivate $APP --revision "$rev" --output none
          done
          echo "STOPPED_REVS=$(echo $actives)" >> "$GITHUB_ENV"
          # 활성 플래그가 아니라 **살아 있는 레플리카**를 기다린다(hub-deploy 와 같은 이유).
          gone=0
          for i in $(seq 1 20); do
            act=$(az containerapp revision list $APP --query "[?properties.active] | length(@)" -o tsv)
            reps=$(az containerapp revision list $APP --query "[].properties.replicas" -o tsv 2>/dev/null \
                   | awk 'BEGIN{s=0} /^[0-9]+$/{s+=$1} END{print s}')
            echo "  active=$act replicas=$reps"
            if [ "$act" = "0" ] && [ "$reps" = "0" ]; then gone=1; break; fi
            sleep 10
          done
          [ "$gone" = "1" ] || { echo "::error::레플리카가 사라지지 않았다 — 재구축을 시작하지 않는다." >&2; exit 1; }
          sleep 10
          echo "레플리카 0 확인"

      # 스냅샷을 뜨고 거기서 받는다 — 라이브 파일은 SMB 잠금으로 복사가 거절되고,
      # SMB 위에서 임베디드 DB 를 직접 여는 것이 하드다운 4회의 공통 원인이었다.
      - name: Snapshot and download
        run: |
          set -euo pipefail
          snap=$(az storage share snapshot --name "$SHARE" \
                 --account-name "$ACCOUNT" --account-key "$AZ_KEY" \
                 --query snapshot -o tsv)
          echo "snapshot: $snap"
          mkdir -p work
          az storage file download --share-name "$SHARE" --path "$SRC" --dest "work/$SRC" \
            --snapshot "$snap" --account-name "$ACCOUNT" --account-key "$AZ_KEY" --output none
          if az storage file download --share-name "$SHARE" --path "$SRC.wal" --dest "work/$SRC.wal" \
             --snapshot "$snap" --account-name "$ACCOUNT" --account-key "$AZ_KEY" --output none 2>/dev/null; then
            echo "WAL 동봉"
          else
            echo "WAL 없음"
          fi
          # 0 바이트를 올린 적이 있다 — 받은 크기를 본다.
          ls -la work
          [ -s "work/$SRC" ] || { echo "::error::받은 원본이 비었다" >&2; exit 1; }

      # measure 와 apply 가 같은 재구축을 돈다. 판정이 어긋나면 스크립트가 대상을 지우고
      # 1로 끝나므로 반쯤 지은 파일은 올라가지 않는다.
      - name: Rebuild and check
        run: |
          set -euo pipefail
          # 확장(FTS·벡터)은 리포에 번들된 것을 명시 경로로 싣는다 — 러너에는 설치본이 없어
          # 이름으로는 못 싣는다(restore-rehearsal.yml 과 같은 설정).
          export VINC_LBUG_EXT_DIR="$GITHUB_WORKSPACE/packaging/lbug_extensions"
          if [ "${{ inputs.step }}" = "lex" ]; then
            # 사본에 이관한다. 원본 파일(work/$SRC)은 건드리지 않는다. 같이 받은 WAL 은 사본 쪽
            # 이름으로 옮겨 여는 순간 재생되게 한다. 판정(표지·빈 lex 0·벡터 수 불변)이 어긋나면
            # migrate-lex 가 3 으로 끝나 올리기 전에 멈춘다.
            cp "work/$SRC" "work/$DST"
            if [ -f "work/$SRC.wal" ]; then cp "work/$SRC.wal" "work/$DST.wal"; fi
            start=$(date +%s)
            python -m api.cli migrate-lex --data "work/$DST" | tee work/rebuild.json
            echo "migrate-lex wall: $(( $(date +%s) - start ))s"
            rm -f "work/$DST.wal"
          else
            python scripts/rebuild_store_native.py --data "work/$SRC" --out "work/$DST" --json \
              | tee work/rebuild.json
          fi

      - name: Upload the rebuilt store
        if: inputs.mode == 'apply'
        run: |
          set -euo pipefail
          az storage file upload --share-name "$SHARE" --source "work/$DST" --path "$DST" \
            --account-name "$ACCOUNT" --account-key "$AZ_KEY" --output none
          remote=$(az storage file show --share-name "$SHARE" --path "$DST" \
                   --account-name "$ACCOUNT" --account-key "$AZ_KEY" \
                   --query properties.contentLength -o tsv)
          local=$(stat -c %s "work/$DST")
          echo "올린 크기 $remote / 로컬 $local"
          [ "$remote" = "$local" ] || { echo "::error::올린 크기가 다르다 — 갈아타지 않는다(허브는 내려가 있다. 되살리려면 이전 리비전을 다시 활성화할 것)" >&2; exit 1; }

      - name: Switch the hub over
        if: inputs.mode == 'apply'
        run: |
          set -euo pipefail
          if ! az containerapp update $APP --set-env-vars "VINC_DATA_DIR=/data/$DST" --output none; then
            echo "::error::env 교체 실패 — **허브는 지금 내려가 있다.** 원본 /data/$SRC 는 그대로다." >&2
            prev=$(echo "${STOPPED_REVS:-}" | awk '{print $NF}')
            echo "되살리려면: az containerapp revision activate -n vinc-hub -g vincsRG --revision $prev" >&2
            exit 1
          fi
          latest=$(az containerapp show $APP --query "properties.latestRevisionName" -o tsv)
          echo "latest revision: $latest"
          for i in $(seq 1 30); do
            st=$(az containerapp revision show $APP --revision "$latest" \
                 --query "properties.runningState" -o tsv 2>/dev/null || echo "?")
            echo "  state: $st"
            case "$st" in Running|RunningAtMaxScale) exit 0 ;; esac
            sleep 15
          done
          echo "::error::새 리비전이 기동하지 못했다 — 허브는 내려가 있다. 되돌리려면 VINC_DATA_DIR 을 /data/$SRC 로 되돌릴 것." >&2
          exit 1

      # 살아 있음이 아니라 기능을 본다 — /health 200 은 빈 스토어도 준다.
      - name: Probe
        if: inputs.mode == 'apply'
        run: |
          set -euo pipefail
          out=$(curl -sf https://vinc-hub.grayplant-559d42e3.koreacentral.azurecontainerapps.io/mcp \
            -X POST -H "Authorization: Bearer ${{ secrets.VINC_MCP_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')
          echo "${out:0:400}"
          echo
          case "$out" in
            *'"tools"'*) echo "tools/list 응답에 도구 목록이 있다" ;;
            *) echo "::error::허브가 응답했으나 tools/list 에 도구 목록이 없다" >&2; exit 1 ;;
          esac
          echo "⚠ 완료 판정은 이것이 아니다 — 거절되던 쓰기(문서 저장)를 한 번 해 볼 것."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hub-store-rebuild-${{ inputs.step }}-${{ inputs.mode }}
          path: work/*.json
