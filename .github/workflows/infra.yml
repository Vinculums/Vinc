# 인프라를 CI 가 적용한다 — 사람의 셸이 아니라.
#
# 왜 생겼나. `infra/` 는 선언만 있고 apply 가 유지보수자의 노트북에서만 가능했다.
# 그 배치의 문제는 권한이 아니라 **기록**이다: 무엇이 언제 적용됐는지가 그 셸에만
# 남고 사라진다. 이 리포는 같은 형태를 이미 겪었다 — 컨테이너 안에서 난 검증이
# Actions 기록을 안 남겨서 `verify-hosted.yml` 을 만들었다. apply 는 검증보다 더
# 남아야 하는 행위다.
#
# 그리고 목표가 하나 더 있다: **에이전트가 끝까지 갈 수 있는 구간을 늘린다.**
# 에이전트는 `infra/` 를 고쳐 PR 을 열고, 이 워크플로가 plan 을 그 PR 에 붙인다.
# 사람은 읽고 방아쇠만 당긴다. 에이전트의 자격증명은 그대로 읽기 전용이고
# (`concept:agent-infra` 의 never 에 apply 가 있다), apply 하는 것은 사람이 시작한
# GitHub 의 단발 OIDC 토큰이지 어느 기계에 놓인 시크릿이 아니다.
#
# ⚠ 이 워크플로는 **main push 로 안 돈다.** 배포(hub-deploy·site-deploy)와 다른
#   점이 여기다. 인프라 변경은 머지가 곧 적용이면 안 된다 — 되돌리기가 비싸고
#   (하드다운 넷이 이 평면에서 났다) plan 을 사람이 읽는 단계가 그 값의 전부다.
#
# 근거: [[vinc.ops.infrastructure-risk-2026-09-01]]
#       [[vinc.ops.azure-identity-split-2026-08-30]]
name: infra

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:
    inputs:
      confirm:
        description: "적용하려면 정확히 apply 라고 입력한다. 그 밖의 값이면 plan 만 돈다."
        required: true
        default: "plan"

# OIDC 로 붙는다. 이 리포에는 Azure 시크릿이 없고 앞으로도 없어야 한다 —
# federated credential 의 subject 가 리포와 ref 라 토큰이 여기서만 발급된다.
permissions:
  id-token: write
  contents: read
  pull-requests: write

# 인프라 적용은 취소하지 않고 직렬화한다. state 에 잠금이 걸리므로 동시 실행은
# 뒤엣것이 락 대기로 죽고, 그보다는 줄 세우는 편이 읽기 쉽다. 취소하지 않는 이유는
# hub-deploy 와 같다: 도중에 끊긴 apply 가 가장 나쁘다.
concurrency:
  group: infra
  cancel-in-progress: false

env:
  TF_VERSION: "1.9.8"
  # backend 가 계정 키 대신 Entra 신원으로 blob 에 붙는다(versions.tf 참조).
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # state 컨테이너를 여기서 보장한다. 사람이 한 번 만들어 두는 방법도 있지만,
      # 그러면 "언젠가 한 번 했던 수동 단계"가 하나 늘고 그것이 이 리포가 반복해서
      # 다친 자리다(허브 env 가 그렇게 사라졌다). idempotent 한 한 줄이면 그 부채가
      # 아예 안 생긴다.
      # ⚠ `--auth-mode login` — 계정 키를 안 쓴다. 키를 쓰면 listKeys 가 필요해지고
      #   그러면 시크릿을 state 에서 몰아낸 의미가 사라진다.
      - name: Ensure the state container exists
        run: |
          az storage container create \
            --name tfstate \
            --account-name vincstorage01 \
            --auth-mode login \
            --output none
          echo "tfstate 컨테이너 준비됨"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Format check
        run: terraform -chdir=infra fmt -check -diff

      - name: Init
        run: terraform -chdir=infra init -no-color -input=false

      - name: Validate
        run: terraform -chdir=infra validate -no-color

      # plan 을 파일로 저장한다. apply 가 이 파일을 쓰므로 **사람이 읽은 것과 적용되는
      # 것이 같은 계획**이다. 다시 plan 해서 적용하면 그 사이에 바뀐 것이 조용히 섞인다.
      - name: Plan
        id: plan
        run: |
          set -o pipefail
          terraform -chdir=infra plan -no-color -input=false -out=tfplan \
            | tee /tmp/plan.txt
          {
            echo '## terraform plan'
            echo
            echo '```'
            # 앞부분의 refresh 소음을 걷고 요약과 변경만 남긴다. 사람이 읽는 것이
            # 이 워크플로의 산출물이므로 읽히는 모양으로 낸다.
            grep -vE '^(azurerm_|data\.).*: (Refreshing|Reading|Read complete|Refresh complete)' /tmp/plan.txt | tail -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # PR 에도 같은 것을 붙인다. 요약은 런을 열어야 보이고, PR 코멘트는 리뷰 화면에
      # 그대로 온다 — 에이전트가 연 PR 을 사람이 읽는 자리가 거기다.
      - name: Comment the plan on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = fs.readFileSync('/tmp/plan.txt', 'utf8')
              .split('\n')
              .filter((l) => !/^(azurerm_|data\.).*: (Refreshing|Reading|Read complete|Refresh complete)/.test(l))
              .join('\n');
            const LIMIT = 60000;
            if (body.length > LIMIT) body = body.slice(-LIMIT);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '## terraform plan\n\n```\n' + body + '\n```',
            });

      # ⚠ 유일한 쓰기 지점이다. `workflow_dispatch` 이고, 입력이 정확히 `apply` 여야
      #   돈다. 방아쇠를 두 번 당기게 만드는 이유는 오타나 잘못 누른 버튼이 인프라를
      #   바꾸면 안 되기 때문이다 — 이 평면의 되돌리기는 배포와 달리 비싸다.
      - name: Apply
        if: github.event_name == 'workflow_dispatch' && inputs.confirm == 'apply'
        run: terraform -chdir=infra apply -no-color -input=false tfplan

      # 적용했으면 무엇이 남았는지 말한다. plan 이 비어야 정상이다 — 안 비면 apply 가
      # 자기가 선언한 것을 다 만들지 못했거나 drift 가 즉시 생긴 것이고, 둘 다 조용히
      # 넘어가면 안 된다.
      - name: Verify the plan is now empty
        if: github.event_name == 'workflow_dispatch' && inputs.confirm == 'apply'
        run: |
          set -o pipefail
          terraform -chdir=infra plan -no-color -input=false -detailed-exitcode && rc=0 || rc=$?
          if [ "$rc" = "2" ]; then
            echo "::error::apply 뒤에도 plan 이 비어 있지 않다 — 적용되지 않은 변경이 남았거나 즉시 drift 다" >&2
            exit 1
          fi
          [ "$rc" = "0" ] || exit "$rc"
          echo "apply 후 plan 이 비었다 — 선언과 실물이 일치한다"
