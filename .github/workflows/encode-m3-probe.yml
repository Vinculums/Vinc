# bge-m3 인코더를 **임시 앱에서** 재고 지운다. 프로덕션 두 앱은 건드리지 않는다.
#
# ## 왜 계획대로 "무트래픽 리비전" 이 아닌가
#
# `vinc-encode` 와 `vinc-hub` 는 `activeRevisionsMode: Single` 이다. 이 모드에서 인그레스는
# 언제나 latest 로만 간다(`hub-deploy.yml` 의 롤백 주석이 실측으로 적는다). 즉 **무트래픽
# 리비전이라는 것이 없고**, 새 리비전은 만드는 즉시 라이브가 된다.
#
# 그리고 그렇게 하면 이 리포가 가장 두려워하는 고장이 난다: 허브(통과 접두)와 인코더(질의
# 접두)가 다른 모델이 되면 벡터가 다른 공간에 놓이는데, 코사인이 0.95~0.97 이라 **헬스체크도
# 로그도 통과한다.** `hub-deploy.yml` 의 "두 앱이 같은 이미지인가" 게이트가 존재하는 이유가
# 정확히 그것이고, 그 주석은 "모델 교체에서 정확히 이것이 막아야 할 고장"이라고 적는다.
# 재려고 그 불변식을 깨지 않는다.
#
# 그래서 같은 환경(`vinc-cae`)에 **세 번째 앱**을 띄운다. 프로덕션 두 앱의 이미지도 리비전도
# 그대로다. 측정이 끝나면 앱과 이미지를 지운다.
#
# ## 무엇을 재나
#
# `container-latency-probe.yml` 이 e5 로 재는 것과 같은 것을 m3 로: CPU 정체 · 콜드 첫 호출 ·
# 질의 p50/p95 · 패시지 처리량 · 컨테이너 안 RSS. 두 값을 나란히 놓으면 **모델 교체가 인코드에
# 얼마를 물리는지**가 나온다 — 막힌 함대 재구축 판정의 입력이다.
#
# ## 안전
#
# - `workflow_dispatch` 전용이고 확인 문구를 받는다. 자동으로 안 돈다.
# - 만드는 것은 `vinc-encode-m3probe` 하나. 프로덕션 이름 셋은 첫 스텝이 막는다.
# - 내부 인그레스만 연다 — 환경 밖에서 못 닿는다.
# - `if: always()` 로 앱과 ACR 리포지토리를 지우고, **프로덕션 두 앱이 그대로인지 확인**한다.
# - 토큰은 `vinc-encode` 의 것을 옮겨 쓴다(허브가 이미 그 값을 들고 있어야 호출이 선다).
#   값은 마스킹하고 명령줄에 안 올린다.
#
# ⚠ **`--ref main` 으로만 돈다.** OIDC 연합 자격증명이 `refs/heads/main` 에 묶여 있다.
#
# 정본: [[vinc.plan.retrieval-research-2026-09-08]] ·
# [[record:the-m3-encode-figure-needs-an-image-not-an-env-triple-2026-09-08]]
name: encode-m3-probe

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "프로덕션 레지스트리에 이미지를 굽고 임시 앱을 만든다. 진행하려면 MEASURE-M3 를 입력."
        required: true
        default: ""

permissions:
  id-token: write
  contents: read

concurrency:
  group: encode-m3-probe
  cancel-in-progress: false

env:
  PROBE_APP: vinc-encode-m3probe
  PROBE_REPO: vinc-m3probe
  RG: vincsRG
  CAE: vinc-cae

jobs:
  probe:
    runs-on: [self-hosted, linux, vinc-local]
    timeout-minutes: 60
    steps:
      - name: 확인 문구와 이름 가드
        run: |
          set -euo pipefail
          [ "${{ inputs.confirm }}" = "MEASURE-M3" ] || {
            echo "::error::confirm 이 MEASURE-M3 가 아니다 — 아무것도 안 한다" >&2; exit 1; }
          # 아래 모든 스텝이 $PROBE_APP 만 쓰므로, 이 한 줄이 "프로덕션을 안 건드린다" 의
          # 기계적 보증이다.
          case "$PROBE_APP" in
            vinc-hub|vinc-encode|vinc-account)
              echo "::error::PROBE_APP 이 프로덕션 앱 이름이다: $PROBE_APP" >&2; exit 1;;
          esac
          echo "대상: $PROBE_APP (임시). vinc-hub · vinc-encode 는 안 건드린다"

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 러너가 사람과 기계를 공유한다 — 프로필을 잡 전용으로 갈라 놓지 않으면 대화형
      # `az login` 하나가 이 잡의 토큰 캐시를 덮어쓴다(hub-deploy.yml 의 실측 주석).
      - name: Azure 프로필을 이 잡 전용으로
        run: echo "AZURE_CONFIG_DIR=$RUNNER_TEMP/azure-$GITHUB_RUN_ID" >> "$GITHUB_ENV"

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 남아 있는 이전 프로브가 있으면 먼저 지운다
        # 앞선 런이 정리 전에 취소되면 앱이 남는다. 그 위에 또 만들면 create 가 죽고,
        # 그러면 이번 런은 아무것도 재지 못한 채 실패한다.
        run: |
          set -euo pipefail
          if az containerapp show -n "$PROBE_APP" -g "$RG" --output none 2>/dev/null; then
            echo "이전 프로브 앱이 남아 있다 — 지운다"
            az containerapp delete -n "$PROBE_APP" -g "$RG" --yes --output none
          fi

      - name: 허브가 지금 도는 이미지를 base 로 잡는다
        # 모델만 다르고 코드는 같아야 e5 수치와 나란히 놓을 수 있다.
        run: |
          set -euo pipefail
          BASE=$(az containerapp show -n vinc-hub -g "$RG" \
                   --query 'properties.template.containers[0].image' -o tsv)
          [ -n "$BASE" ] || { echo "::error::허브 이미지를 못 읽었다" >&2; exit 1; }
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          echo "base image: $BASE"

      - name: bge-m3 를 러너에서 굽는다
        # ACR 에이전트는 양자화에서 OOM 이다(hub-deploy.yml 의 굽기 스텝 주석).
        # 폭은 하드코딩하지 않고 제품의 표에서 읽어 대조한다 — 여기 숫자를 적으면 이 파일이
        # 그 표의 또 다른 독자가 되고, 갈려도 아무도 모른다.
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check \
            onnx onnxruntime tokenizers numpy huggingface_hub
          python scripts/assert_m3_dim.py
          mkdir -p models
          VINC_EMBED_MODEL=BAAI/bge-m3 \
          VINC_EMBED_MODEL_PATH=models/bge-m3-int8-rr.onnx \
          VINC_EMBED_DIM=1024 \
            python packaging/bake_embed_model.py
          ls -la models/bge-m3-int8-rr.onnx

      - name: 오버레이 이미지를 굽는다 (ACR Tasks)
        run: |
          set -euo pipefail
          az acr build --registry vincacr \
            --image "$PROBE_REPO:${{ github.run_id }}" \
            --build-arg BASE="$BASE" \
            -f Dockerfile.m3probe .

      - name: 임시 앱을 만든다 (내부 인그레스 · 프로덕션과 같은 형상)
        # cpu/memory/replicas 를 vinc-encode 와 같게 둔다 — 다르면 수치가 옮겨지지 않는다.
        run: |
          set -euo pipefail
          TOK=$(az containerapp secret show -n vinc-encode -g "$RG" \
                  --secret-name encode-token --query value -o tsv)
          echo "::add-mask::$TOK"
          ACR_U=$(az acr credential show -n vincacr --query username -o tsv)
          ACR_P=$(az acr credential show -n vincacr --query 'passwords[0].value' -o tsv)
          echo "::add-mask::$ACR_P"
          az containerapp create -n "$PROBE_APP" -g "$RG" --environment "$CAE" \
            --image "vincacr.azurecr.io/$PROBE_REPO:${{ github.run_id }}" \
            --target-port 8791 --ingress internal --transport http \
            --cpu 1.0 --memory 2Gi --min-replicas 0 --max-replicas 1 \
            --registry-server vincacr.azurecr.io \
            --registry-username "$ACR_U" --registry-password "$ACR_P" \
            --secrets "encode-token=$TOK" \
            --env-vars VINC_EMBED_ENCODE_TOKEN=secretref:encode-token VINC_ROLE=encode \
            --output none
          FQDN=$(az containerapp show -n "$PROBE_APP" -g "$RG" \
                   --query 'properties.configuration.ingress.fqdn' -o tsv)
          [ -n "$FQDN" ] || { echo "::error::프로브 앱의 내부 주소를 못 읽었다" >&2; exit 1; }
          echo "PROBE_FQDN=$FQDN" >> "$GITHUB_ENV"
          echo "프로브 앱을 만들었다 (환경 안에서만 닿는다)"

      # ── 아래 probe.sh 에 대한 설명. **스크립트 안에 두지 않는다**: base64 로
      # `--command` 에 실려 쿼리 문자열로 나가고 주석까지 길이에 들어간다. 실측으로 3832
      # 바이트는 IIS 원시 404 로 죽었다([[record:the-probe-payload-outgrew-the-exec-command-limit-2026-09-08]]).
      # 텍스트 본문은 짧은 씨앗을 컨테이너 안에서 30번 이어 붙여 만든다(약 1560자). 인코더가
      # 512토큰에서 자르므로 각 텍스트는 워커가 보내는 조각과 같은 폭이 된다. 접두가 달라 같은
      # 문자열이 두 번 가지는 않는다. 앱 주소는 컨테이너 env 에 없으므로 첫 줄로 넣는다(비밀 아님).
      - name: 프로브를 base64 로 싼다
        run: |
          set -euo pipefail
          cat > probe.sh <<'SH'
          set -u
          echo "PROBE_CPU $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ *//')"
          echo "PROBE_NPROC $(nproc)"
          i=0
          while [ "$i" -lt 12 ]; do
            r=$(curl -s -o /dev/null -w '%{http_code} %{time_total}' --max-time 300 -H "Authorization: Bearer ${VINC_EMBED_ENCODE_TOKEN:-}" -H 'Content-Type: application/json' -d '{"texts":["cold start latency probe"],"kind":"query"}' "$U/encode" 2>/dev/null)
            echo "PROBE_ENCODE $i $r"
            i=$((i+1))
          done
          T=""; c=0
          while [ "$c" -lt 30 ]; do T="$T임베딩 워커 청크 조각 벡터 embedding worker chunk piece vector "; c=$((c+1)); done
          j=0
          while [ "$j" -lt 4 ]; do
            P=""; n=0
            while [ "$n" -lt 8 ]; do P="$P,\"p$j-$n $T\""; n=$((n+1)); done
            r=$(curl -s -o /dev/null -w '%{http_code} %{time_total}' --max-time 300 -H "Authorization: Bearer ${VINC_EMBED_ENCODE_TOKEN:-}" -H 'Content-Type: application/json' -d "{\"texts\":[${P#,}],\"kind\":\"passage\"}" "$U/encode" 2>/dev/null)
            echo "PROBE_BATCH $j $r 8"
            j=$((j+1))
          done
          echo "PROBE_DONE"
          SH
          sed -i "1i U=\"https://$PROBE_FQDN\"" probe.sh
          B64="$(base64 -w0 probe.sh)"
          if [ "${#B64}" -gt 2000 ]; then
            echo "::error::probe.sh 의 base64 가 ${#B64} 바이트다(상한 2000). exec 이 404 로 죽는다" >&2
            exit 1
          fi
          echo "probe.sh base64: ${#B64} 바이트 (상한 2000)"
          echo "B64=$B64" >> "$GITHUB_ENV"
          cat > encprobe.sh <<'SH'
          grep -m1 'model name' /proc/cpuinfo
          RSS=$(awk '/^VmRSS:/ {print $2}' /proc/[0-9]*/status 2>/dev/null | sort -n)
          echo "PROBE_RSS_N $(echo "$RSS" | grep -c .)"
          echo "PROBE_RSS_MAX_KB $(echo "$RSS" | tail -1)"
          echo "PROBE_RSS_SUM_KB $(echo "$RSS" | awk '{s+=$1} END {print s+0}')"
          SH
          echo "ENCB64=$(base64 -w0 encprobe.sh)" >> "$GITHUB_ENV"

      - name: 허브에서 프로브 앱을 부른다
        # `az containerapp exec` 는 TTY 를 요구하고(`script` 로 pty 를 만든다) `--command` 를
        # 공백으로 잘라 argv 로 보낸다(파이프의 공백을 ${IFS} 로 적는다). 둘 다
        # `container-latency-probe.yml` 의 실측 주석이 근거다.
        run: |
          set -uo pipefail
          timeout 600 script -qec "az containerapp exec -n vinc-hub -g $RG --command 'sh -c echo\${IFS}$B64|base64\${IFS}-d|sh'" /dev/null > hub.raw 2>&1 || true
          tr -d '\r' < hub.raw > hub.out
          grep -E '^PROBE_' hub.out || sed -n '1,15p' hub.out

      - name: 프로브 앱 안의 CPU 와 상주 크기
        continue-on-error: true
        run: |
          set -uo pipefail
          timeout 180 script -qec "az containerapp exec -n $PROBE_APP -g $RG --command 'sh -c echo\${IFS}$ENCB64|base64\${IFS}-d|sh'" /dev/null > enc.raw 2>&1 || true
          tr -d '\r' < enc.raw > enc.out
          sed -n '1,10p' enc.out

      - name: 판정
        run: python scripts/summarize_encode_probe.py hub.out enc.out >> "$GITHUB_STEP_SUMMARY"

      - name: 정리 — 앱과 이미지를 지운다
        if: always()
        run: |
          set -uo pipefail
          if az containerapp delete -n "$PROBE_APP" -g "$RG" --yes --output none 2>&1; then
            echo "앱 삭제: $PROBE_APP"
          else
            echo "::warning::앱 삭제 실패 — 손으로 확인할 것: $PROBE_APP"
          fi
          if az acr repository delete -n vincacr --repository "$PROBE_REPO" --yes --output none 2>&1; then
            echo "이미지 삭제: $PROBE_REPO"
          else
            echo "::warning::이미지 삭제 실패 — 손으로 확인할 것: $PROBE_REPO"
          fi

      - name: 프로덕션이 그대로인지 확인한다
        if: always()
        # 이 워크플로가 지켜야 하는 유일한 불변식. 앞이 실패해도 여기서 말한다.
        run: |
          set -uo pipefail
          h=$(az containerapp show -n vinc-hub    -g "$RG" --query 'properties.template.containers[0].image' -o tsv 2>/dev/null || echo "?")
          e=$(az containerapp show -n vinc-encode -g "$RG" --query 'properties.template.containers[0].image' -o tsv 2>/dev/null || echo "?")
          echo "hub    = $h"
          echo "encode = $e"
          if [ "$h" != "$e" ]; then
            echo "::error::프로덕션 두 앱의 이미지가 갈렸다 — 이 워크플로가 건드렸는지 즉시 확인할 것" >&2
            exit 1
          fi
          echo "프로덕션 두 앱 이미지 일치 — 안 건드렸다"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encode-m3-probe-${{ github.run_id }}
          path: |
            hub.out
            enc.out
          if-no-files-found: warn
