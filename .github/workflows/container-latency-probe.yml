# 살아 있는 컨테이너 **안에서** 잰다. 러너 위의 대역이 아니라 vinc-hub · vinc-encode 그
# 자체다. 배포도, 쓰기도, 인프라 변경도 없다.
#
# ## 왜 이게 따로 있는가
#
# `rerank-probe.yml` 은 러너 위 도커에서 ACA **형상**(1cpu·2GiB)을 흉내 낸다. 그것으로도
# 피크 RSS 는 나오지만 CPU 는 안 나온다 — 러너 풀이 이종이라 같은 아티팩트가 147ms 와
# 271ms 로 잰다(2026-09-04, 세 런에 CPU 세 종). 그래서 컨테이너 판단에 러너 수치를 쓰면
# 안 되고, 이 리포의 성능 정본이 오래 안고 있던 결함(M1 수치를 기계 경계 너머로 옮기는
# 것)을 반복하게 된다. 여기서는 그 경계를 넘지 않는다.
#
# ## 무엇을 재나
#
# 1. **허브 컨테이너의 CPU 정체** — `/proc/cpuinfo` 의 모델명과 관심 플래그.
#    `record:hub-encoder-cpu-has-vnni-2026-08-30` 이 인코더에서 한 번 쟀고, 그 기록 자신이
#    "Consumption 은 배포마다 하드웨어를 고정하지 않는다"고 적었다. 그래서 한 번이 아니라
#    잴 때마다 남긴다.
# 2. **허브 → 인코더 `/encode` 왕복 12회.** 컨테이너 안에서 `curl` 로 잰다. 인코더는
#    minReplicas 0 이라 **첫 호출이 콜드 경로**다 — 그 값을 따로 남긴다.
#    앞문으로 잰 값(`record:the-cold-window-is-nine-queries-not-one-2026-09-04`)에는
#    네트워크와 앞문이 섞여 있고, 여기 값에는 안 섞인다. 둘의 차가 곧 그 몫이다.
# 3. **인코더 컨테이너의 CPU 정체** — 위 왕복이 인코더를 깨운 **뒤에** 시도한다. 그전에는
#    레플리카가 없어 exec 자체가 안 된다(실측: "Could not find a replica for this app").
#
# ## 안전
#
# 읽기만 한다. `/encode` 는 허브가 질의마다 이미 부르는 그 호출이고, `/proc/cpuinfo` 는
# 공짜다. 모델을 새로 올리지 않는다 — 인코더에 이미 상주하는 것을 부를 뿐이라 메모리가
# 늘지 않는다. **컨테이너 안에서 양자화하거나 모델을 내려받지 않는다**: 그 경로가 2 GiB
# 안에서 OOM 이고, OOM 은 레플리카 재시작이며, 재시작 중에는 라이브 검색이 조용히 FTS
# 단독으로 강등된다.
#
# 토큰은 컨테이너 자신의 env 에서 읽어 컨테이너 안에서만 쓴다. 명령줄·로그·요약 어디에도
# 안 올라간다.
#
# ⚠ **`--ref main` 으로만 돈다.** OIDC 연합 자격증명이 `refs/heads/main` 에 묶여 있어서
# 브랜치에서 띄우면 `azure/login` 이 AADSTS700213 로 죽는다(`bake-probe.yml` 머리말).
# 그러니 이 프로브 자체를 고치는 변경은 머지된 뒤에야 프로브로 확인할 수 있다.
#
# ⚠ **`az containerapp exec` 는 TTY 를 요구한다.** 파이프에 붙이면 권한과 무관하게
# `termios.error: Inappropriate ioctl for device` 로 죽는다(실측 run 33883513566). CI 에도
# 터미널이 없으므로 `script -qec ... /dev/null` 로 pty 를 만들어 준다. az 의 제약이지
# 이 워크플로의 선택이 아니다.
#
# ⚠ 로컬 `az` 로는 안 된다. 이 리포의 개발 신원은 `vincsRG` 에 Reader 뿐이고
# `Microsoft.App/containerApps/getAuthToken/action` 이 없어 exec 이 거절된다(실측
# 2026-09-04). Actions 신원에는 있다 — 그래서 이 자리가 워크플로다.
#
# ## concurrency 를 일부러 안 단다
#
# 스토어·리비전·레지스트리 어느 것도 안 건드린다. 그리고 `cancel-in-progress: false` 를
# 다는 순간 직렬화 워크플로 명단을 넷으로 고정한 `tests/test_gate_runner_move.py` 가
# 떨어진다.
name: container-latency-probe

on:
  workflow_dispatch:
    inputs:
      calls:
        description: "인코더 왕복 횟수 (첫 호출은 콜드 후보라 따로 센다)"
        type: string
        default: "12"

permissions:
  id-token: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CALLS: ${{ inputs.calls }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure 프로필을 이 잡 전용으로
        run: echo "AZURE_CONFIG_DIR=$RUNNER_TEMP/azure-$GITHUB_RUN_ID" >> "$GITHUB_ENV"

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 프로브를 base64 로 싼다 (따옴표가 세 겹을 지나므로)
        # YAML → az → 컨테이너 셸을 지나는 동안 따옴표가 세 번 재해석된다. base64 는
        # 셸 메타문자가 없어서 그 세 겹을 통째로 건너뛴다.
        run: |
          set -euo pipefail
          cat > probe.sh <<'SH'
          set -u
          # ⚠ 컨테이너의 env 에 있는 것은 VINC_EMBED_REMOTE 다. VINC_EMBED_ENCODE 는
          # docker-entrypoint.sh 가 기동할 때 그것에서 파생하므로, exec 이 여는 새 셸에는
          # 없다. 둘 다 본다.
          U="${VINC_EMBED_REMOTE:-${VINC_EMBED_ENCODE:-}}"
          if [ -z "$U" ]; then echo "PROBE_ERR no-encode-url"; exit 0; fi
          U="${U%/}"
          echo "PROBE_CPU $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ *//')"
          echo "PROBE_NPROC $(nproc)"
          echo "PROBE_FLAGS $(grep -m1 '^flags' /proc/cpuinfo | tr ' ' '\n' | grep -Ex 'avx|avx2|avx512f|avx512_vnni|avx_vnni|amx_int8|f16c|fma' | tr '\n' ' ')"
          i=0
          while [ "$i" -lt "${CALLS:-12}" ]; do
            r=$(curl -s -o /dev/null -w '%{http_code} %{time_total}' --max-time 180 \
                -H "Authorization: Bearer ${VINC_EMBED_ENCODE_TOKEN:-}" \
                -H 'Content-Type: application/json' \
                -d '{"texts":["cold start latency probe"],"kind":"query"}' \
                "$U/encode" 2>/dev/null)
            echo "PROBE_ENCODE $i $r"
            i=$((i+1))
          done
          # 패시지 배치 — R5 가 묻는 처리량은 질의 지연이 아니라 이쪽이다. 워커가
          # 코퍼스를 채울 때 부르는 호출 모양(kind=passage · 여러 텍스트)을 그대로 쓴다.
          # 텍스트는 서로 다르게 둔다: 같은 문자열을 여덟 번 보내면 무엇이 캐시하는지
          # 모르는 채로 낙관적인 수를 얻는다.
          j=0
          while [ "$j" -lt "${BATCHES:-4}" ]; do
            r=$(curl -s -o /dev/null -w '%{http_code} %{time_total}' --max-time 180                 -H "Authorization: Bearer ${VINC_EMBED_ENCODE_TOKEN:-}"                 -H 'Content-Type: application/json'                 -d "{\"texts\":[\"throughput probe alpha $j the embedding worker splits a chunk into pieces of at most five hundred tokens and stores each as a child vector\",\"throughput probe bravo $j 임베딩 워커는 청크를 오백 토큰 이하 조각으로 나눠 조각마다 벡터를 만들고 자식으로 저장한다\",\"throughput probe charlie $j reciprocal rank fusion adds one over k plus rank across the arms and re-sorts the merged list\",\"throughput probe delta $j 상호 순위 융합은 팔마다 k 더하기 순위의 역수를 더해 합친 목록을 다시 정렬한다\",\"throughput probe echo $j the vector index is dropped on every document write because inserting into it segfaults the process\",\"throughput probe foxtrot $j 문서를 쓸 때마다 벡터 색인이 드롭된다 삽입이 프로세스를 죽이기 때문이다\",\"throughput probe golf $j quantization is part of the model and a self made int eight artifact must be verified on the deployment cpu\",\"throughput probe hotel $j 양자화는 모델의 일부이고 자체 빌드 int8 은 배포 대상 cpu 에서 검증해야 한다\"],\"kind\":\"passage\"}"                 "$U/encode" 2>/dev/null)
            echo "PROBE_BATCH $j $r 8"
            j=$((j+1))
          done
          echo "PROBE_DONE"
          SH
          # CALLS 를 스크립트 안으로 넣는다(컨테이너 env 에는 없다).
          sed -i "1i CALLS=${CALLS}" probe.sh
          sed -i "1i BATCHES=${BATCHES:-4}" probe.sh
          echo "B64=$(base64 -w0 probe.sh)" >> "$GITHUB_ENV"
          # 인코더 쪽도 같은 방식으로 싼다 — 공백이 섞이면 az 가 잘라 버린다.
          cat > encprobe.sh <<'SH'
          grep -m1 'model name' /proc/cpuinfo
          nproc
          # 상주 크기 — R5 의 세 번째 요구다. `ps` 가 없는 이미지가 있으므로 /proc 를
          # 직접 읽는다. 가장 큰 프로세스 하나와 합계를 함께 낸다: 워커가 하나뿐일
          # 것으로 **가정하지 않는다**(사이드카가 붙으면 합계만 2GiB 한도에 걸린다).
          RSS=$(awk '/^VmRSS:/ {print $2}' /proc/[0-9]*/status 2>/dev/null | sort -n)
          echo "PROBE_RSS_N $(echo "$RSS" | grep -c .)"
          echo "PROBE_RSS_MAX_KB $(echo "$RSS" | tail -1)"
          echo "PROBE_RSS_SUM_KB $(echo "$RSS" | awk '{s+=$1} END {print s+0}')"
          SH
          echo "ENCB64=$(base64 -w0 encprobe.sh)" >> "$GITHUB_ENV"

      - name: 허브 컨테이너 안에서 잰다
        # 실패해도 여기서 죽이지 않는다 — 판정 단계가 무엇이 없는지 말하게 한다.
        # exec 이 아무것도 안 내놓는 경우와 재는 데 실패한 경우는 다른 고장이다.
        run: |
          set -uo pipefail
          # 🔴 `az containerapp exec` 는 **TTY 를 요구한다.** 파이프에 붙이면
          # `_ssh_utils.get_stdin_writer` 가 `tty.setcbreak(sys.stdin.fileno())` 를 불러
          # `termios.error: (25, 'Inappropriate ioctl for device')` 로 죽는다(실측 run
          # 33883513566). 권한 문제가 아니다 — 거기까지 갔다는 것이 인증 통과의 증거다.
          # `script` 로 pty 를 만들어 준다. `timeout` 은 대화형 세션이 입력을 기다리며
          # 안 끝나는 경우를 자른다.
          # 🔴 그리고 az 는 `--command` 를 **공백으로 잘라 argv 로** 보낸다. 그래서
          # `sh -c '...'` 의 따옴표가 리터럴이 되고 스크립트가 $0 로 들어가, 컨테이너의
          # dash 가 `<b64>: 1: Syntax error: Unterminated quoted string` 을 낸다(실측
          # run 33884190912). 세 번째 토큰에 **공백이 하나도 없어야** 하므로 파이프의
          # 공백을 ${IFS} 로 적는다 — 컨테이너 셸이 그것을 공백으로 펴서 파이프가 선다.
          # `--command` 를 홑따옴표로 감싸는 이유는 `script` 가 여는 셸이 ${IFS} 를
          # 먼저 펴 버리지 않게 하기 위해서다(따옴표가 지나는 네 겹 중 두 번째).
          timeout 420 script -qec "az containerapp exec -n vinc-hub -g vincsRG --command 'sh -c echo\${IFS}$B64|base64\${IFS}-d|sh'" /dev/null > hub.raw 2>&1 || true
          tr -d '\r' < hub.raw > hub.out
          echo "--- 허브 exec 출력 (토큰은 안 실린다) ---"
          grep -E '^PROBE_' hub.out || sed -n '1,15p' hub.out

      - name: 인코더 컨테이너 안에서도 CPU 를 읽는다 (위 왕복이 깨운 뒤)
        continue-on-error: true
        # minReplicas 0 이라 왕복 전에는 레플리카가 없다. 그래도 스케일다운과 경합할 수
        # 있으므로 실패를 허용한다 — 이 값이 없다고 위의 측정이 무효가 되지는 않는다.
        run: |
          set -uo pipefail
          timeout 180 script -qec "az containerapp exec -n vinc-encode -g vincsRG --command 'sh -c echo\${IFS}$ENCB64|base64\${IFS}-d|sh'" /dev/null > enc.raw 2>&1 || true
          tr -d '\r' < enc.raw > enc.out
          sed -n '1,10p' enc.out

      - name: 판정
        # 초록이 "쟀다"를 뜻하게 만드는 자리. 수치가 없는데 초록인 런은 이 리포에 실제로
        # 있었다(`bake-probe.yml` 머리말의 run dem).
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os, pathlib, re, statistics, sys

          out = pathlib.Path("hub.out").read_text(encoding="utf-8", errors="replace")
          enc = pathlib.Path("enc.out").read_text(encoding="utf-8", errors="replace") \
              if pathlib.Path("enc.out").exists() else ""

          def one(tag):
              m = re.search(rf"^PROBE_{tag} (.*)$", out, re.M)
              return m.group(1).strip() if m else None

          calls = [(int(i), c, float(t)) for i, c, t in
                   re.findall(r"^PROBE_ENCODE (\d+) (\d+) ([\d.]+)$", out, re.M)]
          ok = [(i, t) for i, c, t in calls if c == "200"]
          # 패시지 배치 — 종류를 안 가르면 질의 한 건과 패시지 여덟 건이 한 분포에
          # 섞여 둘 다 못 읽는다. 처리량은 이쪽에서만 나온다.
          batches = [(int(i), c, float(t), int(n)) for i, c, t, n in
                     re.findall(r"^PROBE_BATCH (\d+) (\d+) ([\d.]+) (\d+)$", out, re.M)]
          bok = [(t, n) for i, c, t, n in batches if c == "200"]

          def pct(xs, q):
              xs = sorted(xs)
              return xs[min(len(xs) - 1, int(len(xs) * q))] if xs else None

          print("## 컨테이너 안에서 잰 값\n")
          print("| 항목 | 값 |\n|---|---|")
          print(f"| 허브 CPU | {one('CPU') or '읽지 못함'} |")
          print(f"| 허브 vCPU 수 | {one('NPROC') or '읽지 못함'} |")
          print(f"| 허브 플래그 | `{one('FLAGS') or '읽지 못함'}` |")
          if ok:
              first = ok[0][1] * 1000
              tail = sorted(t * 1000 for i, t in ok[1:])
              print(f"| /encode 첫 호출 | **{first:.0f} ms** (인코더 minReplicas 0 = 콜드 후보) |")
              if tail:
                  med = statistics.median(tail)
                  print(f"| 이후 중앙값 | **{med:.0f} ms** (최소 {tail[0]:.0f} · 최대 {tail[-1]:.0f}"
                        f" · 흩어짐 {(tail[-1]-tail[0])/med*100:.0f}%) |")
              print(f"| 성공/전체 | {len(ok)}/{len(calls)} |")
          if bok:
              # 첫 배치는 버리지 않는다 — 질의 루프가 이미 인코더를 깨웠으므로 여기는
              # 전부 웜이다. 콜드는 위 `/encode 첫 호출` 한 줄이 담당한다.
              ts = [t * 1000 for t, n in bok]
              texts = sum(n for t, n in bok)
              secs = sum(t for t, n in bok)
              print(f"| 패시지 배치 p50 / p95 | **{pct(ts, 0.5):.0f} ms** / {pct(ts, 0.95):.0f} ms"
                    f" (배치 {len(bok)}개 · 배치당 {bok[0][1]}건) |")
              print(f"| 패시지 처리량 | **{texts / secs:.1f} 건/초** ({texts}건 / {secs:.2f}s) |")
              print(f"| 배치 성공/전체 | {len(bok)}/{len(batches)} |")
          if ok:
              qs = [t * 1000 for i, t in ok[1:]]
              if qs:
                  print(f"| 질의 p50 / p95 | {pct(qs, 0.5):.0f} ms / {pct(qs, 0.95):.0f} ms (콜드 제외) |")
          encline = next((l for l in enc.splitlines() if "model name" in l), None)
          print(f"| 인코더 CPU | {encline.split(':', 1)[-1].strip() if encline else '읽지 못함(레플리카 없음일 수 있다)'} |")

          def encnum(tag):
              m = re.search(rf"^PROBE_{tag} (\d+)$", enc, re.M)
              return int(m.group(1)) if m else None

          rmax, rsum, rn = encnum("RSS_MAX_KB"), encnum("RSS_SUM_KB"), encnum("RSS_N")
          if rmax is not None:
              # 2 GiB 한도와 나란히 놓는다 — 이 숫자가 답해야 하는 질문이 "인코더와
              # 리랭커가 한 컨테이너에 들어가는가"이기 때문이다(계획 §4 의 셋째 조건).
              lim = 2 * 1024 * 1024
              print(f"| 인코더 최대 프로세스 RSS | **{rmax / 1024:.0f} MiB** |")
              print(f"| 인코더 전체 RSS 합 | {rsum / 1024:.0f} MiB / 2048 MiB "
                    f"({rsum / lim * 100:.0f}% · 프로세스 {rn}개) |")
          print()
          print("⚠ **이 런은 아무것도 배포하지 않았고 아무것도 쓰지 않았다.** `/encode` 는 허브가")
          print("질의마다 이미 부르는 호출이고, 모델을 새로 올리지 않았다.")
          print()
          print("⚠ **이 수치가 못 말하는 것**: 인코더 안의 CPU 시간만 따로 뗀 값(여기 값에는")
          print("컨테이너 사이 RTT 가 들어 있다) · 스케일다운을 부르는 유휴 시간(통제 안 함) ·")
          print("동거(다른 것이 같은 2GiB 에 상주할 때). Consumption 은 배포마다 하드웨어를")
          print("고정하지 않으므로 위의 CPU 줄은 **이 런의 사실**이지 상수가 아니다.")

          bad = []
          if not one("CPU"):
              bad.append("허브 CPU 를 못 읽었다 — exec 이 아무것도 내놓지 않았을 수 있다")
          if not ok:
              bad.append("성공한 /encode 왕복이 0건이다 — 이 런은 지연을 재지 않았다")
          if not bok:
              bad.append("성공한 패시지 배치가 0건이다 — 처리량을 재지 않았다")
          if bad:
              for b in bad:
                  print(f"::error::{b}", file=sys.stderr)
              sys.exit(1)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-latency-probe
          path: |
            hub.out
            enc.out
          retention-days: 7
