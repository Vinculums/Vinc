# 살아 있는 컨테이너 **안에서** 잰다. 러너 위의 대역이 아니라 vinc-hub · vinc-encode 그
# 자체다. 배포도, 쓰기도, 인프라 변경도 없다.
#
# ## 왜 이게 따로 있는가
#
# `rerank-probe.yml` 은 러너 위 도커에서 ACA **형상**(1cpu·2GiB)을 흉내 낸다. 그것으로도
# 피크 RSS 는 나오지만 CPU 는 안 나온다 — 러너 풀이 이종이라 같은 아티팩트가 147ms 와
# 271ms 로 잰다(2026-09-04, 세 런에 CPU 세 종). 그래서 컨테이너 판단에 러너 수치를 쓰면
# 안 되고, 이 리포의 성능 정본이 오래 안고 있던 결함(M1 수치를 기계 경계 너머로 옮기는
# 것)을 반복하게 된다. 여기서는 그 경계를 넘지 않는다.
#
# ## 무엇을 재나
#
# 1. **허브 컨테이너의 CPU 정체** — `/proc/cpuinfo` 의 모델명과 관심 플래그.
#    `record:hub-encoder-cpu-has-vnni-2026-08-30` 이 인코더에서 한 번 쟀고, 그 기록 자신이
#    "Consumption 은 배포마다 하드웨어를 고정하지 않는다"고 적었다. 그래서 한 번이 아니라
#    잴 때마다 남긴다.
# 2. **허브 → 인코더 `/encode` 왕복 12회.** 컨테이너 안에서 `curl` 로 잰다. 인코더는
#    minReplicas 0 이라 **첫 호출이 콜드 경로**다 — 그 값을 따로 남긴다.
#    앞문으로 잰 값(`record:the-cold-window-is-nine-queries-not-one-2026-09-04`)에는
#    네트워크와 앞문이 섞여 있고, 여기 값에는 안 섞인다. 둘의 차가 곧 그 몫이다.
# 3. **인코더 컨테이너의 CPU 정체** — 위 왕복이 인코더를 깨운 **뒤에** 시도한다. 그전에는
#    레플리카가 없어 exec 자체가 안 된다(실측: "Could not find a replica for this app").
#
# ## 안전
#
# 읽기만 한다. `/encode` 는 허브가 질의마다 이미 부르는 그 호출이고, `/proc/cpuinfo` 는
# 공짜다. 모델을 새로 올리지 않는다 — 인코더에 이미 상주하는 것을 부를 뿐이라 메모리가
# 늘지 않는다. **컨테이너 안에서 양자화하거나 모델을 내려받지 않는다**: 그 경로가 2 GiB
# 안에서 OOM 이고, OOM 은 레플리카 재시작이며, 재시작 중에는 라이브 검색이 조용히 FTS
# 단독으로 강등된다.
#
# 토큰은 컨테이너 자신의 env 에서 읽어 컨테이너 안에서만 쓴다. 명령줄·로그·요약 어디에도
# 안 올라간다.
#
# ⚠ **`--ref main` 으로만 돈다.** OIDC 연합 자격증명이 `refs/heads/main` 에 묶여 있어서
# 브랜치에서 띄우면 `azure/login` 이 AADSTS700213 로 죽는다(`bake-probe.yml` 머리말).
# 그러니 이 프로브 자체를 고치는 변경은 머지된 뒤에야 프로브로 확인할 수 있다.
#
# ⚠ **`az containerapp exec` 는 TTY 를 요구한다.** 파이프에 붙이면 권한과 무관하게
# `termios.error: Inappropriate ioctl for device` 로 죽는다(실측 run 33883513566). CI 에도
# 터미널이 없으므로 `script -qec ... /dev/null` 로 pty 를 만들어 준다. az 의 제약이지
# 이 워크플로의 선택이 아니다.
#
# ⚠ 로컬 `az` 로는 안 된다. 이 리포의 개발 신원은 `vincsRG` 에 Reader 뿐이고
# `Microsoft.App/containerApps/getAuthToken/action` 이 없어 exec 이 거절된다(실측
# 2026-09-04). Actions 신원에는 있다 — 그래서 이 자리가 워크플로다.
#
# ## concurrency 를 일부러 안 단다
#
# 스토어·리비전·레지스트리 어느 것도 안 건드린다. 그리고 `cancel-in-progress: false` 를
# 다는 순간 직렬화 워크플로 명단을 넷으로 고정한 `tests/platform/test_gate_runner_move.py` 가
# 떨어진다.
name: container-latency-probe

on:
  workflow_dispatch:
    inputs:
      calls:
        description: "인코더 왕복 횟수 (첫 호출은 콜드 후보라 따로 센다)"
        type: string
        default: "12"

permissions:
  id-token: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CALLS: ${{ inputs.calls }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure 프로필을 이 잡 전용으로
        run: echo "AZURE_CONFIG_DIR=$RUNNER_TEMP/azure-$GITHUB_RUN_ID" >> "$GITHUB_ENV"

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 프로브를 base64 로 싼다 (따옴표가 세 겹을 지나므로)
        # YAML → az → 컨테이너 셸을 지나는 동안 따옴표가 세 번 재해석된다. base64 는
        # 셸 메타문자가 없어서 그 세 겹을 통째로 건너뛴다.
        run: |
          set -euo pipefail
          # ── 아래 probe.sh 에 대한 설명. **스크립트 안에 두지 않는다**:
          # 이 파일은 base64 로 `--command` 에 실려 쿼리 문자열로 나가고, 주석까지
          # 길이에 들어간다. 실측으로 3832 바이트는 IIS 원시 404 로 죽었다.
          # ⚠ 컨테이너의 env 에 있는 것은 VINC_EMBED_REMOTE 다. VINC_EMBED_ENCODE 는
          # docker-entrypoint.sh 가 기동할 때 그것에서 파생하므로, exec 이 여는 새 셸에는
          # 없다. 둘 다 본다.
          # 패시지 배치 — R5 가 묻는 처리량은 질의 지연이 아니라 이쪽이다. 워커가
          # 코퍼스를 채울 때 부르는 호출 모양(kind=passage · 여러 텍스트)을 그대로 쓴다.
          #
          # 🔴 **텍스트를 여기 박지 않는다.** `az containerapp exec --command` 는 쿼리
          # 문자열로 나가고 길이 한도가 있다. 여덟 문장을 리터럴로 넣었더니 base64 가
          # 1348 → 3832 바이트가 됐고 exec 이 ARM 오류가 아니라 **IIS 원시 404**
          # (Handshake status 404)로 죽었다 — 실측 run 34242783620 · 34244842858.
          # 컨테이너 안에서 만들면 스크립트는 한 줄로 남는다.
          # 텍스트 본문은 짧은 씨앗을 컨테이너 안에서 30번 이어 붙여 만든다(약 1560자).
          # 인코더가 512토큰에서 자르므로 각 텍스트는 워커가 실제로 보내는 조각과 같은
          # **꽉 찬 폭**이 된다. 접두(`p$j-$n `)가 달라 같은 문자열이 두 번 가지는
          # 않지만, 본문은 반복이다 — ONNX 세션에 텍스트 간 캐시가 없으니 처리량에는
          # 무해하고, 그래도 이 수치는 "거의 같은 입력 여덟 건"의 처리량이다.
          cat > probe.sh <<'SH'
          set -u
          U="${VINC_EMBED_REMOTE:-${VINC_EMBED_ENCODE:-}}"
          if [ -z "$U" ]; then echo "PROBE_ERR no-encode-url"; exit 0; fi
          U="${U%/}"
          echo "PROBE_CPU $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ *//')"
          echo "PROBE_NPROC $(nproc)"
          echo "PROBE_FLAGS $(grep -m1 '^flags' /proc/cpuinfo | tr ' ' '\n' | grep -Ex 'avx|avx2|avx512f|avx512_vnni|avx_vnni|amx_int8|f16c|fma' | tr '\n' ' ')"
          i=0
          while [ "$i" -lt "${CALLS:-12}" ]; do
            r=$(curl -s -o /dev/null -w '%{http_code} %{time_total}' --max-time 180 \
                -H "Authorization: Bearer ${VINC_EMBED_ENCODE_TOKEN:-}" \
                -H 'Content-Type: application/json' \
                -d '{"texts":["cold start latency probe"],"kind":"query"}' \
                "$U/encode" 2>/dev/null)
            echo "PROBE_ENCODE $i $r"
            i=$((i+1))
          done
          T=""; c=0
          while [ "$c" -lt 30 ]; do T="$T임베딩 워커 청크 조각 벡터 embedding worker chunk piece vector "; c=$((c+1)); done
          j=0
          while [ "$j" -lt "${BATCHES:-4}" ]; do
            P=""; n=0
            while [ "$n" -lt 8 ]; do P="$P,\"p$j-$n $T\""; n=$((n+1)); done
            r=$(curl -s -o /dev/null -w '%{http_code} %{time_total}' --max-time 180 -H "Authorization: Bearer ${VINC_EMBED_ENCODE_TOKEN:-}" -H 'Content-Type: application/json' -d "{\"texts\":[${P#,}],\"kind\":\"passage\"}" "$U/encode" 2>/dev/null)
            echo "PROBE_BATCH $j $r 8"
            j=$((j+1))
          done
          echo "PROBE_DONE"
          SH
          # CALLS 를 스크립트 안으로 넣는다(컨테이너 env 에는 없다).
          sed -i "1i CALLS=${CALLS}" probe.sh
          sed -i "1i BATCHES=${BATCHES:-4}" probe.sh
          B64="$(base64 -w0 probe.sh)"
          # 🔴 **길이 가드.** `--command` 는 쿼리 문자열로 나간다. 실측으로 1348 은
          # 통과하고 3832 는 IIS 원시 404(Handshake status 404)로 죽는다 — 정확한
          # 한도는 모르므로 통과가 확인된 쪽 가까이에 못 박는다. 이 고장은 **exec 이
          # 인증 문제처럼 보이는** 모양이라(404 + 트레이스백) 원인을 찾는 데 두 런이
          # 들었다. 여기서 먼저 죽으면 그 두 런이 필요 없다.
          if [ "${#B64}" -gt 2000 ]; then
            echo "::error::probe.sh 의 base64 가 ${#B64} 바이트다(상한 2000). exec 이 404 로 죽는다 — 스크립트를 줄이거나 텍스트를 컨테이너 안에서 만들 것"
            exit 1
          fi
          echo "probe.sh base64: ${#B64} 바이트 (상한 2000)"
          echo "B64=$B64" >> "$GITHUB_ENV"
          # 인코더 쪽도 같은 방식으로 싼다 — 공백이 섞이면 az 가 잘라 버린다.
          cat > encprobe.sh <<'SH'
          grep -m1 'model name' /proc/cpuinfo
          nproc
          # 상주 크기 — R5 의 세 번째 요구다. `ps` 가 없는 이미지가 있으므로 /proc 를
          # 직접 읽는다. 가장 큰 프로세스 하나와 합계를 함께 낸다: 워커가 하나뿐일
          # 것으로 **가정하지 않는다**(사이드카가 붙으면 합계만 2GiB 한도에 걸린다).
          RSS=$(awk '/^VmRSS:/ {print $2}' /proc/[0-9]*/status 2>/dev/null | sort -n)
          echo "PROBE_RSS_N $(echo "$RSS" | grep -c .)"
          echo "PROBE_RSS_MAX_KB $(echo "$RSS" | tail -1)"
          echo "PROBE_RSS_SUM_KB $(echo "$RSS" | awk '{s+=$1} END {print s+0}')"
          SH
          echo "ENCB64=$(base64 -w0 encprobe.sh)" >> "$GITHUB_ENV"

      - name: 허브 컨테이너 안에서 잰다
        # 실패해도 여기서 죽이지 않는다 — 판정 단계가 무엇이 없는지 말하게 한다.
        # exec 이 아무것도 안 내놓는 경우와 재는 데 실패한 경우는 다른 고장이다.
        run: |
          set -uo pipefail
          # 🔴 `az containerapp exec` 는 **TTY 를 요구한다.** 파이프에 붙이면
          # `_ssh_utils.get_stdin_writer` 가 `tty.setcbreak(sys.stdin.fileno())` 를 불러
          # `termios.error: (25, 'Inappropriate ioctl for device')` 로 죽는다(실측 run
          # 33883513566). 권한 문제가 아니다 — 거기까지 갔다는 것이 인증 통과의 증거다.
          # `script` 로 pty 를 만들어 준다. `timeout` 은 대화형 세션이 입력을 기다리며
          # 안 끝나는 경우를 자른다.
          # 🔴 그리고 az 는 `--command` 를 **공백으로 잘라 argv 로** 보낸다. 그래서
          # `sh -c '...'` 의 따옴표가 리터럴이 되고 스크립트가 $0 로 들어가, 컨테이너의
          # dash 가 `<b64>: 1: Syntax error: Unterminated quoted string` 을 낸다(실측
          # run 33884190912). 세 번째 토큰에 **공백이 하나도 없어야** 하므로 파이프의
          # 공백을 ${IFS} 로 적는다 — 컨테이너 셸이 그것을 공백으로 펴서 파이프가 선다.
          # `--command` 를 홑따옴표로 감싸는 이유는 `script` 가 여는 셸이 ${IFS} 를
          # 먼저 펴 버리지 않게 하기 위해서다(따옴표가 지나는 네 겹 중 두 번째).
          timeout 420 script -qec "az containerapp exec -n vinc-hub -g vincsRG --command 'sh -c echo\${IFS}$B64|base64\${IFS}-d|sh'" /dev/null > hub.raw 2>&1 || true
          tr -d '\r' < hub.raw > hub.out
          echo "--- 허브 exec 출력 (토큰은 안 실린다) ---"
          grep -E '^PROBE_' hub.out || sed -n '1,15p' hub.out

      - name: 인코더 컨테이너 안에서도 CPU 를 읽는다 (위 왕복이 깨운 뒤)
        continue-on-error: true
        # minReplicas 0 이라 왕복 전에는 레플리카가 없다. 그래도 스케일다운과 경합할 수
        # 있으므로 실패를 허용한다 — 이 값이 없다고 위의 측정이 무효가 되지는 않는다.
        run: |
          set -uo pipefail
          timeout 180 script -qec "az containerapp exec -n vinc-encode -g vincsRG --command 'sh -c echo\${IFS}$ENCB64|base64\${IFS}-d|sh'" /dev/null > enc.raw 2>&1 || true
          tr -d '\r' < enc.raw > enc.out
          sed -n '1,10p' enc.out

      - name: 판정
        # 초록이 "쟀다"를 뜻하게 만드는 자리. 수치가 없는데 초록인 런은 이 리포에 실제로
        # 있었다(`bake-probe.yml` 머리말의 run dem).
        #
        # ⚠ 이 계산은 **워크플로 안의 인라인 파이썬이었다.** 그래서 테스트가 불가능했고,
        # 그동안 프로브 런 둘이 아무 수치도 못 내고 죽었다 — 계산이 틀렸어도 알 방법이
        # 없었다는 뜻이다. `encode-m3-probe.yml` 이 같은 파서를 필요로 하면서 두 벌이 될
        # 참이라, 스크립트로 빼고 합성 입력 테스트를 붙였다(tests/rag/test_summarize_encode_probe.py).
        run: |
          set -euo pipefail
          {
            python scripts/summarize_encode_probe.py hub.out enc.out               --title "컨테이너 안에서 잰 값 (shipped 모델)"
            echo "⚠ **이 런은 아무것도 배포하지 않았고 아무것도 쓰지 않았다.** \`/encode\` 는"
            echo "허브가 질의마다 이미 부르는 호출이고, 모델을 새로 올리지 않았다."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-latency-probe
          path: |
            hub.out
            enc.out
          retention-days: 7
