# 품질 게이트 — 코어(파이썬 498건) + 금지어 + 프론트 타입체크.
#
# 배경: 이 레포엔 `tests/` 에 37파일·498건이 있는데 **어떤 CI 에도 물려 있지
# 않았다** — 사람이 기억해서 `python verify.py` 를 칠 때만 돌았다. owner 격리
# (SEC-1)·쓰기 테넌시(SEC-3)·동기화 병합 같은 급소가 전부 그랬다. release.yml 의
# 사이드카 스모크는 "빌드가 실행되나"이지 기능 검증이 아니고, hub-deploy 의
# tools/list 확인은 **배포 후**라 배포를 막지 못한다(순서가 거꾸로다).
#
# ⚠ 이 워크플로의 급소 — **드라이버 미설치 시 조용한 초록**:
# tests/ 37파일 중 17개가 `@unittest.skipIf(_DRIVER is None, …)` 로 걸려 있다.
# ladybug 를 안 깔면 그 17개가 전부 skip 되고 CI 는 초록이 된다 — "통과"가 아니라
# "아무것도 안 돌았다"인데 구분이 안 된다. 그래서 verify 앞에 **드라이버 존재를
# 강제하는 게이트**를 둔다(아래 assert-driver 스텝). 이게 없으면 이 워크플로는
# 있으나 마나다.
#
# 모든 잡은 GitHub 호스티드 러너에서 돈다. 근거: [[vinc.ops.ci-runner-diagnosis]]
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# PR 에 빠르게 연달아 push 하면 앞선 실행을 취소한다(Actions 분 절약). PR 은 최신
# 커밋만 검증하면 되므로 중간 취소가 안전하다.
#
# **main 은 다르다.** main push 는 이미 머지된 커밋의 검증이고, 그 커밋은 뒤 커밋이
# 대체하지 않는다. 취소하면 그 머지에 대한 검증이 영영 없다.
#
# 2026-08-23 에 그 대가를 세 번 치렀다. 머지 셋이 각각 앞 머지의 검증 런을 죽였고
# (런 32622778350 · 32629159939 등, 전부 conclusion=cancelled), 그때마다 사라진 것은
# 한 번 관측되고 재현되지 않는 간헐 실패(TwoStoreTimeRoundtrip)의 다음 표본이었다.
# 재현 안 되는 실패의 표본은 분으로 다시 살 수 없다. 정본은 그래프의
# record:writing-a-trap-down-does-not-stop-it-a-check-does.
#
# 대가는 정직하게 적는다: main 런이 접히지 않으므로 연달아 머지하면 런이 그만큼 쌓인다.
# 이 워크플로의 잡은 전부 호스티드라 런끼리 서로를 기다리지 않는다. 남는 대가는 줄이
# 아니라 **분(minutes)** 이고, 그것은 rust 잡의 주석이 든다.
#
# ── ⚠ 위의 `cancel-in-progress` 하나로는 그것을 막지 못했다 (2026-08-30) ─────────
# `cancel-in-progress: false` 가 지키는 것은 **도는 중인** 런이다. 그런데 GitHub 은
# 한 그룹에 **대기 중인 런을 하나만** 둔다 — 새 런이 대기줄에 들어오면 먼저 기다리던
# 런은 `cancel-in-progress` 와 무관하게 취소된다. 그러니 앞의 처방은 런이 실제로 돌기
# 시작한 경우에만 닿고, 줄에서 기다리는 동안의 유실은 그대로 열려 있었다.
#
# 러너가 하나뿐이던 때는 그 조건이 예외가 아니라 상시였다. 2026-08-30 에 러너가 내려간
# 채로 머지 셋을 했더니 main 런이 이렇게 됐다:
#
#   31992e2 (#118) cancelled · a7f0253 (#119) cancelled · adb7554 (#122) pending
#
# 도는 런이 하나도 없으니 **모든** main 런이 pending 이고, 따라서 매 머지가 앞 머지의
# 검증을 밀어낸다. 2026-08-23 에 세 번 잃은 것과 같은 손실인데, 그때는 간헐이었고
# 지금은 규칙이다. 기존 기록: 그래프의
# record:cancel-in-progress-false-protects-the-running-run-not-the-queued-one 이
# 메커니즘을, decision:agent-orchestrator-read-the-run-list 가 그로부터 나온 규칙을,
# record:one-runner-makes-the-superseded-main-run-permanent-rather-than-occasional
# 이 2026-08-30 표본을 갖고 있다.
#
# 고치는 방법은 취소를 더 끄는 것이 아니라 **그룹을 가르는 것**이다. push 에서만 커밋
# sha 를 그룹 키에 넣으면 main 런끼리 애초에 같은 그룹에 들어오지 않으므로 서로를
# 밀어낼 수 없다. 커밋마다 검증이 하나씩 남고, 그것이 이 주석이 원래 요구하던 것이다.
#
# PR 쪽은 **그대로다.** `github.event_name == 'push'` 가 거짓이면 접미사가 빈 문자열이라
# 그룹 키는 종전과 글자 그대로 같고, 따라서 PR 에 연달아 push 하면 앞 실행이 취소되는
# 동작이 유지된다. 그것은 잃어도 되는 것이 맞다 — PR 은 최신 커밋만 참이면 된다.
#
# ⚠ 대가: main 런이 이제 **하나도 접히지 않는다.** 그것이 이 변경이 사는 대가고, 위
# 주석이 이미 고른 쪽이다 — 재현 안 되는 실패의 표본은 분으로 다시 살 수 없다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  # ── 무엇이 바뀌었나 ──────────────────────────────────────────────────────────
  # 왜 생겼나: **이 워크플로에는 경로 조건이 하나도 없었다.** 그래서 `app/src/copy.ts`
  # 한 줄만 고친 PR 도 `rust (cargo check)` 를 리눅스·윈도우 **양쪽**에서 돌렸다
  # (잡당 19~40분). 2026-08-30 에 머지한 셋(#118·#119·#122)이 전부 그랬다 — 러스트를
  # 건드린 것은 하나도 없다. 러너가 하나뿐이라 그 시간은 그대로 **다음 PR 의 대기열**이다.
  #
  # 서드파티 액션을 쓰지 않는다. 판정에 필요한 것이 `git diff --name-only` 하나뿐인데
  # 그걸 위해 남의 액션에 체크아웃과 토큰을 통과시킬 이유가 없다.
  #
  # ⚠ **거르는 것은 PR 뿐이다.** `main` push 는 전량 돈다. 이 리포는 이미 같은 이유로
  # main 런의 취소를 금지하고 있다(위 concurrency 주석) — 머지된 커밋의 검증은 뒤 커밋이
  # 대체하지 않으므로, 한 번 안 돈 것은 영영 안 돈 것이 된다. 간헐 실패의 표본도 거기서
  # 나온다. PR 은 다르다: 최신 커밋만 참이면 되고, 안 건드린 층은 잴 것이 없다.
  #
  # ⚠ `core` 는 **거르지 않는다.** 파이썬 스위트뿐 아니라 금지어·이스케이프·대비·디자인
  # 동기화·로스터 게이트가 전부 여기 살고, 그것들은 `app/src` 와 `design-hub/` 와
  # `agents/shells/` 를 읽는다. 입력이 리포 거의 전체라 조건을 달면 그 조건이 곧
  # 다음 구멍이다. 이 잡은 안전망이고 안전망은 조건부가 아니다.
  # (2026-09-26: 잡 안의 **꺼진 모드 스위트 스텝만** PR 에서 빠진다. 게이트는 그대로다 —
  # 이유는 그 스텝 위 주석.)
  changes:
    name: changes (path gate)
    # `app` 과 `rust` 가 `needs: changes` 라 이 잡이 늦으면 그 둘도 늦게 시작한다
    # (`core-pkns` 는 기다리지 않는다, 그 잡의 주석이 이유다). 하는 일이 `git diff
    # --name-only` 와 러너 이동 게이트뿐이라 호스티드에서 수십 초면 끝난다.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      app: ${{ steps.f.outputs.app }}
      rust: ${{ steps.f.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          # base..head 를 실제로 비교하려면 두 커밋이 다 있어야 한다. 얕은 체크아웃이면
          # `git diff` 가 "unknown revision" 으로 죽고, 그러면 아래 폴백이 전량 실행으로
          # 붙는다 — 안전하지만 이 잡의 목적이 사라진다.
          fetch-depth: 0

      # PR 제목 계약 — 스쿼시 머지에서 **그 제목이 곧 main 의 커밋 제목**이다.
      # 잡을 새로 만들지 않고 여기 붙인 이유는 분이다: 이 잡은 PR 마다 이미 돌고
      # 19초짜리라, 잡을 하나 더 세우면 실행 자체는 2초인데 청구는 1분부터 시작한다.
      #
      # ⚠ 제목을 `run:` 안에 `${{ }}` 로 펼치지 않는다 — 제목은 사람이 쓰는 문자열이라
      # 백틱이나 `$(…)` 가 들어오면 그대로 셸에서 돈다. `env:` 로 넘기면 셸이 값으로만 본다.
      - name: PR title contract (type prefix, English, no dash)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          # setup-python 을 쓰지 않는다. 이 잡은 컨테이너가 아니라 러너에서 바로 돌고
          # (#261 의 툴캐시 함정이 없는 자리다), 표준 라이브러리만 쓰는 스크립트다.
          PY=$(command -v python3 || command -v python)
          "$PY" -X utf8 scripts/gate_pr_title.py

      # 추적되는 모든 파일에 주인 팀이 있는가(.github/CODEOWNERS ← agents/teams.json).
      # 여기 두는 이유는 PR 제목 게이트와 같다 — 잡을 새로 세우면 청구가 1분부터
      # 시작한다. PR 에서는 BASE..HEAD 가 닿은 팀 목록도 남긴다(지표 원천이지 스위치가
      # 아니다: 이 출력으로 테스트를 끄지 않는다. 그 스위치의 이력은 `core-pkns` 주석).
      # 근거: Linear VIN-239, 계획서 vinc.plan.team-split.
      - name: Ownership gate (every tracked file has an owning team)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          PY=$(command -v python3 || command -v python)
          "$PY" -X utf8 scripts/gate_ownership.py

      # 허브의 역할 출력 게이트(vinc_mcp/role_output_gate.py)는 SDK 원본
      # (vinc_client/output_gate.py)에서 생성한 사본이다. 원본만 고치고 재생성을
      # 잊은 PR 을 여기서 막는다. 표준 라이브러리만 쓴다.
      - name: Role output gate copy is fresh
        run: |
          set -euo pipefail
          PY=$(command -v python3 || command -v python)
          "$PY" -X utf8 scripts/sync_output_gate.py --check

      # 죽은 코드 게이트(VIN-546). 파이썬은 vulture 신뢰도 80 이상, 허용 목록은
      # scripts/vulture-allow.txt(이름으로 불리는 훅만). 앱(TS)의 절반은 여기서 돌지
      # 않는다: app/tsconfig.json 의 noUnusedLocals·noUnusedParameters 를 `app` 잡의
      # `npm run build`(tsc)가 읽는다. 여기서 tsc 를 다시 돌리려면 npm ci 가 필요하다.
      # setup-python 을 쓰는 이유: 러너의 시스템 파이썬은 PEP 668 이라 pip 설치를 거절한다.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dead Python gate (vulture, 80 percent confidence)
        run: |
          set -euo pipefail
          pip install --quiet --disable-pip-version-check vulture==2.14
          python -X utf8 scripts/gate_vulture.py

      # 주석 속 이력 표지(날짜·이슈 키·PR 번호·경위 어휘)가 파일마다 기준선
      # scripts/comment-history-baseline.json 을 넘지 않는가. 래칫이라 줄이는 것은 늘
      # 통과하고, 낮아진 값은 `--write-baseline` 으로 다시 잠근다. 위 두 게이트와 같은
      # 이유로 여기 붙인다. BASE·HEAD 는 위반 파일에서 이 PR 이 더한 줄만 골라 보이는 데 쓴다.
      # 계약: [[vinc.canon.code-annotation]]
      - name: Comment history budget gate
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          PY=$(command -v python3 || command -v python)
          "$PY" -X utf8 scripts/gate_comment_history.py

      - id: f
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # PR 이 아니면(main push · workflow_dispatch) `python`·`app` 은 전부 켠다.
          # 판정을 시도조차 하지 않는다 — 위 주석의 이유다.
          #
          # ⚠ **`rust` 하나만 예외다(2026-09-01).** 이 예외는 위 규칙을 뒤집는 것이
          # 아니라 그 규칙의 근거가 이 잡에는 없기 때문이다:
          #
          # ① 위 규칙이 지키는 것은 **재현 안 되는 실패의 표본**이다(concurrency 주석의
          #    TwoStoreTimeRoundtrip). 그건 테스트 스위트의 성질이고, 이 잡은 테스트가
          #    아니라 `cargo check` 다 — 같은 입력에 같은 답을 내므로 표본이랄 게 없다.
          # ② 입력이 `app/src-tauri/` 하나뿐이라는 것은 **이 파일이 이미 PR 쪽에서
          #    단언하고 있다**(아래 러스트 셸 줄). 그 단언이 참이면 push 에서도 참이다.
          # ③ 대가가 컸다. 실측 2026-09-01: 호스티드 찬 캐시로 리눅스 6분 · 윈도우
          #    11분 15초(윈도우는 분을 2배로 센다). main 커밋 373건 중 이 크레이트를
          #    건드린 것은 **24건(6.4%)** 이었다(2026-08-02~09-01) — 나머지 93.6% 는
          #    같은 커밋을 다시 컴파일하는 데 쓰는 분이다.
          #
          # 못 구하면 **켠다.** 판정이 애매할 때 이 파일이 늘 고르는 방향이다.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "not a pull_request — app 은 전량 실행"
            echo "app=true" >> "$GITHUB_OUTPUT"
            before="${{ github.event.before }}"
            ok=1
            [ -n "$before" ] || ok=0
            [ "$before" != "0000000000000000000000000000000000000000" ] || ok=0
            if [ "$ok" = 1 ]; then
              pushed=$(git diff --name-only "$before" "${{ github.sha }}" 2>/dev/null) || ok=0
            fi
            if [ "$ok" != 1 ]; then
              echo "::warning::push 의 변경 목록을 못 구했다(before=$before) — rust 도 켠다"
              echo "rust=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "── 변경 파일(push)"; echo "$pushed"
            # 이 워크플로 자신이 바뀌면 켠다 — PR 쪽과 같은 이유다.
            if echo "$pushed" | grep -qE '^app/src-tauri/|^[.]github/workflows/ci[.]yml$'; then
              echo "rust=true" >> "$GITHUB_OUTPUT"
            else
              echo "rust=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          # diff 를 못 구하면 **전량 실행으로 붙는다**. 이 잡이 애매할 때 침묵하면
          # 검증이 조용히 사라지므로, 실패 방향은 언제나 "더 돌리는 쪽"이다.
          if ! files=$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null) || [ -z "$files" ]; then
            echo "::warning::변경 목록을 못 구했다($BASE..$HEAD) — 전량 실행으로 붙는다"
            { echo "app=true"; echo "rust=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "── 변경 파일"; echo "$files"
          has() { echo "$files" | grep -qE "$1"; }
          # 이 워크플로 자신이 바뀌면 전부 돈다 — 조건을 고친 사람이 그 조건이 실제로
          # 무엇을 켜고 끄는지 한 번은 봐야 한다.
          if has '^\.github/workflows/ci\.yml$'; then
            { echo "app=true"; echo "rust=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # ⚠ **파이썬 경로 필터는 없다.** 여기 있었고, 그것이 전량 pytest 를 끄는
          # 스위치였다 — 경위와 실측은 `core-pkns` 잡의 주석에 있다. 다시 만들지 말 것:
          # `core`·`core-pkns` 는 둘 다 무조건이고 이 잡이 거르는 것은 `app`·`rust` 뿐이다.
          # app 잡은 tsc 와 dev/*-check.ts 뿐이다. app/ 밖에서 읽는 것은 사이드카 계약
          # (api/contract/) 하나라 그것만 바뀌어도 돈다(dev/sidecar-contract-check.ts).
          has '^app/|^api/contract/' \
            && echo "app=true" >> "$GITHUB_OUTPUT" || echo "app=false" >> "$GITHUB_OUTPUT"
          # 러스트 셸. `app/src-tauri/` 밖의 변경이 컴파일을 깨뜨릴 길은 없다.
          has '^app/src-tauri/' \
            && echo "rust=true" >> "$GITHUB_OUTPUT" || echo "rust=false" >> "$GITHUB_OUTPUT"

      # ── 러너 이동 게이트 ────────────────────────────────────────────────────
      # 왜 여기인가: 이 잡이 이 워크플로에서 **base..head 를 가진 유일한 자리**다
      # (`fetch-depth: 0` 이 위에 있다). 게이트가 두 리비전의 워크플로를 비교해야
      # 하므로 다른 잡으로는 못 옮긴다.
      #
      # 무엇을 보나: `cancel-in-progress: false` 로 직렬화하는 워크플로의 `runs-on`
      # 이 이 PR 에서 바뀌는가. 바뀌면 머지 전에 그 워크플로의 큐를 비우라고 말한다 —
      # 머지 전에 만들어진 런은 옛 라벨을 기다리므로 그 러너가 없으면 영영 시작하지
      # 못하고 뒤를 전부 막는다(`Vinc#129` 에서 배포 넷이 그렇게 밀렸다).
      #
      # ⚠ 이것은 **적어 두는 대신 검사하는** 쪽을 고른 것이다. 같은 종류의 함정을
      # 레코드·계획서·PR 본문 세 곳에 적어 두고 십팔 분 뒤에 다시 밟은 이력이 있다:
      # [[record:writing-a-trap-down-does-not-stop-it-a-check-does]].
      #
      # PR 에서만 돈다. main push 에는 비교할 base 가 없고, 그때는 이미 늦었다.
      - uses: actions/setup-python@v5
        if: github.event_name == 'pull_request'
        with:
          python-version: "3.12"
      - name: Runner-move gate (serialising workflows)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install --quiet --disable-pip-version-check pyyaml
          python -X utf8 scripts/gate_runner_move.py "$BASE" "$HEAD" --check-queues
          echo "── 판정"; cat "$GITHUB_OUTPUT"

      # 홈페이지가 이 PR 의 MCP 도구 목록과 REST 레퍼런스를 따라왔는가. 홈페이지 CI 는
      # Vinc main 의 tool_reference.json·openapi_v1.json 으로 문서 페이지를 대조하므로,
      # 여기서 미리 말하지 않으면 뒤처진 것이 다음 홈페이지 PR 이 빨개질 때 드러난다.
      # 대조 대상은 공개된 문서 페이지다(홈페이지 리포는 비공개이고 읽을 토큰이 없다).
      # 알림이다: 홈페이지는 이 PR 이 머지돼야 따라올 수 있으므로 막지 않고, 차이는 경고
      # 주석과 스텝 요약으로 남긴다. 막을지는 소유자가 정한다. 셀프테스트를 먼저 돌린다.
      - name: Homepage drift notice (MCP tools and REST reference, advisory)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python -X utf8 scripts/gate_homepage_drift.py --selftest
          python -X utf8 scripts/gate_homepage_drift.py

      # 결정 문(모델 없음): 이 PR 이 건드린 파일을 다스리는 기록·결정을 호스티드 그래프에서
      # 찾아 스텝 요약에 적는다. 알림이다: 막지 않고, 실패해도 잡을 빨갛게 하지 않는다.
      # 잡을 따로 세우지 않은 이유는 위 PR 제목 게이트와 같다(청구가 1분부터, 이 잡은 이미
      # base..head 를 갖는다). 키는 저장소 시크릿 VINC_GATE_READ_KEY(읽기 전용 vinc_ro_ 키)이고
      # 사람이 넣는다. 없으면(포크 PR 은 늘 없다) 알리고 건너뛴다. 스페이스는 저장소 변수
      # VINC_GATE_SPACE(없으면 개인 그래프). 쓰기 키가 들어 있으면 실행 하나가 실행 기록
      # 하나가 되고, 원본 결과는 아래 아티팩트로 남는다.
      # 근거: [[vinc.plan.agent-harness-work-order-2026-10-25 §2]]
      - name: Decision gate notice (recorded decisions on touched paths, advisory)
        id: gate
        if: github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 3
        env:
          VINC_API_KEY: ${{ secrets.VINC_GATE_READ_KEY }}
          VINC_SPACE: ${{ vars.VINC_GATE_SPACE }}
          BASE_REF: ${{ github.base_ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -uo pipefail
          if [ -z "${VINC_API_KEY:-}" ]; then
            msg="Decision gate skipped: the repository secret VINC_GATE_READ_KEY is not set. A person adds a read-only Vinc key (vinc_ro_) there; fork pull requests never receive it."
            echo "::notice title=Decision gate::$msg"
            printf '### Decision gate\n\n%s\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          case "$VINC_API_KEY" in
            vinc_ro_*) ;;   # 읽기 전용: 실행 기록을 쓰지 않으므로 SDK 가 필요 없다
            *) pip install --quiet --disable-pip-version-check ./integrations/client/python || true ;;
          esac
          trace="$RUNNER_TEMP/decision-gate.json"
          python -X utf8 -m api.cli --target account --format json gate check \
            --diff "origin/$BASE_REF" --summary "$GITHUB_STEP_SUMMARY" --trace "$trace" \
            --run-id "$RUN_ID" --task-ref "$PR_URL" --host github-actions > "$RUNNER_TEMP/gate.out"
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::warning title=Decision gate::the gate did not run (exit $code); the step log has the error"
            printf '### Decision gate\n\nThe gate did not run (exit %s); the step log has the error.\n' "$code" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$trace" ]; then echo "trace=$trace" >> "$GITHUB_OUTPUT"; fi
          exit 0
      - name: Keep the decision gate result
        if: github.event_name == 'pull_request' && steps.gate.outputs.trace != ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: decision-gate
          path: ${{ steps.gate.outputs.trace }}
          retention-days: 30

  core:
    name: core (498 tests + forbidden-terms gate)
    # 호스티드 러너에서 돈다. 잡마다 새 VM 을 받으므로 `core-pkns` 와 디스크·임시
    # 디렉터리를 나누지 않고, 잡이 끝나면 아무것도 다음 런으로 넘어가지 않는다.
    # 러너 지형: [[vinc.ops.ci-runner-diagnosis]]
    #
    # ⚠ 대가는 분(minutes)이다. 청구 한도에 닿으면 이 잡은 큐에서 기다리지 않고 시작조차
    # 못 한 채 **실패**한다. 조용히 안 도는 것보다는 낫다는 것이 이 교환의 요지다.
    runs-on: ubuntu-latest
    # 스위트를 도는 런(main push)에서 4~6분이다. 여유를 크게 뒀다: 일정을 조이는 장치가
    # 아니라 **행(hang)을 잡는 장치**다.
    timeout-minutes: 45
    # 임시 디렉터리는 러너 기본값(디스크의 `/tmp`)을 쓴다. 호스티드 VM 에서는 tmpfs 로
    # 옮겨도 스위트가 빨라지지 않는다.
    # 근거: [[record:hosted-runners-run-the-test-suites-no-faster-with-the-temp-dir-on-tmpfs]]
    steps:
      - uses: actions/checkout@v4
        with:
          # 앱 보드 신선도 게이트가 캡처 리비전 뒤의 app/src 커밋을 센다. 얕은 체크아웃은
          # PR 병합 커밋을 부모 없는 뿌리로 읽어 거짓 FAIL 을 냈다(2026-09-06).
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # argon2-cffi 는 test_auth.py 의 자격 검증 경로(미설치 시 skip)에 필요하다.
      # pytest 는 verify.py 가 "stdlib 전용"이라 선언하는 것과 달리 **실제로 필요**하다:
      # tests/ 4개 모듈(test_mcp_connect·test_mcp_graph_proxy·test_mcp_store·test_purge)이
      # `import pytest` 로 fixture·raises 를 쓴다. unittest 러너로 수집되지만 import
      # 단계에서 죽어 _FailedTest 로 잡힌다(실측: 로컬 venv 엔 깔려 있어 안 드러났고
      # CI 에서 처음 드러났다 — 문서와 실제의 드리프트).
      - name: Install deps (ladybug pinned + argon2 + pytest + pypdf)
        # pypdf 는 tests/core/test_textextract 의 PDF 경로를 실제로 돌리기 위한 것이다.
        # 없어도 그 테스트는 skip 으로 통과하지만, 그러면 강등 계약만 검증되고
        # **추출 자체는 CI 에서 한 번도 안 돌게 된다**(조용한 초록).
        run: pip install ladybug==0.21.2 argon2-cffi pyyaml pytest pypdf

      # G0 확장은 **네트워크로 받지 않는다** — 리포에 커밋된 linux_amd64 바이너리를
      # VINC_LBUG_EXT_DIR 로 가리켜 명시 경로 로드시킨다(Dockerfile.hub 와 같은 방식).
      # ⚠ 이전엔 여기서 `INSTALL vector/fts/algo` 를 돌렸는데 러너에서
      # `SSL server verification failed` 로 죽었다(실측 — Docker Desktop 빌드에서도
      # 같은 증상이었고 그때도 번들로 우회했다). CI 가 외부 CDN 가용성에 묶여 있을
      # 이유가 없으므로 아예 의존을 끊는다.
      - name: Point to bundled G0 extensions (no network)
        run: echo "VINC_LBUG_EXT_DIR=$GITHUB_WORKSPACE/packaging/lbug_extensions" >> "$GITHUB_ENV"

      # ── 꺼진 모드 스위트는 main 에서만 돈다 ─────────────────────────────────
      # PR 에서는 아래 두 스텝(드라이버 확인 · verify.py)을 건너뛰고 게이트만 돈다.
      # 같은 PR 에서 `core-pkns` 가 **무조건** 전량 pytest 를 돌리고(그쪽이 허브가 실제로
      # 쓰는 켠 모드다), 이 잡의 unittest 수집은 그 pytest 수집의 부분집합이라(1536 ⊂
      # 1977, core-pkns 주석) PR 이 잃는 것은 "꺼진 모드에서만 깨지는 픽스처" 하나다.
      # 그것은 main push 가 잡는다 — main 은 여기를 전량 돌고, 빨가면 hub-deploy 가
      # 막히고 이슈가 열린다(hub-deploy 의 report 잡).
      #
      # 왜 줄이나: 호스티드 분이다. 이 두 스텝이 잡 시간의 거의 전부라, 건너뛰면 PR 의
      # 이 잡은 게이트만 돌고 1분 청구로 끝난다(스위트를 돌면 4~6분).
      # ⚠ 게이트(금지어·인용·이스케이프·대비·디자인·로스터)는 **조건이 없다** — 이 잡을
      # 안전망으로 만드는 것은 그쪽이고, 입력이 리포 거의 전체라 조건을 달면 구멍이 된다.
      # ⚠ `core-pkns` 에는 이런 `if` 를 달지 말 것 — tests/platform/test_ci_suite_is_unconditional.py 가
      # 막는다. 그쪽이 PR 에 남은 유일한 전량 스위트다.
      # 드라이버가 실제로 열리는지 확인 — 여기서 막아야 17개 파일의 조용한 skip 을
      # "통과"로 오독하지 않는다.
      - name: Assert driver is importable (no silent skips)
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import sys
          from store.embedded_backend import _import_driver
          drv, name = _import_driver()
          if drv is None:
              print("::error::임베디드 드라이버 미설치 — 17개 테스트 파일이 조용히 skip 된다", file=sys.stderr)
              sys.exit(1)
          print(f"driver ok: {name}")
          PY

      # 실행 건수 하한 — 테스트 발견(discover)이 깨져 몇 건만 돌고 초록이 되는 것을
      # 막는다. 로컬 실측 기준선은 381건(9 skip)이므로 300 을 바닥으로 둔다. 테스트가
      # 늘면 이 숫자는 그대로 둬도 되고, 대폭 줄었다면 그건 의도한 삭제인지 확인해야
      # 한다는 신호다.
      - name: Run test suite (verify.py)
        if: github.event_name != 'pull_request'
        run: |
          set -o pipefail
          python verify.py 2>&1 | tee verify.log
          ran=$(grep -oE '^Ran [0-9]+ tests' verify.log | grep -oE '[0-9]+' || echo 0)
          echo "ran=$ran"
          if [ "$ran" -lt 300 ]; then
            echo "::error::테스트 ${ran}건만 실행됨(하한 300) — discover 가 깨졌는지 확인" >&2
            exit 1
          fi

      # 카피 보이스 하드 룰(F1 과금 식별자 · F2 학습 프레이밍 · F7 구 명칭).
      # 정본은 Vinc-docs vinc/A/vinc.a.terms.md §4-6, 이 스크립트가 그 실행체다.
      - name: Forbidden-terms gate
        run: python scripts/gate_forbidden.py

      # 코드가 `[[...]]` 로 가리키는 그래프 문서·노드가 실재하는가. 오프라인이다 —
      # 대조 대상은 커밋된 scripts/graph-refs.json 이고 CI 에 그래프 키는 없다.
      # 매니페스트 갱신은 scripts/refresh_graph_refs.py 가 로컬에서 한다.
      # 이 게이트가 없던 동안 인용 24건 중 19건이 조용히 끊어져 있었다(2026-08-18).
      - name: Graph citation gate
        run: python -X utf8 scripts/gate_graph_refs.py
      - name: OpenAPI v1 drift gate
        run: python -X utf8 scripts/gen_openapi.py --check

      # 그래프 유래 문자열이 esc() 없이 innerHTML 로 가는가(감사 2026-08-18 M9). 팩으로
      # 들어온 노드 제목·태그가 공격자 통제 입력이라 이것이 HTML 주입이 된다. 오늘 코드
      # 실행이 아닌 이유는 CSP 에 script-src 가 없고 withGlobalTauri:false 라서다 — 그
      # 두 설정이 하중을 받고 있으므로 여기서 고정한다. contrast 게이트와 같은 이유로
      # core 잡에 산다(프런트에 테스트 러너가 없다).
      - name: Graph-value escape gate
        run: python -X utf8 scripts/gate_escape.py

      # View 마크 대비(WCAG 2.x AND APCA 이중). 여기 사는 이유: 프런트에는 테스트
      # 러너가 없고 app 잡은 tsc 만 돈다. 이 게이트는 생성물 theme.ts 를 읽는 순수
      # 파이썬이라 core 잡에서 도는 것이 맞다. 두 기준을 AND 로 거는 이유는 극성마다
      # 엄격한 쪽이 뒤집히기 때문이다(다크=APCA · 라이트=WCAG).
      - name: View contrast gate
        run: python scripts/gate_contrast.py

      # 디자인 허브(design-hub/)가 내보낸 생성물이 이 리포에서 손으로 고쳐졌는지.
      # 헤더의 "Do not hand-edit" 은 강제력이 없어서, 여기서 고친 색이 다음 재생성
      # 때 조용히 되돌아가고 그 사이 배포분만 SSoT 와 달랐다. 허브를 체크아웃하지
      # 않고 각인 해시만 보므로 교차 리포 PAT 이 필요 없다. 허브가 앞서간 경우
      # (동기화 누락)는 여기서 안 보이며 허브의 sync_out.py --check 가 잡는다.
      - name: Design sync gate
        run: python scripts/gate_design_sync.py

      # 허브가 같은 리포로 들어왔으므로(2026-08-08) 소비 사본이 허브 산출물과 같은지
      # 여기서 직접 볼 수 있다 — 교차 리포 체크아웃이 필요 없어졌다. 위의 각인 게이트가
      # "사본을 손댔나"를 보고, 이쪽이 "허브가 앞서갔나"를 본다.
      - name: Design hub drift gate
        run: python -X utf8 design-hub/scripts/sync_out.py --check

      # 하드코딩 색(D-S01). 허브 생성물은 AUTO-GENERATED 헤더로 제외하고, 정당한
      # 비-디자인 색(스프라이트 틴트 베이스 등)은 `ds-allow: <이유>` 주석으로 면제하되
      # **건수와 이유가 항상 출력된다** — 조용한 예외를 만들지 않기 위해서다.
      - name: Design surface gate (app)
        run: python -X utf8 design-hub/scripts/gate_surface.py app/src

      # Figma 가 토큰 SSoT 를 따라오고 있는가(정본=코드, decision:code-is-canon-figma-follows).
      # CI 에는 Figma 자격증명이 없으므로 라이브를 못 본다 — 커밋된 덤프
      # design-hub/imports/figma-live.json 과 SSoT 를 대조한다. 그래서 이 게이트가 잡는 것은
      # **"토큰을 고치고 Figma 를 갱신하지 않은 커밋"** 이다: 덤프를 초록으로 되돌리는
      # 유일한 정상 경로가 라이브를 다시 뜨는 것이라, 초록이면 Figma 도 갱신됐다는 뜻이 된다.
      # ⚠ 덤프를 손으로 고치면 이 추론이 깨진다(각인 게이트와 같은 종류의 한계다). 그래서
      # 그 파일 $meta 에 "패치 금지, 다시 뜰 것"을 적어 두었다.
      # 갱신법: 에이전트가 design-hub/scripts/figma_diff.py docstring 의 JS 를 use_figma 로
      # 돌려 덤프를 새로 쓰고, 차이가 있으면 --plan 대로 **Figma 를** 고친다(반대 아님).
      - name: Figma token drift gate
        run: python -X utf8 design-hub/scripts/figma_diff.py

      # 위 게이트가 토큰 **값**을 본다면 이쪽은 화면·모달·아이콘의 **목록**을 본다.
      # 잡는 것은 "코드에 화면이나 모달을 늘리면서 Figma 대응을 선언하지 않은 커밋"이다.
      # 아직 안 그린 것(2026-09-05 기준 31건)은 맵에 `None` 으로 **선언돼 있어** 실패로
      # 세지 않고 매 실행 목록으로만 나온다 — 그리지 않았다고 빨갛게 만들면 게이트가
      # 곧 꺼지기 때문이다. 그린 뒤 `None` 을 프레임 이름으로 바꾸면 그때부터 실재를 본다.
      - name: Figma inventory gate (screens · modals · icons)
        run: python -X utf8 design-hub/scripts/figma_inventory.py

      # ⚠ 사이트 문구 대조(`figma_copy.py --check`)는 **여기 없다**. 이 잡은 Vinc 만
      # 체크아웃하므로 그 게이트는 영원히 SKIP 했고, 초록 스텝이 검사한 것처럼 읽혔다
      # (2026-09-06 지적). 스냅샷과 대응표는 이 리포에 있고 사이트는 저쪽에 있으므로,
      # 소비 리포 CI 가 Vinc 를 읽기 전용으로 체크아웃해 거기서 돌린다:
      # Vinc-homepage/.github/workflows/site-ci.yml · site-deploy.yml.

      # 사이트 문구가 위 게이트라면 이쪽은 **앱 보드**다. 보드는 실행 중인 앱의 캡처라
      # 글자 대조는 물음이 아니고, 남는 물음은 캡처가 낡았는가다: 캡처 시점의 app/src
      # 트리 지문과 지금이 다르면 낡았다. 위 체크아웃의 fetch-depth 0 이 커밋 목록의
      # 전제다(판정 자체는 얕아도 선다). 사이트와 달리 Vinc-homepage 가 필요 없어 늘 돈다.
      #
      # ⚠ **여기서는 막지 않는다(2026-09-19 판정, VIN-74).** 처방이 재캡처 하나뿐인데
      # 그것은 실행 중인 사이드카와 실제 데이터가 있어야 도는 60상태·약 7분짜리 사람
      # 작업이다. CI 가 스스로 못 하는 일을 CI 가 요구하면 규칙이 지켜지지 않는다 —
      # 실제로 #358 이 재캡처 없이 머지돼 main 이 이 게이트로 빨간 채였다. 한동안 릴리스
      # 태그 앞(`release.yml` 의 `version-gate`)에서 막았는데, 2026-09-26 부터 거기서도
      # 경고만 낸다(발주자: 릴리스마다 재캡처는 쓸모없는 일). 보드가 낡아서 생기는 손해는
      # 디자이너가 옛 화면을 보는 것뿐이다. 여기서는 낡았다고 말만 하고 지나간다.
      # 근거: [[decision:figma-app-boards-no-longer-gate-a-release-2026-09-26]]
      - name: Figma app board copy gate (advisory)
        continue-on-error: true
        run: python -X utf8 design-hub/scripts/figma_app_copy.py

      # 역할 껍데기(agents/shells/*.md)가 손으로 고쳐졌는가. 정의의 정본은 그래프의
      # vinc/agent 도메인이고, 하네스는 실행 시점에 파일을 읽으므로 둘 다 있어야 한다.
      # 하네스가 읽는 사본은 리포 밖 워크스페이스 루트에 --install 이 쓰므로 CI 는 못 본다.
      # 오프라인이다 — 대조 대상은 커밋된 agents/roles.json 이고 CI 에 그래프 키는
      # 없다(그래프 인용 게이트와 같은 사유). 스냅샷 갱신은 토큰 있는 곳에서
      # scripts/agents_sync.py --pull 이 하고, 그 diff 는 사람이 읽는다.
      - name: Agent roster gate
        run: python -X utf8 scripts/agents_sync.py --check

  # ── PK 네임스페이싱 플래그 ON ────────────────────────────────────────────────
  # v0.8.4 axis 1(design A)은 `VINC_PK_NAMESPACED` 뒤에 산다. `core` 잡은 플래그가
  # **꺼진** 모드만 돈다(로컬·데스크탑의 영구 상태이고, 계약이 "꺼져 있으면 바이트
  # 동일"이다). 켠 모드가 CI 에 없으면 그쪽 경로는 **아무도 안 도는 코드**가 되고,
  # 그 상태로 허브에 켜는 것이 이 릴리스의 마지막 단계다.
  #
  # PR-C 가 질의·동기화 바인딩을 채우면서 **부분집합을 걷어냈다.** 이제 전량이다
  # (2026-08-23 실측: 켠 모드에서 origin/main 61 failed → 0). 목록이 없다는 것이
  # 계약이다 — 새 테스트는 두 모드 모두에서 초록이어야 하고, 한쪽만 초록인 것은
  # 픽스처가 층을 헷갈린 것이다(스토어에 직접 심는 시드는 물리 키를 써야 한다).
  core-pkns:
    name: core (VINC_PK_NAMESPACED=on)
    # ⚠ **조건이 없다 — 전량 pytest 를 도는 자리가 여기 하나뿐이기 때문이다.**
    #
    # `core` 가 부르는 `verify.py` 는 `unittest.TestLoader().discover` 로 수집하는데,
    # 그 로더는 **모듈 수준 `def test_*` 를 아예 못 본다**(tests/ 에 `load_tests` 도
    # 없다). 같은 트리를 두 로더로 세면 갈린다 — 실측 2026-09-07(6261e78):
    # unittest 1536건 · pytest 1977건. **441건이 이 잡에만 있고** 거기에
    # test_owner_isolation(15) · test_write_tenancy(14) · test_sync(22) ·
    # test_mcp_auth(14) · test_mcp_scoped_keys(16) · test_tool_contract(27) 이 든다.
    # 이 파일 머리말(`:3-5`)이 이 워크플로가 존재하는 이유로 지목한 그 케이스들이다.
    #
    # 여기 `needs: changes` 와 `if: ...python == 'true'` 가 있던 동안 그 441건을 끄는
    # 스위치가 **둘**이었다: 경로 필터가 false 이거나, `changes` 가 빨갛거나 큐에
    # 남거나. 둘 다 눌렸다 — 런 34044028449(#237, 지금의 main)는 `core-pkns skipped`
    # · `core success` 로 **초록으로 머지됐고** 그 실행에서 소유자 격리·쓰기 테넌시는
    # 한 건도 안 돌았다. 그래서 `if` 만이 아니라 `needs` 도 걷었다. `needs` 를 남기면
    # 두 번째 스위치가 그대로다(#233 이 그 경로였다: 의도된 빨강 하나가 나머지를 껐다).
    #
    # 되돌리려는 사람에게: 반대 방향의 판정이 이미 둘 있다 —
    # [[decision:core-pkns-stays-because-the-hub-runs-the-flag-on]] 이 "이 잡은 은퇴일이
    # 없고 PR 에서 내려오지 않는다"고 정했고,
    # [[decision:ci-runs-each-suite-once-per-merge-and-hub-deploy-waits-for-ci-2026-09-26]] 이
    # "core-pkns 와 모든 게이트는 조건 없이 돈다"고 정했다. 조건을 되살리려면 그 둘을 먼저 뒤집을 것.
    # 이 형태를 지키는 것은 tests/platform/test_ci_suite_is_unconditional.py 다.
    #
    # 대가는 정직하게 적는다: 이 잡이 PR 마다 늘 돌고, 아래 `runs-on` 이 호스티드라
    # 그 시간이 그대로 호스티드 분이다(런 39736992368 에서 11분). 호스티드 잡은 잡마다
    # 새 러너를 받으므로 `needs` 를 걷어도 `changes` 와 한 줄에 서지 않는다(동시 실행
    # 한도 안에서). 분이 아파져도 처방은 이 잡을 다시 조건부로 만드는 것이 아니다(위 두
    # 결정).
    #
    # 러너와 임시 디렉터리는 `core` 와 같다(그 잡의 주석).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VINC_PK_NAMESPACED: "on"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps (ladybug pinned + argon2 + pytest + pypdf)
        run: pip install ladybug==0.21.2 argon2-cffi pyyaml pytest pypdf
      - name: Point to bundled G0 extensions (no network)
        run: echo "VINC_LBUG_EXT_DIR=$GITHUB_WORKSPACE/packaging/lbug_extensions" >> "$GITHUB_ENV"
      # `core` 와 같은 이유로 드라이버를 강제한다 — 임베디드 왕복이 조용히 skip 되면
      # 이 잡은 "켠 모드가 초록"이 아니라 "켠 모드를 안 돌렸다"가 된다.
      - name: Assert driver is importable (no silent skips)
        run: |
          python - <<'PY'
          import sys
          from store.embedded_backend import _import_driver
          drv, name = _import_driver()
          if drv is None:
              print("::error::임베디드 드라이버 미설치 — 켠 모드 왕복이 조용히 skip 된다", file=sys.stderr)
              sys.exit(1)
          print(f"driver ok: {name}")
          PY
      # 플래그가 실제로 켜졌는지 확인 — 안 켜졌으면 이 잡은 core 의 중복이고,
      # 초록이 아무것도 뜻하지 않는다.
      - name: Assert the flag is actually on
        run: |
          python - <<'PY'
          import sys
          from store import pkns
          if not pkns.enabled():
              print("::error::VINC_PK_NAMESPACED 미설정 — 이 잡은 core 의 중복이다",
                    file=sys.stderr)
              sys.exit(1)
          print("pk namespacing: on")
          PY
      # 실제 Python PID 1에 신호를 보낸다. 모델/DB/운영 자원은 사용하지 않는다.
      # namespace를 만들 수 없으면 실패한다. Windows의 signal 모의로 대체하지 않는다.
      - name: Encoder SIGTERM as Linux PID 1
        run: |
          sudo -n env VINC_TEST_ENCODER_PID1=on "$(command -v python)" -B -m pytest \
            -p no:cacheprovider -q -s -x tests/rag/test_encode_shutdown.py -k pid1

      - name: Run the whole suite with the flag on
        run: python -m pytest -q tests

      # 프레임워크 연동 패키지(integrations/*/python). **설치한 다음** 테스트한다 — 소스
      # 경로로 돌리면 패키징(빠진 파일·의존성)이 깨져도 초록이다. vinc-client 의 계약
      # 테스트가 v1 OpenAPI 와 대조하므로 v1 을 바꾼 PR 도 여기서 걸린다.
      # - 패키지마다, 그리고 최신·최소 핀마다 **자기 venv** 다. 한 인터프리터에 차례로 깔면
      #   앞 설치(위 코어 스위트의 의존성 포함)가 남긴 패키지가 다음 패키지의 빠진 의존성을
      #   가리고, 최소 핀 런이 최신 핀이 깐 하위 의존성을 그대로 쓴다.
      # - venv 는 잡마다 비어서 시작하는 RUNNER_TEMP 에 두고, 다 쓰면 지워 디스크를 돌려준다.
      # - 패키지에 constraints-min.txt 가 있으면 선언한 최소 버전으로도 한 번 더 돈다.
      # 이 잡에 붙인 이유는 PR 마다 조건 없이 도는 파이썬 잡이 여기 하나라서다.
      # 근거: [[vinc.plan.framework-integration-packages-2026-09-28 §3]]
      - name: Integration packages (own venv each, installed then tested, latest and minimum)
        run: |
          set -euo pipefail
          for pkg in integrations/*/python; do
            name=$(basename "$(dirname "$pkg")")
            [ "$name" != vincs ] || continue
            for pin in latest min; do
              extra=()
              if [ "$pin" = min ]; then
                [ -f "$pkg/constraints-min.txt" ] || continue
                extra=(-c "$pkg/constraints-min.txt")
              fi
              venv="$RUNNER_TEMP/vinc-int-$name-$pin"
              python -m venv "$venv"
              echo "::group::$name ($pin)"
              "$venv/bin/pip" install -q "${extra[@]}" ./integrations/client/python "./$pkg[test]"
              "$venv/bin/pip" list 2>/dev/null | grep -i -E "^(vinc|agent-framework|langgraph|langchain)" || true
              "$venv/bin/python" -m pytest -q "$pkg/tests"
              if [ "$name" = langgraph ]; then
                parity_extra=()
                if [ "$pin" = min ]; then
                  parity_extra=(-c integrations/agent-framework/python/constraints-min.txt)
                fi
                "$venv/bin/pip" install -q "${extra[@]}" "${parity_extra[@]}" './integrations/agent-framework/python[test]'
                "$venv/bin/python" -m pytest -q integrations/parity
              fi
              echo "::endgroup::"
              rm -rf "$venv"
            done
          done

  vincs:
    name: unified package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build wheel from standalone sdist
        run: |
          python -m pip install build
          python -m build --outdir dist/vincs integrations/vincs/python
      # 사용자가 까는 그대로 본다: 엑스트라마다(없음 포함) 빈 venv 에 휠 하나만 깔고, 그
      # 엑스트라가 여는 어댑터의 import 와 `vinc --help`·`vinc --version` 을 확인한다.
      # 엑스트라 목록은 휠 메타데이터에서 읽으므로 새 어댑터의 엑스트라도 이 단계를 고치지
      # 않고 돈다. 설치본 시험(test_install.py)은 all 환경에서 돈다.
      # 근거: [[vinc.plan.agent-harness-work-order-2026-10-25 §3]]
      - name: Install the wheel once per extra in a clean venv, smoke it, then run the installed tests
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(find dist/vincs -name '*.whl' -print -quit)
          version=$(basename "$wheel" | cut -d- -f2)
          bin=bin
          [ "$RUNNER_OS" != Windows ] || bin=Scripts
          python -m venv "$RUNNER_TEMP/vincs-base"
          "$RUNNER_TEMP/vincs-base/$bin/python" -m pip install -q "$wheel"
          extras=$("$RUNNER_TEMP/vincs-base/$bin/python" -I -c 'import importlib.metadata as m; print(" ".join(e for e in m.metadata("vincs").get_all("Provides-Extra") if e != "test"))')
          [ -n "$extras" ] || { echo "::error::the wheel declares no extras"; exit 1; }
          for extra in base $extras; do
            venv="$RUNNER_TEMP/vincs-$extra"
            if [ "$extra" != base ]; then
              python -m venv "$venv"
              "$venv/$bin/python" -m pip install -q "$wheel[$extra]"
            fi
            echo "::group::vincs[$extra]"
            # macOS 의 bash 3.2 는 set -u 에서 빈 배열 전개를 실패로 친다. 그래서 갈래로 둔다.
            if [ "$extra" = base ]; then
              "$venv/$bin/python" -I scripts/integrations_import_check.py --package vincs --version "$version"
            else
              "$venv/$bin/python" -I scripts/integrations_import_check.py --package vincs --version "$version" --extra "$extra"
            fi
            echo "::endgroup::"
          done
          "$RUNNER_TEMP/vincs-all/$bin/python" -m pip install -q "$wheel[all,test]"
          test_dir="$RUNNER_TEMP/vincs-installed-tests"
          mkdir -p "$test_dir"
          cp integrations/vincs/python/tests/test_install.py "$test_dir/"
          cd "$test_dir"
          "$RUNNER_TEMP/vincs-all/$bin/python" -I -m pytest -q test_install.py

  app:
    name: app (typecheck)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    # `changes` 와 같은 이유로 옮긴다(그 잡의 주석이 근거다). 이쪽은 `npm ci` 와 `tsc`
    # 와 순수 노드 스크립트뿐이라 기계를 안 가린다 — 실측 1분 14초(런 33412567123).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # ⚠ 22 인 이유는 **`--experimental-strip-types` 가 22.6+ 라서**다(아래 dev 검사).
      # `release.yml` 은 20 그대로 둔다 — 실제로 배포되는 것을 짓는 환경이라 바꿀 이유가
      # 없고, 이 잡이 하는 일은 `tsc` 와 순수 스크립트뿐이라 런타임 차이가 걸리지 않는다.
      # 일회용 호스티드 러너에서 npm 다운로드 캐시를 복원한다.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci --no-audit --no-fund
      # View layout has separate worker and WASM assets. Check types, semantic
      # regressions, and their production packaging before accepting the PR.
      - name: Typecheck, layout tests and production build
        working-directory: app
        run: npm run build
      # `app/dev/*-check.ts` 는 브라우저 없이 도는 순수 검사다(인과 폐포 · 주소 문법 ·
      # 카메라 겨눔). **여태 CI 가 하나도 안 돌렸다** — 계획 문서 §7 은 "closure 검사가
      # 돈다"고 적고 있었는데 실제로는 손으로만 도는 것이라, 아무도 안 돌리는 순간
      # 조용히 썩는다. 이 리포가 R1~R9 로 좁히려는 바로 그 비대칭이라 여기 세운다.
      # `app/dev/` 는 tsconfig include 밖이라 위의 typecheck 가 덮지 않는다.
      - name: Dev checks (no browser)
        working-directory: app
        run: |
          set -euo pipefail
          for f in dev/*-check.ts; do
            echo "── $f"
            node --experimental-strip-types --disable-warning=ExperimentalWarning "$f"
          done

  # ── 러스트 셸 ────────────────────────────────────────────────────────────────
  # 왜 생겼나: **CI 가 러스트를 한 번도 짓지 않았다.** 그래서 컴파일 오류가 처음 드러나는
  # 자리가 **태그 시점의 3-OS 매트릭스**였고, 그 자리의 실패는 릴리스 하나를 통째로
  # 되감는다([[record:ci-never-builds-the-rust]]). 오늘 다른 이유로 그 자리에서 19분씩
  # 두 번 잃고 나서, 같은 형태의 사고를 앞으로 당긴다.
  #
  # `cargo check` 만 돈다 — 번들링·서명은 릴리스의 몫이고 여기서는 **컴파일이 되는가**
  # 하나만 본다. 그것이 태그 시점 실패의 거의 전부다.
  #
  # ⚠ 두 OS 를 다 돈다. 이 크레이트에는 `#[cfg(windows)]`·`#[cfg(unix)]` 로 갈리는
  # 코드가 있어서(`cli_link.rs`), 한쪽만 지으면 다른 쪽의 오류를 못 본다 — 그것이
  # 정확히 "플랫폼으로 갈린 컴파일 오류" 라는 원래 사고 형태다. macOS 는 호스티드라
  # 여기서 안 돈다(분을 태운다) — 그쪽 갈림은 여전히 태그 시점에 드러난다.
  rust:
    name: rust (cargo check)
    needs: changes
    # 가장 비싼 잡이고 가장 좁은 입력을 가진다. 이 조건 하나가 #123 의 대부분이었다 —
    # 2026-08-30 의 머지 셋에서 이 잡은 여섯 번 돌았고 여섯 번 다 러스트와 무관한
    # diff 였다. main push 에서도 같은 조건이다: `changes` 의 push 갈래가 그 push 의
    # 변경 목록을 보고 `app/src-tauri/` 나 이 파일이 바뀐 머지에서만 켠다(목록을 못
    # 구하면 켠다).
    if: needs.changes.outputs.rust == 'true'
    # 이 잡은 컴파일 오류를 태그 시점의 3-OS 매트릭스보다 먼저 잡는다. 그 자리의 실패는
    # 릴리스 하나를 통째로 되감는다([[record:ci-never-builds-the-rust]]). 그래서 이 잡이
    # 조용히 안 도는 것은 잡을 지운 것과 같다.
    #
    # ⚠ **대가는 분(minutes)이고 윈도우는 리눅스의 2배로 센다.** 호스티드 한도가
    # 2000분으로 풀린 것(발주자 확인, 2026-09-01)이 이 판정의 입력이다. 그 입력이
    # 다시 좁아지면 이 워크플로에서 여기가 가장 먼저 아프다.
    #
    # 지금도 두 OS 모두 호스티드 러너에서 돈다. 근거: [[vinc.ops.ci-runner-diagnosis]]
    # 런 39730541560 · 39736984396 에서 리눅스 6~10분 · 윈도우 6~12분이 걸렸다.
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    # 매달린 잡을 자르는 장치. 호스티드라 매달린 시간이 그대로 청구 분으로 나간다.
    timeout-minutes: 30
    steps:
      # 산출물을 체크아웃 **밖**에 둔다. `actions/checkout` 은 기본이 `clean: true` 라
      # `git clean -ffdx` 를 돌리고 `target/` 은 gitignore 대상이라 매 실행 지워진다.
      # 절대경로가 아니라 `$RUNNER_WORKSPACE` 인 이유 둘:
      # ① 한 기계에 러너가 여럿이면 절대경로는 같은 디렉터리다. cargo 가 파일락을 걸어
      #    뒤엣놈이 통째로 기다리므로 늘린 러너가 조용히 무효가 된다.
      # ② `runner` 컨텍스트는 job 레벨 `env` 에서 못 쓴다(러너 배정 전에 평가된다).
      #    그렇게 썼다가 job 을 0개 만들고 죽었다(run 32959205805).
      # 영속 러너에서는 이 디렉터리가 계속 자라므로 가끔 지워 줄 것. 호스티드 러너에서는
      # 잡과 함께 사라진다.
      - name: Keep cargo output outside the checkout (per-runner)
        shell: bash
        run: echo "CARGO_TARGET_DIR=$RUNNER_WORKSPACE/cargo-target" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # 일회용 호스티드 러너는 다음 잡에 파일시스템이 남지 않는다.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      # 리눅스만 필요한 시스템 헤더(webkit·appindicator). release.yml 과 같은 목록.
      - name: Linux webkit deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libdbus-1-dev
      # 프런트 산출물이 없으면 tauri 빌드 스크립트가 `../dist` 를 찾다 죽는다.
      # 짓지 않고 **빈 자리만** 만들어 준다 — 여기서 보는 것은 러스트지 번들이 아니다.
      - name: Placeholder frontend dist
        shell: bash
        run: mkdir -p app/dist && [ -f app/dist/index.html ] || echo "<!doctype html>" > app/dist/index.html
      # tauri-build 는 `externalBin`(얼린 파이썬 사이드카)이 **자리에 있는지**를 본다.
      # 릴리스에서는 PyInstaller 가 먼저 만들지만 여기서는 그것을 지을 이유가 없다 —
      # 이 잡이 보는 것은 러스트가 컴파일되는가 하나다. 그래서 자리만 채운다.
      - name: Placeholder sidecar binary
        shell: bash
        run: |
          set -euo pipefail
          triple=$(rustc -vV | sed -n 's/^host: //p')
          ext=""; [ "${RUNNER_OS:-}" = "Windows" ] && ext=".exe"
          mkdir -p app/src-tauri/binaries
          f="app/src-tauri/binaries/vinc-${triple}${ext}"
          [ -f "$f" ] || printf 'ci placeholder, not a real sidecar' > "$f"
          chmod +x "$f" 2>/dev/null || true
          echo "placed $f"

      - name: cargo check
        working-directory: app/src-tauri
        run: cargo check --locked --all-targets
      - name: cargo test
        working-directory: app/src-tauri
        run: cargo test --locked

      # 크래시한 rustc 는 이 디렉터리에 **다음 실행이 못 읽는 산출물**을 남긴다. 영속
      # 러너에서는 위 `CARGO_TARGET_DIR` 가 일부러 `git clean` 사정권 밖이라 아무도 안
      # 치우고, 그래서 한 번의 크래시가 그 뒤 모든 실행을 즉사시킨다 — 2026-09-07 실측: 윈도우에서
      # STATUS_STACK_BUFFER_OVERRUN 으로 죽은 뒤, 다음 런부터 53초 만에
      # `error[E0786]: failed to mmap rmeta metadata` 로 끝났다. 파일은 잘려 있지도
      # 잠겨 있지도 않았고 그저 rustc 가 못 읽었다. 그 잡은 러스트를 건드릴 때만 도니까
      # 시체가 오래 남고, 다음 사람은 자기 변경 탓으로 읽는다.
      #
      # 실패했을 때만 지운다: 성공한 캐시는 이 잡의 가장 큰 비용 절감이다(찬 캐시 첫 런은
      # 훨씬 길다). 지우는 것은 이 러너의 디렉터리뿐이고, 다음 런이 다시 채운다.
      # 지금 이 잡은 일회용 호스티드 러너에서 돌아 디렉터리가 잡과 함께 사라진다. 이 단계는
      # 영속 러너로 돌아갈 때를 위한 보험이다.
      # 근거: [[vinc.ops.ci-runner-diagnosis]]
      - name: 실패하면 산출물 캐시를 버린다 (크래시가 못 읽는 파일을 남긴다)
        if: failure()
        shell: bash
        run: |
          if [ -n "${CARGO_TARGET_DIR:-}" ] && [ -d "$CARGO_TARGET_DIR" ]; then
            echo "::warning::러스트 잡이 실패했다 — $CARGO_TARGET_DIR 를 버린다(크래시 잔해 방지)"
            rm -rf "$CARGO_TARGET_DIR"
          else
            echo "CARGO_TARGET_DIR 가 없다 — 버릴 것 없음"
          fi
