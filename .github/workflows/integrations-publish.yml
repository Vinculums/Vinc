name: integrations-publish

# Package versions are independent of the desktop release. A manual main run
# exercises TestPyPI; only an exact per-package version tag can reach PyPI.
on:
  push:
    tags:
      - "integrations-vincs-v*"
      - "integrations-vinc-client-v*"
      - "integrations-vinc-agent-framework-v*"
      - "integrations-vinc-langgraph-v*"
  workflow_dispatch:
    inputs:
      package:
        description: Package to test on TestPyPI
        required: true
        type: choice
        options:
          - vincs
          - vinc-client
          - vinc-agent-framework
          - vinc-langgraph

concurrency:
  group: integrations-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'Vinculums/Vinc'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && 'testpypi' || 'pypi' }}
    permissions:
      contents: read
      id-token: write
    steps:
      # 손으로 돌리는 실행은 운영 담당만(repo 변수 PROD_OPERATORS, 쉼표로 구분한 로그인).
      # 실수 방지이지 보안 경계가 아니다: 쓰기 권한자는 이 단계를 지운 브랜치 판을 dispatch 할 수 있다.
      - name: 운영 실행은 운영 담당만
        if: github.event_name == 'workflow_dispatch' && !contains(format(',{0},', vars.PROD_OPERATORS), format(',{0},', github.triggering_actor))
        env:
          ACTOR: ${{ github.triggering_actor }}
        run: |
          echo "::error::이 워크플로를 손으로 돌릴 수 있는 계정은 PROD_OPERATORS 에 있는 것뿐이다(지금 $ACTOR). 필요하면 소유자에게 요청할 것."
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Confirm a release tag comes from main
        if: github.event_name == 'push'
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          git rev-parse --verify refs/remotes/origin/main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
      - name: Match the tag to one package and its version
        id: selected
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          DISPATCH_PACKAGE: ${{ inputs.package }}
        run: |
          python scripts/integrations_publish_select.py \
            --event "$RELEASE_EVENT" --ref "$RELEASE_REF" \
            --package "$DISPATCH_PACKAGE" --github-output "$GITHUB_OUTPUT"
      - name: Build and inspect distributions
        env:
          PACKAGE_PATH: ${{ steps.selected.outputs.path }}
          PACKAGE_NAME: ${{ steps.selected.outputs.package }}
          PACKAGE_VERSION: ${{ steps.selected.outputs.version }}
        run: |
          python -m pip install --upgrade build twine
          python -m build --sdist --wheel --outdir dist "$PACKAGE_PATH"
          python -m twine check dist/*
          python - "$PACKAGE_NAME" "$PACKAGE_VERSION" <<'PY'
          import pathlib
          import sys
          import zipfile
          name, version = sys.argv[1:]
          wheels = list(pathlib.Path('dist').glob('*.whl'))
          sdists = list(pathlib.Path('dist').glob('*.tar.gz'))
          assert len(wheels) == len(sdists) == 1, (wheels, sdists)
          expected = f'{name.replace("-", "_")}-{version}'
          assert wheels[0].name.startswith(expected + '-'), wheels[0].name
          assert sdists[0].name == f'{expected}.tar.gz', sdists[0].name
          with zipfile.ZipFile(wheels[0]) as wheel:
              assert any(p.startswith(expected + '.dist-info/') for p in wheel.namelist())
          PY
      # The official PyPA action uses OIDC; no package token is stored in this repo.
      # Keeping build and publish in one job avoids the repository's exhausted
      # Actions artifact quota (see release.yml), while the environment gates the job.
      - name: Publish the selected distribution
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ github.event_name == 'workflow_dispatch' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
      - name: Install and import the published distribution
        env:
          PACKAGE_NAME: ${{ steps.selected.outputs.package }}
          PACKAGE_VERSION: ${{ steps.selected.outputs.version }}
          PACKAGE_INDEX: ${{ github.event_name == 'workflow_dispatch' && 'https://test.pypi.org/simple/' || 'https://pypi.org/simple/' }}
        run: |
          verify_env=$(mktemp -d)
          trap 'rm -rf "$verify_env"' EXIT
          python -m venv "$verify_env"
          # Fetch this exact package from its publication target, then resolve
          # dependencies from PyPI. A public copy must not mask a missing test upload.
          for attempt in 1 2 3 4 5; do
            if "$verify_env/bin/python" -m pip download --no-deps --only-binary=:all: \
              --index-url "$PACKAGE_INDEX" --dest "$verify_env/wheels" \
              "$PACKAGE_NAME==$PACKAGE_VERSION"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep 5
          done
          "$verify_env/bin/python" -m pip install --index-url https://pypi.org/simple/ "$verify_env"/wheels/*.whl
          "$verify_env/bin/python" scripts/integrations_import_check.py \
            --package "$PACKAGE_NAME" --version "$PACKAGE_VERSION"
