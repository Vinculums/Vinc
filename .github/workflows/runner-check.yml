# 셀프호스티드 러너가 실제로 잡을 받는지 보는 최소 확인.
#
# 왜 필요한가: GitHub 호스티드 분이 소진돼 잡이 "시작조차 안 되는" 상태에서, 셀프호스티드
# 로 옮기면 도는지가 이 계획 전체의 전제다. 문서를 믿지 않고 한 번 재 본다. 확인이
# 끝나면 이 파일은 지운다.
name: runner-check
on:
  push:
    branches: [test/selfhosted-smoke]
  workflow_dispatch:

jobs:
  where-am-i:
    runs-on: [self-hosted, windows, vinc-local]
    defaults:
      run:
        shell: bash        # Git Bash — 워크플로들이 bash 문법을 쓴다
    steps:
      - run: |
          echo "runner=$RUNNER_NAME os=$RUNNER_OS arch=$RUNNER_ARCH"
          echo "labels 로 붙었고 여기서 돈다면 호스티드 분과 무관하다"
