# 굽기만 하고 배포는 안 한다 — Decision B 조건 5("실 아티팩트를 end to end 로 검증")를
# 라이브를 건드리지 않고 재는 자리.
#
# ## 왜 브랜치가 아니라 dispatch 입력인가
#
# 실험 값(BAAI/bge-m3 · 1024)은 **리포에 남지 않는다.** 러너가 체크아웃한 사본의
# `Dockerfile.hub` 세 줄을 그 자리에서 갈아 끼우고 굽는다. 커밋도 브랜치도 없으니
# 그 값을 담은 ref 자체가 존재하지 않는다.
#
# 브랜치로 하면 안 되는 이유가 취향이 아니다. `Dockerfile.hub` 는 hub-deploy 의 push
# 경로 필터 **안**에 있고, hub-deploy 의 `workflow_dispatch` 는 ref 가드도 확인 인자도
# 없다. 그래서 m3 ENV 를 담은 브랜치가 존재하는 순간, 머지 한 번이나 드롭다운 한 번이
# 그것을 라이브로 보낸다. 그리고 그 배포는 단순 실패가 아니다:
#
#   api/server.py:1018 이 첫 워커 폴에서 `docstore.switch_embed_model` 을 부르고,
#   그것은 **옛 벡터를 전부 지운다**(vinc_rag/embed/worker.py 머리말이 그 설계를 적는다).
#   그 뒤 1024 벡터가 `FLOAT[768]` 열에 안 들어가 실패한다 — 스토어를 이미 비운 다음에
#   (scripts/rehearse_rebuild.py 머리말이 같은 순서를 경고한다).
#
# "이 브랜치는 머지하지 말 것"이라는 주석은 그 사고의 방어가 못 된다. 이 리포의 정본이
# 그것이다 — [[record:writing-a-trap-down-does-not-stop-it-a-check-does]].
#
# ## 안전은 없는 스텝이지 플래그가 아니다
#
# ⚠ **이 파일에 `az containerapp` 을 절대 더하지 말 것.** hub-deploy 에 `bake_only`
# 입력을 다는 쪽이 diff 는 작아 보이지만, 빌드와 `containerapp update` 사이에 조건이
# 여럿 생기고 그 사이에는 **구 리비전을 먼저 내리는 스텝**이 있다. 조건 하나가 뒤집히면
# 결과가 허브 정지다. 여기서는 배포 동사가 아예 없어서 뒤집힐 것이 없다.
#
# `--image` 를 주지 않으므로 태그도 매니페스트도 안 생긴다 — `containerapp update
# --image` 가 가리킬 이름 자체가 없고, `:latest` 도 안 움직여 롤백 경로가 그대로다.
#
# ## concurrency 를 일부러 안 단다
#
# 이 런은 `--no-push` 라 스토어·리비전·레지스트리 어느 것도 안 건드리므로 직렬화할
# 이유가 없다. 그리고 `cancel-in-progress: false` 를 다는 순간 직렬화 워크플로 명단을
# 넷으로 고정한 테스트가 떨어진다(tests/platform/test_gate_runner_move.py) — 그 테스트는
# 직렬화가 느는 것을 사람이 한 번 보게 하려고 있는 것이라, 여기서 늘릴 이유가 없다.
#
# ⚠ GitHub 분을 쓴다. 그래서 `workflow_dispatch` 전용이고 자동으로 도는 경로가 없다.
#
# ⚠ **`--ref main` 으로만 돈다.** 이 리포의 OIDC 연합 자격증명은 `refs/heads/main` 에
# 묶여 있어서, 브랜치에서 띄우면 `azure/login` 이 AADSTS700213 로 죽는다(실측 run
# 33733996317). 프로브 자체를 고치는 변경은 머지된 뒤에야 프로브로 확인할 수 있다.
name: bake-probe

on:
  workflow_dispatch:
    inputs:
      model:
        description: "HF 모델 id (VINC_EMBED_MODEL)"
        type: string
        default: "BAAI/bge-m3"
      artifact_path:
        description: "구울 자리 (VINC_EMBED_MODEL_PATH)"
        type: string
        default: "/srv/vinc/models/bge-m3-int8-rr.onnx"
      dim:
        description: "이 모델이 내야 하는 벡터 폭 (VINC_EMBED_DIM)"
        type: string
        default: "1024"

permissions:
  id-token: write
  contents: read

jobs:
  bake:
    runs-on: ubuntu-latest
    # e5 굽기가 ACR 1분 57초 안에서 29초였다. m3 는 fp32 가 2.27GB 라 훨씬 오래 걸리고,
    # 이 값은 일정을 조이는 장치가 아니라 **행을 잡는 장치**다.
    timeout-minutes: 60
    env:
      # ⚠ `${{ }}` 를 `run` 본문에 직접 끼우지 않는다 — 입력이 셸로 새는 자리다.
      MODEL: ${{ inputs.model }}
      APATH: ${{ inputs.artifact_path }}
      DIM: ${{ inputs.dim }}
    steps:
      # 손으로 돌리는 실행은 운영 담당만(repo 변수 PROD_OPERATORS, 쉼표로 구분한 로그인).
      # 실수 방지이지 보안 경계가 아니다: 쓰기 권한자는 이 단계를 지운 브랜치 판을 dispatch 할 수 있다.
      - name: 운영 실행은 운영 담당만
        if: github.event_name == 'workflow_dispatch' && !contains(format(',{0},', vars.PROD_OPERATORS), format(',{0},', github.triggering_actor))
        env:
          ACTOR: ${{ github.triggering_actor }}
        run: |
          echo "::error::이 워크플로를 손으로 돌릴 수 있는 계정은 PROD_OPERATORS 에 있는 것뿐이다(지금 $ACTOR). 필요하면 소유자에게 요청할 것."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 세 줄을 갈아 끼운다 (러너의 체크아웃에서만)
        run: |
          set -euo pipefail
          # 🔴 값이 오는 길에서 바뀔 수 있다. Git Bash 에서 `gh workflow run -f
          # artifact_path=/srv/...` 를 부르면 MSYS 경로 변환이 그것을 통째로
          # `D:/git/srv/...` 로 바꾼다(실측 run 33733996317 — 그 런은 OIDC 로 먼저
          # 죽어서 여기까지 안 왔지만, 왔다면 이미지 안에서 "구운 게 없다"가 됐다).
          # 런타임이 보는 자리는 `embed_worker` 의 `/srv/vinc/models/` 하나이므로
          # 그 밖이면 굽는 자리와 찾는 자리가 갈린 것이고, 그러면 굽지 말아야 한다.
          case "$APATH" in
            /srv/vinc/models/*) ;;
            *) echo "::error::artifact_path 가 /srv/vinc/models/ 밖이다: ${APATH} — Git Bash 라면 MSYS 경로 변환이다(MSYS_NO_PATHCONV=1 로 부를 것)"; exit 1 ;;
          esac
          sed -i -E \
            -e "s|^ENV VINC_EMBED_MODEL=.*|ENV VINC_EMBED_MODEL=${MODEL}|" \
            -e "s|^ENV VINC_EMBED_MODEL_PATH=.*|ENV VINC_EMBED_MODEL_PATH=${APATH}|" \
            -e "s|^ENV VINC_EMBED_DIM=.*|ENV VINC_EMBED_DIM=${DIM}|" \
            Dockerfile.hub
          # 치환이 **먹었는지** 확인한다. sed 는 안 맞아도 0 으로 끝나므로, 이걸 안 보면
          # ENV 형태가 바뀐 날 e5 를 굽고 "m3 를 쟀다"고 보고하게 된다.
          grep -Fxq "ENV VINC_EMBED_MODEL=${MODEL}" Dockerfile.hub \
            && grep -Fxq "ENV VINC_EMBED_MODEL_PATH=${APATH}" Dockerfile.hub \
            && grep -Fxq "ENV VINC_EMBED_DIM=${DIM}" Dockerfile.hub \
            || { echo "::error::세 줄 교체가 안 먹었다 — Dockerfile.hub 의 ENV 형태가 바뀌었다"; exit 1; }
          {
            echo '## 무엇을 굽는가'
            echo '```diff'
            git --no-pager diff -- Dockerfile.hub
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 선언이 서로 맞는가 (굽기 전에)
        # ACR 분을 쓰기 **전에** 세 값이 정본 표와 맞는지 본다. 이 둘은 이미 있는
        # 테스트다 — Dockerfile 을 읽어 모델↔폭(store/config.py 대조)과 모델↔경로
        # 계열을 검사한다. 새로 만드는 검사가 없다.
        run: |
          set -euo pipefail
          pip install --quiet --disable-pip-version-check pytest pyyaml
          python -m pytest tests/rag/test_bake_declares_the_right_width.py \
                           tests/rag/test_embed_worker.py -q

      - name: Azure 프로필을 이 잡 전용으로
        run: echo "AZURE_CONFIG_DIR=$RUNNER_TEMP/azure-$GITHUB_RUN_ID" >> "$GITHUB_ENV"

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 모델을 굽는다 (러너 — 여기가 메모리가 있는 자리다)
        # 2026-09-03 이후 굽기는 ACR 이 아니라 러너에서 한다. 이 프로브가 처음 그
        # 사실을 밝힌 자리이기도 하다 — ACR 에이전트가 bge-m3 2.27GB 를 다 받고
        # `quantize_dynamic` 에서 OOM 으로 죽었다(exit 137, run 33716383547).
        # 호스티드 러너는 약 16GB 라 여기서는 돈다.
        run: |
          set -euo pipefail
          export $(grep -E '^ENV VINC_EMBED_(MODEL|MODEL_PATH|DIM)=' Dockerfile.hub | sed 's/^ENV //')
          # 런타임 판은 허브와 같아야 한다 — 다른 ORT 로 구운 아티팩트는 다른 벡터를 낸다.
          # Dockerfile.hub 의 고정 판을 뽑아 쓰고, 못 찾으면 죽는다(rerank-probe 와 같은 이유).
          pins=$(grep -m1 -E '^RUN pip install .*onnxruntime==' Dockerfile.hub \
            | grep -oE '(onnxruntime|tokenizers|numpy|huggingface_hub)==[0-9][0-9.]*' | tr '\n' ' ')
          [ "$(wc -w <<<"$pins")" -eq 4 ] || {
            echo "::error::Dockerfile.hub 에서 인코더 런타임 판 넷을 못 찾았다: '$pins'"; exit 1; }
          python -m pip install --quiet --disable-pip-version-check onnx $pins
          mkdir -p models
          VINC_EMBED_MODEL_PATH="models/$(basename "$VINC_EMBED_MODEL_PATH")" \
            python packaging/bake_embed_model.py 2>&1 | tee bake.log
          ls -la models

      - name: 기준선 e5 도 굽는다 (RUNNER_TEMP 로 — models/ 에 구우면 토크나이저가 덮인다)
        # 조건 5 는 **짝지은 비교**다. 기준선을 여기서 함께 구워야 두 아티팩트가 같은
        # 러너·같은 ORT·같은 레시피에서 나온 것이 되고, 그래야 차이를 모델 차이로 읽을
        # 수 있다. 따로 구운 것끼리 비교하면 무엇이 달랐는지 말할 수가 없다.
        #
        # 🔴 `models/` 에 구우면 안 된다. `bake_embed_model.py` 의 `TOK` 는 아티팩트
        # 경로에서 **파생**되므로(`dirname(OUT)/tokenizer.json`), 같은 디렉터리에 두 번
        # 구우면 뒤의 굽기가 앞의 tokenizer.json 을 덮는다. 그 뒤로는 어느 쪽 평가든
        # 잘못된 쌍을 재는데, 크기도 폭도 정상이라 **아무 데서도 안 걸린다**.
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/baseline"
          VINC_EMBED_MODEL=intfloat/multilingual-e5-base           VINC_EMBED_MODEL_PATH="$RUNNER_TEMP/baseline/e5-int8-rr.onnx"           VINC_EMBED_DIM=768             python packaging/bake_embed_model.py
          ls -la "$RUNNER_TEMP/baseline"

      - name: 무엇을 구웠는지 각인한다 (sha256 · HF 리비전 · ORT)
        # 내려받은 바이트가 **이 런이 검증한 바로 그것**인지 나중에 대조할 수 있어야
        # 한다. 대조표가 없으면 로컬에서 잰 수치가 어느 파일에 대한 것인지 말할 수 없고,
        # 그러면 그 수치는 조건 5 의 "실 아티팩트"를 증명하지 못한다.
        #
        # HF 리비전을 함께 박는 이유: `hf_hub_download` 에 `revision=` 이 없어서 굽기는
        # 언제나 그 시점의 main 을 받는다. sha 를 남겨 두면 적어도 **다음 굽기와 같은
        # 것을 받았는지**는 말할 수 있다.
        run: |
          set -euo pipefail
          python - <<'PY' > manifest.json
          import glob, hashlib, json, os
          import onnxruntime, huggingface_hub as hf

          def sha256(p):
              h = hashlib.sha256()
              with open(p, "rb") as fh:
                  for blk in iter(lambda: fh.read(1 << 20), b""):
                      h.update(blk)
              return h.hexdigest()

          paths = sorted(glob.glob("models/*")
                         + glob.glob(os.path.join(os.environ["RUNNER_TEMP"], "baseline", "*")))
          print(json.dumps({
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "onnxruntime": onnxruntime.__version__,
              "repos": {m: hf.model_info(m).sha
                        for m in dict.fromkeys([os.environ["MODEL"],
                                                "intfloat/multilingual-e5-base"])},
              "files": [{"name": os.path.basename(p), "bytes": os.path.getsize(p),
                         "sha256": sha256(p)} for p in paths],
          }, indent=2, ensure_ascii=False))
          PY
          {
            echo '## 구운 것의 각인'
            echo
            echo '```json'
            cat manifest.json
            echo '```'
            echo
            echo '내려받은 뒤 `sha256sum` 으로 이 값과 대조할 것 — 다르면 거기서 멈춘다.'
          } >> "$GITHUB_STEP_SUMMARY"

      # 이미지 빌드가 ColBERT 투영을 `--check` 로 올려 보므로(VIN-845) hub-deploy 와 같은 자리에 둔다.
      - name: ColBERT 투영을 받는다
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check huggingface_hub numpy
          export $(grep -E '^ENV VINC_COLBERT_LINEAR=' Dockerfile.hub | sed 's/^ENV //')
          python - "models/$(basename "$VINC_COLBERT_LINEAR")" <<'PY'
          import hashlib, shutil, sys
          sys.path.insert(0, ".")
          import huggingface_hub as hf
          from vinc_rag.colbert import LINEAR_REVISION, LINEAR_SHA256
          src = hf.hf_hub_download("BAAI/bge-m3", "colbert_linear.pt", revision=LINEAR_REVISION)
          got = hashlib.sha256(open(src, "rb").read()).hexdigest()
          if got != LINEAR_SHA256:
              sys.exit(f"colbert_linear sha256 {got} != {LINEAR_SHA256}")
          shutil.copy(src, sys.argv[1])
          PY

      - name: 이미지에서 검증한다 (밀지 않는다)
        # `--image` 없음 = 태그 없음 = 배포가 가리킬 것이 없음. `--no-push` 는 그것을
        # 한 번 더 못박는다. hub-deploy 의 같은 명령과 다른 점은 이 두 가지뿐이다.
        # 여기서 도는 것은 이제 굽기가 아니라 **COPY 된 바이트의 검증**이다.
        run: |
          set -euo pipefail
          az acr build --registry vincacr --no-push -f Dockerfile.hub . 2>&1 | tee acr.log

      - name: 판정
        # 굽기가 스스로 폭을 재고 어긋나면 이미 위에서 죽는다(verify_embedding_width).
        # 여기서 다시 보는 것은 **그 줄이 아예 없는 경우**다 — 레이어가 안 돌았는데
        # 빌드가 초록인 상황이 이 리포에 실제로 있었다(run dem, 2026-08-01: 이미지가
        # 400MB 대신 5MB 늘고 빌드는 성공, 런타임에서 OOM).
        run: |
          set -euo pipefail
          line=$(grep -oE 'baked: model=[0-9]+B tokenizer=[0-9]+B width=[0-9]+' acr.log | tail -1 || true)
          {
            echo "## 판정"
            echo
            echo "| model | artifact | 선언 폭 | 굽기가 찍은 줄 |"
            echo "|---|---|---|---|"
            echo "| \`${MODEL}\` | \`${APATH}\` | **${DIM}** | \`${line:-없음}\` |"
            echo
            echo "⚠ 이 런은 아무것도 배포하지 않았다 — \`--no-push\`, 태그 없음, 컨테이너앱 호출 0."
            echo
            echo "⚠ **폭은 품질이 아니다.** 이 리포가 실제로 물린 아티팩트 고장은 오류 없는 int8 포화였다"
            echo "(공식 int8 에서 한국어 nDCG 0.670 → 0.472, 예외 0건). 폭 검사는 그것을 구조적으로 못 본다."
            echo "이 초록은 \"굽히고 · 열리고 · 폭이 맞다\"까지다."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$line" ]; then
            echo "::error::로그에 baked 줄이 없다 — 굽기 레이어가 안 돌았다. 이 런은 아무것도 검증하지 않았다" >&2
            exit 1
          fi
          got="${line##*width=}"
          [ "$got" = "$DIM" ] || { echo "::error::잰 폭 ${got} · 선언 ${DIM}" >&2; exit 1; }
          echo "폭 ${got} 확인 — 선언과 일치"

      - name: 검증된 바이트를 내보낸다 (dispatched)
        # `판정` 뒤에 둔다 — 기본 `if: success()` 라, **검증을 통과한 바이트만** 나간다.
        # 이 셋이 조건 5 의 로컬 측정 입력이다. 로컬에서 다시 굽지 않는 이유는 레시피가
        # 같아도 다른 파일이고, 조건 5 가 요구하는 것은 "실 아티팩트"이기 때문이다.
        uses: actions/upload-artifact@v4
        with:
          name: baked-dispatched
          path: models/
          retention-days: 7

      - name: 검증된 바이트를 내보낸다 (baseline e5)
        uses: actions/upload-artifact@v4
        with:
          name: baked-baseline
          path: ${{ runner.temp }}/baseline/
          retention-days: 7

      - name: 각인을 내보낸다
        uses: actions/upload-artifact@v4
        with:
          name: bake-manifest
          path: manifest.json
          retention-days: 7
