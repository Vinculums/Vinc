# Vinc 릴리스 파이프라인(D43 — P4). 태그 v* 푸시 시 3 OS에서
# ① PyInstaller로 사이드카 단일 바이너리를 만들고
# ② Tauri externalBin 규약 위치(binaries/vinc-<target-triple>)에 배치한 뒤
# ③ tauri-action으로 설치본 + **업데이터 아티팩트(서명본)**를 "빌드만" 하고
#    (릴리스 생성 안 함) 아티팩트로 업로드.
# ④ 단일 publish 잡이 모든 설치본·업데이터 번들을 모으고 latest.json(업데이터 매니페스트)을
#    조립해 공개 릴리스 레포(Vinculums/Vincs-app)의 Releases 에 draft 로 발행한다.
# ⑤ 발행 후 prune 잡이 최근 5개 버전의 설치본만 남기고, 더 오래된 릴리스는 다운로드
#    자산만 제거한다(릴리스 노트·태그는 유지 = 경량 아카이브). 저장 회수 + 이력 보존.
# 소스 레포(Vinculums/Vinc)는 비공개 → 바이너리만 공개 레포로 내보낸다.
# 발행에는 Vincs-app 에 contents:write 권한을 가진 PAT 시크릿 RELEASE_TOKEN 을 쓴다.
#
# 자동 업데이트(v0.3.0~): tauri-action 이 TAURI_SIGNING_PRIVATE_KEY 로 업데이터 번들을
# 서명한다(개인키 시크릿이 없으면 .sig 미생성 → collect 단계가 실패 = 무서명 릴리스 차단).
# 공개키는 app/src-tauri/tauri.conf.json 의 plugins.updater.pubkey 에 박혀 있어, 클라이언트가
# 서명 불일치 번들을 거부한다. latest.json 은 releases/latest/download/latest.json 으로 서빙된다.
# 코드사인·공증(OS 신뢰 서명)은 여기와 별개의 후속 마일스톤 — 업데이터 서명은 진위 검증용.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# 태그별로 직렬화한다(취소 안 함) — 발행 도중 취소하면 반쯤 발행된 릴리스가 남는다.
# 태그 발행은 드물어 취소로 아낄 분이 없다. 분 절약의 큰 지렛대는 macOS 매트릭스다(아래).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# ── 태그 릴리스는 GitHub 아티팩트 미사용(저장 할당량 의존 제거) ───────────────
# 예전엔 build 가 설치본을 `bundles-*` **Actions 아티팩트**로 올리고 publish 가
# 내려받아 발행했다. Actions/Packages 저장은 계정 전체 공유 + Free 한도 0.5GB 라,
# 아티팩트가 그 한도를 채우면 "Artifact storage quota has been hit"로 릴리스가
# 통째로 막혔다(v0.6.0·v0.6.5). 이제 build 잡이 **Vincs-app 릴리스에 직접 업로드**
# 한다 — GitHub Release 자산은 그 저장 한도와 무관(무료)하므로 저장이 꽉 차 있어도
# 발행이 된다. 3개 build 잡이 같은 draft 에 올리는 경쟁은 create-if-not-exists +
# `--clobber` 로 흡수한다. 중간 산출물(latest 조각)만 자산으로 잠깐 올렸다가 assemble
# 이 병합 후 삭제한다.
jobs:
  # 태그와 파일의 버전이 어긋난 채 빌드되는 것을 막는다(가장 싼 게이트, 10초).
  # 함정: `latest.json` 의 version 은 **git 태그**에서 나오고 클라이언트 자기 버전은
  # `tauri.conf.json` 에서 온다 — 태그만 올리고 파일을 안 올리면 설치해도 버전이
  # 그대로라 **업데이트 토스트가 영원히 반복**된다. 여기서 미리 터뜨린다.
  # 실측 근거: `app/package-lock.json` 이 7릴리스(0.6.0→0.6.7) 방치돼 있었다
  # (Cargo.lock 은 체크리스트에 있는데 이건 빠진 비대칭 — scripts/version_sync.py 참조).
  version-gate:
    # 산출물이 없는 버전 게이트도 호스티드 러너에서 실행한다.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 손으로 돌리는 실행은 운영 담당만(repo 변수 PROD_OPERATORS, 쉼표로 구분한 로그인).
      # 실수 방지이지 보안 경계가 아니다: 쓰기 권한자는 이 단계를 지운 브랜치 판을 dispatch 할 수 있다.
      - name: 운영 실행은 운영 담당만
        if: github.event_name == 'workflow_dispatch' && !contains(format(',{0},', vars.PROD_OPERATORS), format(',{0},', github.triggering_actor))
        env:
          ACTOR: ${{ github.triggering_actor }}
        run: |
          echo "::error::이 워크플로를 손으로 돌릴 수 있는 계정은 PROD_OPERATORS 에 있는 것뿐이다(지금 $ACTOR). 필요하면 소유자에게 요청할 것."
          exit 1
      # fetch-depth 0 은 아래 보드 검사 때문이다. 판정(트리 지문)은 얕아도 서지만,
      # **어느 커밋이 보드를 낡게 했는지** 목록은 이력이 있어야 나온다. 빨간 릴리스
      # 앞에서 그 목록이 없으면 사람이 무엇을 다시 찍어야 하는지 모른다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assert all version sites agree (and match the tag)
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            python scripts/version_sync.py --check --expect "${GITHUB_REF_NAME#v}"
          else
            python scripts/version_sync.py --check
          fi

      # 앱 보드가 이 태그의 코드를 그리고 있는가 — **말만 하고 막지 않는다**(2026-09-26
      # 발주자 지시: 릴리스마다 하는 Figma 재캡처는 쓸모없는 일이다). 2026-09-19(VIN-74)
      # 부터 여기서 태그를 막았지만, 막는 값은 디자이너가 옛 화면을 보는 것뿐이었고 치르는
      # 값은 릴리스마다 사이드카·실데이터로 60장을 다시 찍는 일이었다. PR 과 같은 경고다.
      # 보드를 새로 하고 싶을 때의 길은 그대로 있다:
      #   cd design-hub && npm install
      #   node scripts/capture_app.mjs --app <vite> --sidecar <sidecar> --token <token>
      # 근거: [[decision:figma-app-boards-no-longer-gate-a-release-2026-09-26]]
      - name: Figma app board copy gate (advisory)
        continue-on-error: true
        run: python -X utf8 design-hub/scripts/figma_app_copy.py

  # Linux는 ubuntu-22.04에서 직접 빌드해 glibc 2.35 실행 바닥을 지킨다.
  # 근거: [[vinc.ops.ci-runner-diagnosis]]
  build:
    needs: version-gate
    strategy:
      fail-fast: false
      # ⚠ `max-parallel: 1` 이 여기 있었고 걷었다. 그것을 넣은 근거는 "윈도우와 리눅스의
      # 릴리스 프로파일 Rust 빌드가 같은 16GB 기계에서 겹친다"였는데, 넣고 다시 재 보니
      # **직렬화가 아무것도 안 고쳤다** — 윈도우 다리(01:48:21~01:54:34)가 리눅스가 끝난
      # 4초 뒤에 시작했고 그 창에 이 기계에서 도는 다른 런이 하나도 없었는데 같은 값으로
      # 죽었다. 겹침은 원인이 아니었다(실측은 위 `windows-latest` 주석에 있다).
      # 윈도우가 호스티드로 돌아갔으므로 이 기계에서 도는 무거운 빌드는 리눅스 하나이고,
      # 그것은 **v0.9.0 태그 런이 이미 초록으로 지나간 배치**다(런 34020701177).
      # 그러므로 벽시계 14분을 되찾는다.
      matrix:
        include:
          # ⚠ **리눅스가 22.04 인 것은 러너 이미지 취향이 아니라 계약이다.** 여기서
          # 지은 바이너리의 **최소 glibc 가 빌드 기계의 glibc** 이므로, 더 새 배포판에서
          # 빌드하면 구형 사용자가 조용히 실행을 못 하게 된다(24.04 는 2.39, 22.04 는
          # 2.35). CI 는 이걸 안 잡아 준다 — 사용자가 잡는다. v0.8.2 까지 그렇게 출하됐다.
          #
          # 호스티드 22.04와 아래 glibc 검사로 이 계약을 고정한다.
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
          # ⚠ 윈도우는 **호스티드로 돌아왔다**(2026-09-07). P10 이 이 다리를 이 기계로
          # 옮긴 근거는 "ci.yml 의 `rust` 잡이 같은 라벨에서 링크까지 성공한다"였다.
          # 그 근거가 틀렸다 — `cargo check`·`cargo test` 는 `tauri build`(릴리스
          # 프로파일, opt-level 3)가 아니다. 실측 세 번 전부 같은 자리에서 죽었다:
          #   memory allocation of 2097152 bytes failed · rustc 0xc0000409
          # 겹침이 원인이라는 첫 판정도 틀렸다. `max-parallel: 1` 로 다리를 완전히
          # 직렬화하고(윈도우 01:48:21~01:54:34, 리눅스가 끝난 4초 뒤) 그 창에 이
          # 기계에서 도는 다른 런이 하나도 없는 상태에서도 같은 값으로 죽었다.
          # 진짜 제약은 **호스트의 상시 커밋 사용량**이다: 커밋 한도 39.88GB 중
          # 34.16GB 가 유휴 상태에서 이미 쓰이고 여유가 5.73GB 다. `CARGO_BUILD_JOBS=2`
          # 로 rustc 를 둘로 줄여 로컬에서 다시 재도 같은 자리에서 죽는다.
          # 근거: [[record:the-release-machine-idles-at-86-percent-of-its-commit-limit-2026-09-07]]
          #
          # 비용은 실측으로: 이 다리는 런 34087391707 시도 3 에서 **18분 45초** 걸렸고,
          # 지금 문서화된 표준 windows 2-core 요금은 분당 $0.010 이라 약 **$0.19** 다
          # (그것도 포함 분을 넘겼을 때만 — 공개 리포는 표준 러너가 무료다). 여기 오래
          # 적혀 있던 $0.47 은 분당 $0.022 로 계산한 값인데 그 요금은 표준이 아니라
          # `windows_4_core` **대형 러너**의 것이고, 대형 러너는 포함 분을 쓸 수 없다.
          # 얼마든 태그 런의 이 다리가 실패하면 태그는 되돌릴 수 없고 설치본 없는
          # 릴리스가 남으므로, 이 지출은 요금이 아니라 보험료로 읽는다.
          # 되돌릴 조건: 이 기계의 페이지 파일이 커지거나(커밋 한도 상향) 상시 사용량이
          # 내려가서, `tauri build` 가 여기서 초록인 것을 **실제로 본 뒤**.
          #
          # ⚠ 2026-09-27 에 한 번 집으로 들였다가(v0.9.4) 같은 날 **다시 호스티드로
          # 돌렸다.** 들인 이유는 조직의 Actions 예산이 바닥나 호스티드 잡이 아예 시작하지
          # 않은 것 하나였고("an Actions budget is preventing further use"), 예산이 풀려
          # 그 이유가 없어졌다. 그 사이 로컬 다리는 사람이 쓰는 기계에서 릴리스 프로파일
          # 빌드를 돌렸고, OpenSSL 도 그 기계의 Git 위치(`VINC_OPENSSL_DIR`)에 기대야 했다.
          # 호스티드 이미지는 spec 의 기본 후보(`C:\Program Files\OpenSSL\bin`)를 갖고 있다.
          # 근거: [[decision:the-windows-release-leg-goes-back-to-hosted-2026-09-07]]
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
          # ⚠ macOS 는 로컬 러너가 아예 없다. 같은 런에서 이 다리는 3분 12초였다.
          # 여기 적혀 있던 $0.93 과 합계 $1.40 도 위와 같은 요금표에서 나온 값이라
          # 지금은 안 맞는다. 정확한 수치가 필요하면 청구서를 볼 것 — 포함 분에서
          # 차감될 때의 OS 배수는 현행 문서로 확인되지 않는다(문서 페이지가 개명됐고
          # 현 요금비는 옛 2배·10배와 안 맞는다). 태그 발행은 드물어 어느 쪽이든
          # 반복 지출이 아니다.
          - os: macos-latest
            triple: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    # 매달린 잡을 자르는 장치. 셀프호스티드에서 대가는 분이 아니라 **러너 하나를
    # 붙잡는 것**이고, 호스티드에서는 macOS 가 10배로 세는 분이다. 실측은 20분대다.
    timeout-minutes: 60
    env:
      # AppImage 번들러(linuxdeploy)는 기본적으로 자기를 FUSE 로 마운트하는데
      # 컨테이너에는 `/dev/fuse` 가 없다. 이 변수가 마운트 대신 압축해제로 돌린다.
      # 컨테이너가 아닌 다리에서는 아무 일도 하지 않으므로 잡 전체에 둔다.
      APPIMAGE_EXTRACT_AND_RUN: "1"
      # ⚠ 셀프호스티드 윈도우 러너는 기계 전역 PYTHONHOME·PYTHONPATH 를 물려받는다
      # (이 기계에는 Machine·User 양쪽 스코프에 D:/Tools/Python 이 박혀 있다). 그러면
      # `setup-python` 이 받아 온 인터프리터가 시스템 파이썬의 stdlib 을 읽고 이렇게 죽는다:
      #   AttributeError: module '_thread' has no attribute 'daemon_threads_allowed'
      # 윈도우 다리가 2026-09-07 에 호스티드로 돌아갔으므로 지금은 아무 다리도 이것을
      # 안 만난다. 그래도 남긴다: 빈 문자열이면 CPython 이 무시하고(같은 인터프리터로
      # 실측해 unset 과 동치), 리눅스 컨테이너와 macOS 에는 애초에 없는 변수라 무해하며,
      # 다리를 다시 집으로 들일 때 같은 사고를 두 번 겪지 않는다.
      PYTHONHOME: ""
      PYTHONPATH: ""
      # sidecar.spec 이 OpenSSL 3 을 찾을 자리. 빈 값이면 spec 의 기본 후보만 본다.
      VINC_OPENSSL_DIR: ""
    steps:
      # 노트북 러너는 System32 가 PATH 에서 Git 보다 앞이라 `shell: bash` 가 WSL 의
      # bash 로 잡힌다. Git Bash 를 앞에 세운다(ci.yml 동형).
      #
      # ⚠ 이 스텝은 지웠다가 되살렸고, 지금은 **호스티드에서 무해한 채로 남는다.**
      # 호스티드 windows-latest 는 Git Bash 가 PATH 앞이라 이 스텝이 아무것도 안 바꾼다.
      # 남기는 이유는 위 PYTHONHOME 과 같다: 다리를 다시 집으로 들이면 그때 바로 필요하고,
      # 없으면 `jq`·`gh` 를 부르는 업로드 스텝이 19분 빌드 끝에서 죽는다
      # (`.github/actions/runner-preflight` 헤더가 그 사고를 세 번 기록해 두었다).
      - name: Prefer Git Bash on Windows (system32 bash is WSL)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gitRoot = Split-Path (Split-Path (Get-Command git).Source)
          $binDir  = Join-Path $gitRoot 'bin'
          if (Test-Path (Join-Path $binDir 'bash.exe')) {
            $binDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

      - uses: actions/checkout@v4

      - name: Linux build prerequisites and glibc floor
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          glibc=$(getconf GNU_LIBC_VERSION)
          [ "$glibc" = "glibc 2.35" ] || { echo "::error::expected glibc 2.35, got $glibc"; exit 1; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends build-essential pkg-config file xz-utils \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      # 이 잡이 부르는 외부 명령을 **빌드 앞에서** 확인한다. 없으면 19분을 태우고
      # 업로드에서 exit 127 로 죽는다(2026-08-19 에 그렇게 두 번 잃었다).
      - uses: ./.github/actions/runner-preflight
        with:
          tools: curl jq gh

      # ── 사이드카(Python) ────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 설치된 인터프리터가 실제 빌드 러너에서 실행되는지 먼저 확인한다.
      - name: Assert the interpreter actually runs here
        shell: bash
        run: |
          if ! python -V; then
            echo "::error::러너 '${{ runner.name }}' 의 파이썬이 이 잡의 환경에서 실행되지 않는다"
            echo "actions/setup-python 과 호스티드 이미지의 호환성을 확인할 것" >&2
            exit 1
          fi
      # ── 임베디드 드라이버 = ladybug 단일(v0.5.3, kuzu 제거) ──────────────────
      # 3중 실증 완료(앱 완전호환·G0 오프라인 확장·교차 이관 무손실, 2026-07-20).
      - name: Install sidecar build deps (LadybugDB + pypdf)
        # pypdf = PDF 원문 적재(D45 입력 어댑터). 여기 빠뜨리면 동결 바이너리에
        # 통째로 안 실려 PDF 만 조용히 강등된다 — pyproject 의 extra 는 이 목록을
        # 대신하지 않는다(이 워크플로는 extras 를 쓰지 않고 목록을 직접 적는다).
        #
        # ⚠ `ladybug` 는 **반드시 핀한다.** 여기만 핀이 없어서 v0.7.0 릴리스가
        # Windows 에서 깨졌다(2026-08-01). 2026-07-30 에 올라온 0.19.0 이 Windows 에서
        # C API 공유 라이브러리를 못 찾는다:
        #   RuntimeError: Could not find lbug C API shared library.
        #                 Set LBUG_C_API_LIB_PATH or ... LBUG_LIB_KIND=shared
        # 즉 0.19.0 은 공유 라이브러리를 휠에서 분리한 것으로 보인다.
        #
        # 나머지 세 자리(ci.yml · hub-deploy.yml · Dockerfile.hub)는 전부
        # `ladybug==0.18.0` 이었고 **여기만 빠져 있었다** — DEPLOYMENT §1.5 가 적은
        # `package-lock.json` 비대칭과 같은 계열의 사고다.
        #
        # 부수 효과로 **테스트한 것과 배포한 것이 달랐던 것도 함께 고쳐진다**:
        # 이 자리가 핀이 없어 v0.6.7 은 그날의 최신(0.18.3)으로 빌드돼 나갔는데,
        # ci.yml 은 0.18.0 으로 테스트하고 있었다. 이제 핀은 모두 같은 판이다(지금 0.20.4).
        #
        # ⚠ 위 "0.19.0 이 C API 공유 라이브러리를 분리했다"는 추정은 틀렸다(2026-09-24
        # 재조사). 0.19.0 부터 휠이 OpenSSL 3 을 싣지 않아 Windows 에서 네이티브 모듈이
        # `libssl-3-x64.dll` 을 못 찾고 C API 폴백으로 떨어진 것이다. 그래서 0.20.4 로
        # 올리면서 sidecar.spec 이 OpenSSL 3 을 비변형 이름으로 함께 싣는다.
        # 근거: [[vinc.ops.ladybug-upgrade-review-2026-09-24]] §2.4
        #
        # ⚠ **Windows 만 0.20.3 이다.** 0.20.4 의 win_amd64 엔진은 FTS 확장(v0.20.0)으로
        # `CREATE_FTS_INDEX` 를 부르면 빈 표에서도 접근 위반으로 죽는다(0xC0000409, 로컬
        # 4/4 재현 · 상류가 INSTALL 로 준 확장도 같다). 같은 확장 파일로 0.20.3 은 4/4
        # 정상이고, 벡터 색인은 두 판 모두 정상이다. 저장 파일은 0.20.3 ↔ 0.20.4 양방향으로
        # 열린다(실측). 그래서 v0.9.4 첫 태그 빌드의 Windows 스모크가 /health 를 못 받았다.
        # 상류가 고치면 이 분기를 지운다.
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            pip install ladybug==0.20.3 pyyaml pyinstaller pypdf
          else
            pip install ladybug==0.20.4 pyyaml pyinstaller pypdf
          fi
      # ⚠ ladybug 의 `INSTALL` 을 쓰지 않는다. 0.18.0 의 내장 다운로더가 확장 서버
      # 인증서를 검증하지 못해 **CI 에서만** 죽는다(2026-08-01 실측):
      #   RuntimeException: Failed to download extension: vector
      #   ladybug 0.18.0/linux_amd64/vector  ERROR: SSL server verification failed
      # 같은 URL 을 curl 로 받으면 200 이고 바이트도 정확하다(로컬·러너 양쪽 확인).
      # 즉 서버가 아니라 **0.18.0 클라이언트의 CA 번들이 낡은 것**이다. 로컬에서 안
      # 드러난 이유는 캐시가 예전에 채워져 재다운로드가 없었기 때문이다.
      #
      # 그래서 `~/.lbdb/extension/` 를 직접 채운다. sidecar.spec 이
      # `*/*/{ext}/lib{ext}.lbug_extension` 글롭으로 집어 datas 에 싣는다(3개 미만이면
      # spec 이 빌드를 세운다). 런타임은 이 번들을 명시 경로로 LOAD 하므로 네트워크가
      # 필요 없다(G0).
      #
      # 출처는 상류 확장 서버가 아니라 **이 리포의 릴리스 `ladybug-ext-<ver>`** 다. 상류는
      # 최근 다섯 판만 내려 주므로 핀한 판이 빠지는 날 이 단계가 깨진다. 받은 파일은 리포의
      # `packaging/lbug-ext-<ver>.sha256` 과 대조한다(해시가 다르면 빌드를 세운다).
      # 근거: [[decision:ladybug-extensions-ship-from-a-vinc-release-not-the-repo-2026-09-26]]
      - name: Seed LadybugDB extensions (G0 오프라인 번들 — spec 이 datas 로 동봉)
        shell: bash
        env:
          LBUG_VER: "0.20.4"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Linux)   PLAT=linux_amd64 ;;
            Windows) PLAT=win_amd64 ;;
            macOS)   PLAT=osx_arm64 ;;
            *) echo "::error::알 수 없는 러너: ${{ runner.os }}"; exit 1 ;;
          esac
          sums="$GITHUB_WORKSPACE/packaging/lbug-ext-$LBUG_VER.sha256"
          dl="$RUNNER_TEMP/lbug-ext"
          rm -rf "$dl"; mkdir -p "$dl"
          gh release download "ladybug-ext-$LBUG_VER" --repo "${{ github.repository }}"             --pattern "$PLAT-*.lbug_extension" --dir "$dl"
          # 맥 러너에는 sha256sum 이 없다. 둘 다 `<해시>  <파일>` 형식의 -c 를 읽는다.
          if command -v sha256sum >/dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          # CR 을 벗긴다: perl `shasum` 은 CRLF 목록에서 파일을 못 읽는다(실측, GNU
          # sha256sum 은 넘긴다). .gitattributes 가 LF 로 받게 하지만 여기서 한 번 더 막는다.
          (cd "$dl" && tr -d '\r' < "$sums" | grep "  $PLAT-" | $sum -c -)
          root="$HOME/.lbdb/extension/$LBUG_VER/$PLAT"
          for e in vector fts algo; do
            mkdir -p "$root/$e"
            mv "$dl/$PLAT-lib$e.lbug_extension" "$root/$e/lib$e.lbug_extension"
            sz=$(wc -c < "$root/$e/lib$e.lbug_extension" | tr -d ' ')
            # 해시 대조가 이미 막지만, 안내 페이지(153B)가 파일로 둔갑하는 옛 사고를 한 번 더 막는다.
            if [ "$sz" -lt 10000 ]; then
              echo "::error::확장 $e 가 너무 작다(${sz}B)"; exit 1
            fi
            echo "seeded $e ($sz B) from $PLAT"
          done
      - name: Build sidecar binary
        run: pyinstaller -y packaging/sidecar.spec
      - name: Stage sidecar as Tauri externalBin
        shell: bash
        run: |
          mkdir -p app/src-tauri/binaries
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          cp "dist/vinc${ext}" \
             "app/src-tauri/binaries/vinc-${{ matrix.triple }}${ext}"
      - name: Smoke test sidecar (real store open — v0.5.1/v0.5.2 회귀 재발 방지)
        # ⚠ 이전엔 `--help` 만 실행해 "빌드 성공"만 확인했다. v0.5.1/v0.5.2 는 그래서
        # ladybug 네이티브 서브모듈이 동적 import(PyInstaller 정적분석 사각)로 빠진
        # 채 빌드가 초록으로 통과·발행됐고, 실제로는 스토어가 전혀 안 열렸다(실측
        # 확정 2026-07-21 — sidecar.spec 의 collect_all("ladybug") 로 수정). 이제
        # 진짜로 `serve` 를 띄워 `/health` 가 "ok" 인지(=Database 실제 open) 3-OS
        # 전부에서 확인한다 — 여기가 초록이면 빌드뿐 아니라 런타임까지 보장된다.
        shell: bash
        run: |
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          BIN="app/src-tauri/binaries/vinc-${{ matrix.triple }}${ext}"
          # ⚠ **맥 러너에는 Homebrew OpenSSL 3 이 있고 사용자 맥에는 없을 수 있다.**
          # 엔진과 확장이 그것을 절대 경로(/opt/homebrew/opt/openssl@3)로 물면, 동봉본이
          # 빠지거나 안 쓰여도 여기서는 초록이고 사용자 기기에서만 검색이 죽는다. 그래서
          # 스모크 동안 그 경로를 가린다. 무엇을 무는지는 로그에 남긴다(otool).
          # 근거: [[vinc.ops.ladybug-upgrade-review-2026-09-24]] §2.4
          if [ "${{ runner.os }}" = "macOS" ]; then
            for f in $(python -c "import ladybug,os,glob; print(' '.join(glob.glob(os.path.join(os.path.dirname(ladybug.__file__),'_lbug*.so'))))") \
                     "$HOME"/.lbdb/extension/*/osx_arm64/*/*.lbug_extension; do
              echo "── otool -L $(basename "$f")"; otool -L "$f" | grep -i -E "ssl|crypto" || echo "   (no OpenSSL link)"
            done
            OSSL=$(brew --prefix)/opt/openssl@3
            if [ -e "$OSSL" ]; then
              sudo mv "$OSSL" "$OSSL.hidden-for-smoke"
              trap 'sudo mv "$OSSL.hidden-for-smoke" "$OSSL"' EXIT
              echo "hid $OSSL for the smoke (restored on exit)"
            fi
          fi
          "$BIN" --help
          DATA="$(mktemp -d)/db"
          SLOG="$(dirname "$DATA")/sidecar.log"
          "$BIN" serve --host 127.0.0.1 --port 18787 --token smoketest --data "$DATA" >"$SLOG" 2>&1 &
          SIDECAR_PID=$!
          ok=""
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18787/health 2>/dev/null | \
               python -c "import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get('status')=='ok' else 1)"; then
              ok=1; break
            fi
            sleep 0.5
          done
          if [ -z "$ok" ]; then
            curl -s http://127.0.0.1:18787/health || true
            kill "$SIDECAR_PID" 2>/dev/null || true
            echo "── sidecar log ──"; cat "$SLOG" || true
            echo "::error::sidecar /health never returned status=ok — store failed to open" >&2
            exit 1
          fi
          echo "sidecar /health OK — store opened for real"

          # 문서 정본 파일 입구(D45) — 동결 바이너리 안에서 실제로 왕복시킨다.
          # 두 번째 호출이 핵심이다: PDF 매직만 있고 내용은 깨진 바이트를 넣어
          # `pdf_unreadable`(= pypdf 가 실려서 파싱을 시도했다)을 요구한다.
          # pypdf 가 동결에서 빠졌다면 `pdf_support_missing` 이 나오고 여기서 죽는다 —
          # ladybug 동적 import 누락(v0.5.1/v0.5.2)과 같은 사각을 PDF 쪽에도 막는 게이트.
          H='Authorization: Bearer smoketest'
          C='Content-Type: application/json'
          U=http://127.0.0.1:18787/doc/put-file
          # 아래 검색이 찾을 단어(quartz)는 **줄 가운데**에 둔다. 엔진의 FTS 토크나이저는
          # 줄바꿈에서 끊지 않아 줄 끝·줄 머리의 단어는 옆 줄 단어와 한 토큰이 된다(실측).
          md_b64=$(printf '# smoke\n\nThe quartz body line.\n' | base64 | tr -d '\n')
          pdf_b64=$(printf '%%PDF-1.4\nnope' | base64 | tr -d '\n')
          txt=$(curl -sf -H "$H" -H "$C" -X POST "$U" \
                 -d "{\"owner\":\"user:smoke\",\"filename\":\"s.md\",\"data_b64\":\"$md_b64\"}") || true
          pdf=$(curl -sf -H "$H" -H "$C" -X POST "$U" \
                 -d "{\"owner\":\"user:smoke\",\"filename\":\"s.pdf\",\"data_b64\":\"$pdf_b64\"}") || true
          # 검색이 전문 색인을 실제로 탄다 — FTS 확장이 이 기기에서 올라왔다는 증거다.
          # /health 는 확장 없이도 ok 다. 확장이 못 올라오면 검색만 extension_unavailable 로
          # 강등되고 나머지는 초록이라, 여기서 안 보면 아무도 못 본다. 같은 질의를 세 번
          # 부르는 것은 0.20.x 의 "두 번째 파라미터 FTS 질의가 프로세스를 죽인다" 가드를
          # 동결본 안에서 확인하는 것이다.
          for n in 1 2 3; do
            srch=$(curl -sf -H "$H" "http://127.0.0.1:18787/search?query=quartz&owner=user:smoke") || true
            echo "$srch" | python -c "import json,sys; d=json.load(sys.stdin); sys.exit(0 if not d.get('error') and d.get('rows') else 1)" || {
              kill "$SIDECAR_PID" 2>/dev/null || true
              echo "── sidecar log ──"; cat "$SLOG" || true
              echo "::error::full-text search failed in the frozen binary (try $n): $srch" >&2; exit 1; }
          done
          echo "sidecar /search OK — FTS extension loaded, repeated query survived"
          kill "$SIDECAR_PID" 2>/dev/null || true
          echo "$txt" | python -c "import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get('executed') and d.get('source_format')=='text' else 1)" || {
            echo "::error::/doc/put-file text path failed in the frozen binary: $txt" >&2; exit 1; }
          echo "$pdf" | python -c "import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get('error')=='pdf_unreadable' else 1)" || {
            echo "::error::pypdf missing from the frozen binary (expected pdf_unreadable): $pdf" >&2; exit 1; }
          echo "sidecar /doc/put-file OK — textextract + pypdf shipped"

      # ── 셸(Tauri) ──────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install app deps
        working-directory: app
        run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      # 세 플랫폼 모두 일회용 호스티드 러너이므로 Rust 캐시를 복원한다.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      # 릴리스 생성 없이 번들만 빌드(tagName/releaseId 미지정 → build-only).
      # 서명 키가 env 에 있으면 tauri-action 이 업데이터 번들에 .sig 를 붙인다.
      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          # 업데이터 서명(진위 검증용, 이미 활성) — 자동 업데이트 번들 .sig.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # ── OS 코드사인·공증(별개 마일스톤, 인증서=소유자 조달) ──────────────
          # ⚠ 시크릿 미설정 상태에서 `APPLE_*: ${{ secrets.… }}` 를 직접 배선하면
          # Actions 가 **빈 문자열 env 를 주입**하고, Tauri 번들러는 존재하는(빈 값
          # 포함) APPLE_SIGNING_IDENTITY 로 codesign 을 시도해 macOS 빌드가 깨진다
          # (v0.4.0 1차 태그 빌드 실패 실측 — Linux/Windows 는 무영향이라 통과).
          # 인증서 조달 후 재배선할 것 — 그때는 빈 값 가드(pre-step 에서 비어있지
          # 않을 때만 $GITHUB_ENV 로 내보내기)와 함께:
          #   APPLE_CERTIFICATE: base64(Developer ID Application .p12)
          #   APPLE_CERTIFICATE_PASSWORD: .p12 비밀번호
          #   APPLE_SIGNING_IDENTITY: "Developer ID Application: <이름> (<TEAMID>)"
          #   APPLE_ID / APPLE_PASSWORD(앱 전용 암호) / APPLE_TEAM_ID: 공증(notary)용
          # Windows Authenticode: tauri v2 는 app/src-tauri/tauri.conf.json 의
          #   bundle.windows.certificateThumbprint(로컬 인증서 저장소) 또는 signCommand
          #   (Azure Trusted Signing 등)로 설정한다 — env 로는 주입 불가. 인증서 확보 후
          #   tauri.conf 에 배선. (EV/OV 코드사인 인증서 또는 Trusted Signing 필요.)
        with:
          projectPath: app

      # 수동 빌드에서는 공개 릴리스를 만들지 않으므로 Windows 설치 시험용 후보만
      # 하루 보관한다. 태그 릴리스는 아래 Vincs-app 직접 업로드 경로를 그대로 쓴다.
      - name: Retain Windows installer for manual upgrade smoke
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-smoke-${{ github.sha }}
          path: |
            app/src-tauri/target/release/bundle/nsis/*-setup.exe
            app/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      # ── 설치본 + 업데이터 번들 + 고정 별칭 + latest 조각을 Vincs-app draft 릴리스에
      #    **직접 업로드**한다(GitHub 아티팩트 미사용 → 저장 할당량 무관). 태그일 때만. ──
      - name: Upload to Vincs-app draft release (no Actions artifacts)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          REPO="Vinculums/Vincs-app"
          bundle=app/src-tauri/target/release/bundle
          mkdir -p up
          # 사람이 받는 표준 설치본
          find "$bundle" -type f \
            \( -name '*.dmg' -o -name '*-setup.exe' -o -name '*.msi' \
               -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec cp {} up/ \;
          # 업데이터 번들(플랫폼 1종) + 서명 → latest 조각. 키 = OS-ARCH(latest.json 규약).
          case "${{ matrix.triple }}" in
            *linux*)   key=linux-x86_64;   upd=$(find "$bundle" -type f -name '*.AppImage'    | head -1);;
            *windows*) key=windows-x86_64; upd=$(find "$bundle" -type f -name '*-setup.exe'   | head -1);;
            *darwin*)  key=darwin-aarch64; upd=$(find "$bundle" -type f -name '*.app.tar.gz'  | head -1);;
            *) echo "unknown triple ${{ matrix.triple }}"; exit 1;;
          esac
          sig="${upd}.sig"
          if [ -z "${upd:-}" ] || [ ! -f "$sig" ]; then
            echo "❌ 업데이터 서명 누락(key=$key) — TAURI_SIGNING_PRIVATE_KEY 시크릿 확인."
            echo "── bundle 트리 ──"; ls -R "$bundle" || true; exit 1
          fi
          cp "$upd" up/                 # 업데이터가 참조하는 번들도 릴리스 자산으로
          base=$(basename "$upd")
          url="https://github.com/$REPO/releases/download/$TAG/$base"
          # 조각(중간 산출물): { "<key>": { signature, url } }. assemble 이 병합 후 삭제.
          jq -n --arg k "$key" --arg s "$(cat "$sig")" --arg u "$url" \
            '{($k): {signature: $s, url: $u}}' > "up/latest-${key}.json"
          # 버전 무관 고정 별칭(공홈 다운로드 링크 안정화).
          # ⚠ 이전엔 실패해도 `|| true` 로 넘어갔다 — Tauri 번들 파일명 규칙이 바뀌면
          # 홈페이지 다운로드 버튼이 404 가 되는데 **CI 는 초록**이었다(업데이터 서명
          # 누락은 exit 1 로 막으면서 별칭 누락은 안 막는 비대칭). 이 OS 가 만들어야 할
          # 별칭이 안 나오면 릴리스를 세운다.
          mk_alias() { local p="$1" t="$2" m; m=$(find up -maxdepth 1 -type f -name "$p" | head -1)
                       if [ -z "$m" ]; then
                         echo "::error::고정 별칭 생성 실패 — 패턴 '$p' 에 맞는 번들이 없다(→ $t)." >&2
                         echo "── up/ 내용 ──"; ls -la up >&2
                         return 1
                       fi
                       cp "$m" "up/$t"; echo "alias $(basename "$m") → $t"; }
          case "${{ matrix.triple }}" in
            *windows*) mk_alias '*_x64-setup.exe'  'Vinc-x64-setup.exe' ;;
            *darwin*)  mk_alias '*_aarch64.dmg'    'Vinc-aarch64.dmg' ;;
            *linux*)   mk_alias '*_amd64.AppImage' 'Vinc-amd64.AppImage'
                       mk_alias '*_amd64.deb'      'Vinc-amd64.deb' ;;
          esac
          echo "── to upload ──"; ls -la up
          # draft 가 없으면 만든다(3개 build 잡 경쟁 — 하나만 성공, 나머지는 || true).
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$REPO" --draft \
                 --title "Vinc $TAG" --notes "Vinc $TAG" 2>/dev/null || true
          # --clobber: 재실행 멱등(같은 이름 자산 덮어쓰기).
          gh release upload "$TAG" up/* --repo "$REPO" --clobber

  assemble:
    needs: build
    # 태그 푸시(refs/tags/v*)에서만. 수동 workflow_dispatch 는 빌드 검증만.
    #
    # 다리 하나가 실패해도 돈다 — 대신 아래에서 **세 플랫폼 조각이 전부 초안에 있는지**
    # 확인하고 하나라도 없으면 선다. 그래서 같은 태그의 이전 시도에서 이미 올라간 다리
    # (예: 예산으로 시작 못 한 macOS 가 그 전 시도에서 올린 조각)로 조립할 수 있고,
    # 조각이 빠진 latest.json 은 여전히 못 나간다. 이전의 `needs` 성공 조건은 그 둘을
    # 구분하지 못했다.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    # 셀프호스티드(2026-09-06). `gh`·`jq`·`curl` 만 부르고 산출물을 짓지 않는다 —
    # 아래 preflight 가 그 셋의 존재를 먼저 확인하므로 없으면 2초에 선다.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/runner-preflight
        with:
          tools: curl jq gh

      # 3개 build 잡이 올린 latest 조각을 릴리스에서 내려받아 latest.json 으로 병합.
      - name: Assemble updater manifest (latest.json) from release fragments
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"; REPO="Vinculums/Vincs-app"
          ver="${TAG#v}"                                   # v0.6.5 → 0.6.5
          mkdir -p dl
          gh release download "$TAG" --repo "$REPO" --pattern 'latest-*.json' --dir dl
          for k in darwin-aarch64 linux-x86_64 windows-x86_64; do
            if [ ! -f "dl/latest-$k.json" ]; then
              echo "❌ latest 조각 누락: $k — 그 다리의 build 업로드 확인."; exit 1
            fi
          done
          platforms=$(jq -s 'add' dl/latest-*.json)
          jq -n --arg v "$ver" \
                --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --arg n "Vinc ${TAG} — see https://github.com/$REPO/releases" \
                --argjson p "$platforms" \
             '{version: $v, notes: $n, pub_date: $d, platforms: $p}' > dl/latest.json
          echo "── latest.json ──"; cat dl/latest.json
          gh release upload "$TAG" dl/latest.json --repo "$REPO" --clobber
          # 조각(중간 산출물)은 자산에서 제거 — 서명은 latest.json 안에 내용으로 박힘.
          for f in dl/latest-*.json; do
            gh release delete-asset "$TAG" "$(basename "$f")" --repo "$REPO" --yes 2>/dev/null || true
          done
          echo "발행 준비 완료(draft) — Vincs-app 에서 사람이 Publish."

      # 릴리스 본문의 **기본값**을 자리표시자가 아니게 만든다.
      #
      # 배경: build 잡이 draft 를 만들 때 `--notes "Vinc $TAG"` 를 넣는데, 사람이 Publish
      # 하면서 안 고치면 그대로 공개된다(v0.8.1·v0.8.2 실측 — 본문이 한 줄이었다).
      #
      # ⚠ **CHANGELOG 를 쓰지 않는다.** 처음 판이 그렇게 했는데, 그 파일은 자기 머리에
      #    "사용자 노출 카피 정본은 site/release/ 이며 이것은 개발자용 요약"이라고 적어
      #    놓은 한국어 문서다. v0.8.3 에서 이 경로가 **처음 실제로 돌아** 확인됐다:
      #    공개 릴리스 본문에 한국어 개발 산문 7,929자가 들어갔고, 이모지 머리글과
      #    내부 파일·함수 이름까지 그대로 실렸다. 자리표시자를 고치려다 반대편으로
      #    지나친 것이다. 사람이 쓴 v0.8.0 본문이 규범을 보여 준다 — 영어 사용자 산문,
      #    New/Changed/Fixed, em-dash 0.
      #
      # 그래서 기본값은 **정본을 가리키는 짧은 안내**다. 어느 독자에게도 틀리지 않고,
      # 손으로 쓴 본문이 있으면 그것이 이긴다. 진짜 노트는 사람이 쓰거나 발행 전에
      # 드래프트를 고친다(그 자리가 발행 게이트다).
      #
      # ⚠ 사람이 이미 쓴 본문은 덮지 않는다. 자리표시자이거나 비어 있을 때만 채운다 —
      #    이 잡은 재실행이 되고(assemble 은 멱등이 계약이다), 덮어쓰면 손으로 다듬은
      #    카피가 재실행 한 번에 사라진다.
      - name: Fill release notes (자리표시자일 때만 · 정본 안내로)
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"; REPO="Vinculums/Vincs-app"
          cur=$(gh release view "$TAG" --repo "$REPO" --json body -q .body || echo "")
          if [ -n "$cur" ] && [ "$cur" != "Vinc $TAG" ]; then
            echo "본문이 이미 채워져 있다 — 그대로 둔다."; exit 0
          fi
          # 영어로 쓴다 — 이 페이지의 독자는 전 세계이고, 한국어 본문은 그 절반에게
          # 읽히지 않는다. 사이트 릴리스 노트가 EN·ko 두 벌을 들고 있으므로 그쪽을
          # 가리키면 양쪽이 다 닿는다.
          {
            echo "Vinc ${TAG#v}."
            echo
            echo "Full release note: https://vincs.io/release/"
            echo "Installers are in the Assets below. Installed apps ask to update the next time they open."
          } > notes.md
          gh release edit "$TAG" --repo "$REPO" --notes-file notes.md
          echo "::notice::본문을 정본 안내로 채웠다. 발행 전에 사람이 실제 노트로 바꿀 것."
          echo "── 릴리스 본문 ──"; cat notes.md

  # ── 오래된 릴리스 자산 아카이브(경량 보존) ──────────────────────────────────
  # 배경: 매 릴리스마다 3-OS 설치본(dmg·setup.exe·msi·AppImage·deb·rpm …)이 공개 릴리스
  # 레포(Vincs-app)에 쌓인다. 바이너리는 수십~수백 MB라 버전이 늘수록 저장이 계속 커진다.
  # 정책: **최근 5개 버전**은 설치본을 그대로 두고, 그보다 오래된 릴리스는 **다운로드 자산만**
  # 제거한다. GitHub Release 자체(릴리스 노트·태그)는 남겨 이력 기록(=경량 아카이브)으로 삼는다.
  # → 저장은 회수하면서 "언제 무엇을 냈는가"의 기록과 태그(소스 대응)는 보존된다.
  # 웹사이트·업데이터는 releases/latest/download/ (= 최신 발행본) 만 참조하므로 영향 없다.
  # 태그 푸시에서만, publish 성공 후 실행. 발행과 같은 RELEASE_TOKEN(Vincs-app contents:write) 사용.
  prune:
    needs: assemble
    if: startsWith(github.ref, 'refs/tags/')
    # 셀프호스티드(2026-09-06). `curl`·`jq` 만 부른다(체크아웃도 안 한다).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Archive old releases (keep newest 5 installers, strip the rest)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/Vinculums/Vincs-app"
          keep=5
          hdr=(-H "Authorization: Bearer $GH_TOKEN"
               -H "Accept: application/vnd.github+json"
               -H "X-GitHub-Api-Version: 2022-11-28")

          # 모든 릴리스(초안 포함)를 semver 내림차순 정렬. 상위 keep개는 자산 보존, 나머지는 자산 제거.
          # created_at 이 아니라 tag_name 의 semver 로 정렬 → 태그 재발행/백필에도 "진짜 최신"을 안다.
          releases=$(curl -fsS "${hdr[@]}" "$api/releases?per_page=100")
          total=$(echo "$releases" | jq 'length')
          sorted=$(echo "$releases" | jq -c '
            sort_by(.tag_name | ltrimstr("v") | split(".") | map(try tonumber catch 0)) | reverse')
          echo "총 릴리스 ${total}개 — 최근 ${keep}개 설치본 보존, 그 외 자산 제거."
          echo "── 보존(최근 ${keep}) ──"
          echo "$sorted" | jq -r --argjson k "$keep" '.[:$k][] | "  keep  " + .tag_name'

          strip_ids=$(echo "$sorted" | jq -r --argjson k "$keep" '.[$k:][] | .id')
          if [ -z "$strip_ids" ]; then
            echo "정리 대상 없음(릴리스 ${keep}개 이하) — 종료."; exit 0
          fi

          echo "── 아카이브(자산 제거, 노트·태그 유지) ──"
          for rid in $strip_ids; do
            tag=$(echo "$sorted" | jq -r --argjson id "$rid" '.[] | select(.id==$id) | .tag_name')
            aids=$(curl -fsS "${hdr[@]}" "$api/releases/$rid/assets?per_page=100" | jq -r '.[].id')
            if [ -z "$aids" ]; then echo "  ${tag} — 이미 자산 없음(스킵)"; continue; fi
            for aid in $aids; do
              curl -fsS -X DELETE "${hdr[@]}" "$api/releases/assets/$aid"
              echo "  ${tag} — 자산 ${aid} 제거"
            done
          done
          echo "완료 — 오래된 릴리스는 노트·태그만 남겨 경량 아카이브."
