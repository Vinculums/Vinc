# Vinc 릴리스 파이프라인(D43 — P4). 태그 v* 푸시 시 3 OS에서
# ① PyInstaller로 사이드카 단일 바이너리를 만들고
# ② Tauri externalBin 규약 위치(binaries/vinc-sidecar-<target-triple>)에 배치한 뒤
# ③ tauri-action으로 설치본 + **업데이터 아티팩트(서명본)**를 "빌드만" 하고
#    (릴리스 생성 안 함) 아티팩트로 업로드.
# ④ 단일 publish 잡이 모든 설치본·업데이터 번들을 모으고 latest.json(업데이터 매니페스트)을
#    조립해 공개 릴리스 레포(Vinculums/Vincs-app)의 Releases 에 draft 로 발행한다.
# ⑤ 발행 후 prune 잡이 최근 5개 버전의 설치본만 남기고, 더 오래된 릴리스는 다운로드
#    자산만 제거한다(릴리스 노트·태그는 유지 = 경량 아카이브). 저장 회수 + 이력 보존.
# 소스 레포(Vinculums/Vinc)는 비공개 → 바이너리만 공개 레포로 내보낸다.
# 발행에는 Vincs-app 에 contents:write 권한을 가진 PAT 시크릿 RELEASE_TOKEN 을 쓴다.
#
# 자동 업데이트(v0.3.0~): tauri-action 이 TAURI_SIGNING_PRIVATE_KEY 로 업데이터 번들을
# 서명한다(개인키 시크릿이 없으면 .sig 미생성 → collect 단계가 실패 = 무서명 릴리스 차단).
# 공개키는 app/src-tauri/tauri.conf.json 의 plugins.updater.pubkey 에 박혀 있어, 클라이언트가
# 서명 불일치 번들을 거부한다. latest.json 은 releases/latest/download/latest.json 으로 서빙된다.
# 코드사인·공증(OS 신뢰 서명)은 여기와 별개의 후속 마일스톤 — 업데이터 서명은 진위 검증용.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# ── GitHub 아티팩트 미사용(저장 할당량 의존 제거) ─────────────────────────────
# 예전엔 build 가 설치본을 `bundles-*` **Actions 아티팩트**로 올리고 publish 가
# 내려받아 발행했다. Actions/Packages 저장은 계정 전체 공유 + Free 한도 0.5GB 라,
# 아티팩트가 그 한도를 채우면 "Artifact storage quota has been hit"로 릴리스가
# 통째로 막혔다(v0.6.0·v0.6.5). 이제 build 잡이 **Vincs-app 릴리스에 직접 업로드**
# 한다 — GitHub Release 자산은 그 저장 한도와 무관(무료)하므로 저장이 꽉 차 있어도
# 발행이 된다. 3개 build 잡이 같은 draft 에 올리는 경쟁은 create-if-not-exists +
# `--clobber` 로 흡수한다. 중간 산출물(latest 조각)만 자산으로 잠깐 올렸다가 assemble
# 이 병합 후 삭제한다.
jobs:
  # 태그와 파일의 버전이 어긋난 채 빌드되는 것을 막는다(가장 싼 게이트, 10초).
  # 함정: `latest.json` 의 version 은 **git 태그**에서 나오고 클라이언트 자기 버전은
  # `tauri.conf.json` 에서 온다 — 태그만 올리고 파일을 안 올리면 설치해도 버전이
  # 그대로라 **업데이트 토스트가 영원히 반복**된다. 여기서 미리 터뜨린다.
  # 실측 근거: `app/package-lock.json` 이 7릴리스(0.6.0→0.6.7) 방치돼 있었다
  # (Cargo.lock 은 체크리스트에 있는데 이건 빠진 비대칭 — scripts/version_sync.py 참조).
  version-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assert all version sites agree (and match the tag)
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            python scripts/version_sync.py --check --expect "${GITHUB_REF_NAME#v}"
          else
            python scripts/version_sync.py --check
          fi

  build:
    needs: version-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
          - os: macos-latest
            triple: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # ── 사이드카(Python) ────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # ── 임베디드 드라이버 = ladybug 단일(v0.5.3, kuzu 제거) ──────────────────
      # 3중 실증 완료(앱 완전호환·G0 오프라인 확장·교차 이관 무손실, 2026-07-20).
      - name: Install sidecar build deps (LadybugDB + pypdf)
        # pypdf = PDF 원문 적재(D45 입력 어댑터). 여기 빠뜨리면 동결 바이너리에
        # 통째로 안 실려 PDF 만 조용히 강등된다 — pyproject 의 extra 는 이 목록을
        # 대신하지 않는다(이 워크플로는 extras 를 쓰지 않고 목록을 직접 적는다).
        #
        # ⚠ `ladybug` 는 **반드시 핀한다.** 여기만 핀이 없어서 v0.7.0 릴리스가
        # Windows 에서 깨졌다(2026-08-01). 2026-07-30 에 올라온 0.19.0 이 Windows 에서
        # C API 공유 라이브러리를 못 찾는다:
        #   RuntimeError: Could not find lbug C API shared library.
        #                 Set LBUG_C_API_LIB_PATH or ... LBUG_LIB_KIND=shared
        # 즉 0.19.0 은 공유 라이브러리를 휠에서 분리한 것으로 보인다.
        #
        # 나머지 세 자리(ci.yml · hub-deploy.yml · Dockerfile.hub)는 전부
        # `ladybug==0.18.0` 이었고 **여기만 빠져 있었다** — DEPLOYMENT §1.5 가 적은
        # `package-lock.json` 비대칭과 같은 계열의 사고다.
        #
        # 부수 효과로 **테스트한 것과 배포한 것이 달랐던 것도 함께 고쳐진다**:
        # 이 자리가 핀이 없어 v0.6.7 은 그날의 최신(0.18.3)으로 빌드돼 나갔는데,
        # ci.yml 은 0.18.0 으로 테스트하고 있었다. 이제 넷 다 0.18.0 이다.
        run: pip install ladybug==0.18.0 pyyaml pyinstaller pypdf
      # ⚠ ladybug 의 `INSTALL` 을 쓰지 않는다. 0.18.0 의 내장 다운로더가 확장 서버
      # 인증서를 검증하지 못해 **CI 에서만** 죽는다(2026-08-01 실측):
      #   RuntimeException: Failed to download extension: vector
      #   ladybug 0.18.0/linux_amd64/vector  ERROR: SSL server verification failed
      # 같은 URL 을 curl 로 받으면 200 이고 바이트도 정확하다(로컬·러너 양쪽 확인).
      # 즉 서버가 아니라 **0.18.0 클라이언트의 CA 번들이 낡은 것**이다. 로컬에서 안
      # 드러난 이유는 캐시가 예전에 채워져 재다운로드가 없었기 때문이다.
      #
      # 그래서 시스템 CA 를 쓰는 curl 로 직접 받아 `~/.lbdb/extension/` 를 채운다.
      # sidecar.spec 이 `*/*/{ext}/lib{ext}.lbug_extension` 글롭으로 집어 datas 에
      # 싣는다(3개 미만이면 spec 이 빌드를 세운다). 런타임은 이 번들을 명시 경로로
      # LOAD 하므로 네트워크가 필요 없다(G0).
      - name: Seed LadybugDB extensions (G0 오프라인 번들 — spec 이 datas 로 동봉)
        shell: bash
        env:
          LBUG_VER: "0.18.0"
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Linux)   PLAT=linux_amd64 ;;
            Windows) PLAT=win_amd64 ;;
            macOS)   PLAT=osx_arm64 ;;
            *) echo "::error::알 수 없는 러너: ${{ runner.os }}"; exit 1 ;;
          esac
          root="$HOME/.lbdb/extension/$LBUG_VER/$PLAT"
          for e in vector fts algo; do
            mkdir -p "$root/$e"
            url="https://extension.ladybugdb.com/v$LBUG_VER/$PLAT/$e/lib$e.lbug_extension"
            curl -fsSL --retry 3 --retry-delay 2 -o "$root/$e/lib$e.lbug_extension" "$url"
            sz=$(wc -c < "$root/$e/lib$e.lbug_extension" | tr -d ' ')
            # 404 안내 페이지가 153B 다 — 그게 파일로 둔갑해 spec 을 통과하는 일을 막는다.
            if [ "$sz" -lt 10000 ]; then
              echo "::error::확장 $e 가 너무 작다(${sz}B) — $url"; exit 1
            fi
            echo "seeded $e ($sz B) from $PLAT"
          done
      - name: Build sidecar binary
        run: pyinstaller -y packaging/sidecar.spec
      - name: Stage sidecar as Tauri externalBin
        shell: bash
        run: |
          mkdir -p app/src-tauri/binaries
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          cp "dist/vinc-sidecar${ext}" \
             "app/src-tauri/binaries/vinc-sidecar-${{ matrix.triple }}${ext}"
      - name: Smoke test sidecar (real store open — v0.5.1/v0.5.2 회귀 재발 방지)
        # ⚠ 이전엔 `--help` 만 실행해 "빌드 성공"만 확인했다. v0.5.1/v0.5.2 는 그래서
        # ladybug 네이티브 서브모듈이 동적 import(PyInstaller 정적분석 사각)로 빠진
        # 채 빌드가 초록으로 통과·발행됐고, 실제로는 스토어가 전혀 안 열렸다(실측
        # 확정 2026-07-21 — sidecar.spec 의 collect_all("ladybug") 로 수정). 이제
        # 진짜로 `serve` 를 띄워 `/health` 가 "ok" 인지(=Database 실제 open) 3-OS
        # 전부에서 확인한다 — 여기가 초록이면 빌드뿐 아니라 런타임까지 보장된다.
        shell: bash
        run: |
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          BIN="app/src-tauri/binaries/vinc-sidecar-${{ matrix.triple }}${ext}"
          "$BIN" --help
          DATA="$(mktemp -d)/db"
          "$BIN" serve --host 127.0.0.1 --port 18787 --token smoketest --data "$DATA" &
          SIDECAR_PID=$!
          ok=""
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18787/health 2>/dev/null | \
               python -c "import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get('status')=='ok' else 1)"; then
              ok=1; break
            fi
            sleep 0.5
          done
          if [ -z "$ok" ]; then
            kill "$SIDECAR_PID" 2>/dev/null || true
            echo "::error::sidecar /health never returned status=ok — store failed to open" >&2
            exit 1
          fi
          echo "sidecar /health OK — store opened for real"

          # 문서 정본 파일 입구(D45) — 동결 바이너리 안에서 실제로 왕복시킨다.
          # 두 번째 호출이 핵심이다: PDF 매직만 있고 내용은 깨진 바이트를 넣어
          # `pdf_unreadable`(= pypdf 가 실려서 파싱을 시도했다)을 요구한다.
          # pypdf 가 동결에서 빠졌다면 `pdf_support_missing` 이 나오고 여기서 죽는다 —
          # ladybug 동적 import 누락(v0.5.1/v0.5.2)과 같은 사각을 PDF 쪽에도 막는 게이트.
          H='Authorization: Bearer smoketest'
          C='Content-Type: application/json'
          U=http://127.0.0.1:18787/doc/put-file
          md_b64=$(printf '# smoke\n\nbody line.\n' | base64 | tr -d '\n')
          pdf_b64=$(printf '%%PDF-1.4\nnope' | base64 | tr -d '\n')
          txt=$(curl -sf -H "$H" -H "$C" -X POST "$U" \
                 -d "{\"owner\":\"user:smoke\",\"filename\":\"s.md\",\"data_b64\":\"$md_b64\"}") || true
          pdf=$(curl -sf -H "$H" -H "$C" -X POST "$U" \
                 -d "{\"owner\":\"user:smoke\",\"filename\":\"s.pdf\",\"data_b64\":\"$pdf_b64\"}") || true
          kill "$SIDECAR_PID" 2>/dev/null || true
          echo "$txt" | python -c "import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get('executed') and d.get('source_format')=='text' else 1)" || {
            echo "::error::/doc/put-file text path failed in the frozen binary: $txt" >&2; exit 1; }
          echo "$pdf" | python -c "import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get('error')=='pdf_unreadable' else 1)" || {
            echo "::error::pypdf missing from the frozen binary (expected pdf_unreadable): $pdf" >&2; exit 1; }
          echo "sidecar /doc/put-file OK — textextract + pypdf shipped"

      # ── 셸(Tauri) ──────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install app deps
        working-directory: app
        run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Linux webkit deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf

      # 릴리스 생성 없이 번들만 빌드(tagName/releaseId 미지정 → build-only).
      # 서명 키가 env 에 있으면 tauri-action 이 업데이터 번들에 .sig 를 붙인다.
      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          # 업데이터 서명(진위 검증용, 이미 활성) — 자동 업데이트 번들 .sig.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # ── OS 코드사인·공증(별개 마일스톤, 인증서=소유자 조달) ──────────────
          # ⚠ 시크릿 미설정 상태에서 `APPLE_*: ${{ secrets.… }}` 를 직접 배선하면
          # Actions 가 **빈 문자열 env 를 주입**하고, Tauri 번들러는 존재하는(빈 값
          # 포함) APPLE_SIGNING_IDENTITY 로 codesign 을 시도해 macOS 빌드가 깨진다
          # (v0.4.0 1차 태그 빌드 실패 실측 — Linux/Windows 는 무영향이라 통과).
          # 인증서 조달 후 재배선할 것 — 그때는 빈 값 가드(pre-step 에서 비어있지
          # 않을 때만 $GITHUB_ENV 로 내보내기)와 함께:
          #   APPLE_CERTIFICATE: base64(Developer ID Application .p12)
          #   APPLE_CERTIFICATE_PASSWORD: .p12 비밀번호
          #   APPLE_SIGNING_IDENTITY: "Developer ID Application: <이름> (<TEAMID>)"
          #   APPLE_ID / APPLE_PASSWORD(앱 전용 암호) / APPLE_TEAM_ID: 공증(notary)용
          # Windows Authenticode: tauri v2 는 app/src-tauri/tauri.conf.json 의
          #   bundle.windows.certificateThumbprint(로컬 인증서 저장소) 또는 signCommand
          #   (Azure Trusted Signing 등)로 설정한다 — env 로는 주입 불가. 인증서 확보 후
          #   tauri.conf 에 배선. (EV/OV 코드사인 인증서 또는 Trusted Signing 필요.)
        with:
          projectPath: app

      # ── 설치본 + 업데이터 번들 + 고정 별칭 + latest 조각을 Vincs-app draft 릴리스에
      #    **직접 업로드**한다(GitHub 아티팩트 미사용 → 저장 할당량 무관). 태그일 때만. ──
      - name: Upload to Vincs-app draft release (no Actions artifacts)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          REPO="Vinculums/Vincs-app"
          bundle=app/src-tauri/target/release/bundle
          mkdir -p up
          # 사람이 받는 표준 설치본
          find "$bundle" -type f \
            \( -name '*.dmg' -o -name '*-setup.exe' -o -name '*.msi' \
               -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec cp {} up/ \;
          # 업데이터 번들(플랫폼 1종) + 서명 → latest 조각. 키 = OS-ARCH(latest.json 규약).
          case "${{ matrix.triple }}" in
            *linux*)   key=linux-x86_64;   upd=$(find "$bundle" -type f -name '*.AppImage'    | head -1);;
            *windows*) key=windows-x86_64; upd=$(find "$bundle" -type f -name '*-setup.exe'   | head -1);;
            *darwin*)  key=darwin-aarch64; upd=$(find "$bundle" -type f -name '*.app.tar.gz'  | head -1);;
            *) echo "unknown triple ${{ matrix.triple }}"; exit 1;;
          esac
          sig="${upd}.sig"
          if [ -z "${upd:-}" ] || [ ! -f "$sig" ]; then
            echo "❌ 업데이터 서명 누락(key=$key) — TAURI_SIGNING_PRIVATE_KEY 시크릿 확인."
            echo "── bundle 트리 ──"; ls -R "$bundle" || true; exit 1
          fi
          cp "$upd" up/                 # 업데이터가 참조하는 번들도 릴리스 자산으로
          base=$(basename "$upd")
          url="https://github.com/$REPO/releases/download/$TAG/$base"
          # 조각(중간 산출물): { "<key>": { signature, url } }. assemble 이 병합 후 삭제.
          jq -n --arg k "$key" --arg s "$(cat "$sig")" --arg u "$url" \
            '{($k): {signature: $s, url: $u}}' > "up/latest-${key}.json"
          # 버전 무관 고정 별칭(공홈 다운로드 링크 안정화).
          # ⚠ 이전엔 실패해도 `|| true` 로 넘어갔다 — Tauri 번들 파일명 규칙이 바뀌면
          # 홈페이지 다운로드 버튼이 404 가 되는데 **CI 는 초록**이었다(업데이터 서명
          # 누락은 exit 1 로 막으면서 별칭 누락은 안 막는 비대칭). 이 OS 가 만들어야 할
          # 별칭이 안 나오면 릴리스를 세운다.
          mk_alias() { local p="$1" t="$2" m; m=$(find up -maxdepth 1 -type f -name "$p" | head -1)
                       if [ -z "$m" ]; then
                         echo "::error::고정 별칭 생성 실패 — 패턴 '$p' 에 맞는 번들이 없다(→ $t)." >&2
                         echo "── up/ 내용 ──"; ls -la up >&2
                         return 1
                       fi
                       cp "$m" "up/$t"; echo "alias $(basename "$m") → $t"; }
          case "${{ matrix.triple }}" in
            *windows*) mk_alias '*_x64-setup.exe'  'Vinc-x64-setup.exe' ;;
            *darwin*)  mk_alias '*_aarch64.dmg'    'Vinc-aarch64.dmg' ;;
            *linux*)   mk_alias '*_amd64.AppImage' 'Vinc-amd64.AppImage'
                       mk_alias '*_amd64.deb'      'Vinc-amd64.deb' ;;
          esac
          echo "── to upload ──"; ls -la up
          # draft 가 없으면 만든다(3개 build 잡 경쟁 — 하나만 성공, 나머지는 || true).
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$REPO" --draft \
                 --title "Vinc $TAG" --notes "Vinc $TAG" 2>/dev/null || true
          # --clobber: 재실행 멱등(같은 이름 자산 덮어쓰기).
          gh release upload "$TAG" up/* --repo "$REPO" --clobber

  assemble:
    needs: build
    # 태그 푸시(refs/tags/v*)에서만. 수동 workflow_dispatch 는 빌드 검증만.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4   # 아래 릴리스 노트 스텝이 CHANGELOG 를 읽는다

      # 3개 build 잡이 올린 latest 조각을 릴리스에서 내려받아 latest.json 으로 병합.
      - name: Assemble updater manifest (latest.json) from release fragments
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"; REPO="Vinculums/Vincs-app"
          ver="${TAG#v}"                                   # v0.6.5 → 0.6.5
          mkdir -p dl
          gh release download "$TAG" --repo "$REPO" --pattern 'latest-*.json' --dir dl
          if ! ls dl/latest-*.json >/dev/null 2>&1; then
            echo "❌ latest 조각이 릴리스에 없다 — build 업로드 확인."; exit 1
          fi
          platforms=$(jq -s 'add' dl/latest-*.json)
          jq -n --arg v "$ver" \
                --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --arg n "Vinc ${TAG} — see https://github.com/$REPO/releases" \
                --argjson p "$platforms" \
             '{version: $v, notes: $n, pub_date: $d, platforms: $p}' > dl/latest.json
          echo "── latest.json ──"; cat dl/latest.json
          gh release upload "$TAG" dl/latest.json --repo "$REPO" --clobber
          # 조각(중간 산출물)은 자산에서 제거 — 서명은 latest.json 안에 내용으로 박힘.
          for f in dl/latest-*.json; do
            gh release delete-asset "$TAG" "$(basename "$f")" --repo "$REPO" --yes 2>/dev/null || true
          done
          echo "발행 준비 완료(draft) — Vincs-app 에서 사람이 Publish."

      # 릴리스 본문을 CHANGELOG 에서 채운다.
      # 배경: build 잡이 draft 를 만들 때 `--notes "Vinc $TAG"` 로 **자리표시자**를 넣는데,
      # 사람이 Publish 하면서 그걸 안 고치면 그대로 공개된다(v0.8.2 실측 — 본문이
      # "Vinc v0.8.2" 한 줄로 발행됐다). 릴리스 페이지는 업데이터 알림과 다운로드에서
      # 사람이 실제로 열어 보는 자리이므로, 아무도 안 고쳤을 때의 기본값을 자리표시자가
      # 아니라 **그 릴리스의 CHANGELOG 절**로 둔다.
      #
      # ⚠ 사람이 이미 쓴 본문은 덮지 않는다. 자리표시자이거나 비어 있을 때만 채운다 —
      #    이 잡은 재실행이 되고(assemble 은 멱등이 계약이다), 덮어쓰면 손으로 다듬은
      #    카피가 재실행 한 번에 사라진다.
      # ⚠ CHANGELOG 절이 없어도 릴리스를 세우지 않는다. v0.8.1 은 절 없이 나갔고,
      #    노트가 없다는 이유로 빌드된 설치본을 버리는 것은 대가가 맞지 않는다.
      - name: Fill release notes from CHANGELOG (자리표시자일 때만)
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"; REPO="Vinculums/Vincs-app"
          cur=$(gh release view "$TAG" --repo "$REPO" --json body -q .body || echo "")
          if [ -n "$cur" ] && [ "$cur" != "Vinc $TAG" ]; then
            echo "본문이 이미 채워져 있다 — 그대로 둔다."; exit 0
          fi
          # `## v0.8.2 ...` 부터 다음 `## v` 직전까지. 제목 줄은 h2 로 남긴다.
          awk -v tag="$TAG" '
            $0 ~ "^## " tag "( |$)" { on = 1 }
            on && /^## / && $0 !~ "^## " tag "( |$)" { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::warning::CHANGELOG.md 에 $TAG 절이 없다 — 자리표시자 본문을 유지한다." >&2
            exit 0
          fi
          {
            echo
            echo "---"
            echo
            echo "사용자용 릴리스 노트: https://vincs.io/release/"
            echo "설치 파일은 아래 Assets 에 있다. 설치된 앱은 스스로 업데이트된다."
          } >> notes.md
          gh release edit "$TAG" --repo "$REPO" --notes-file notes.md
          echo "── 릴리스 본문 ──"; head -20 notes.md

  # ── 오래된 릴리스 자산 아카이브(경량 보존) ──────────────────────────────────
  # 배경: 매 릴리스마다 3-OS 설치본(dmg·setup.exe·msi·AppImage·deb·rpm …)이 공개 릴리스
  # 레포(Vincs-app)에 쌓인다. 바이너리는 수십~수백 MB라 버전이 늘수록 저장이 계속 커진다.
  # 정책: **최근 5개 버전**은 설치본을 그대로 두고, 그보다 오래된 릴리스는 **다운로드 자산만**
  # 제거한다. GitHub Release 자체(릴리스 노트·태그)는 남겨 이력 기록(=경량 아카이브)으로 삼는다.
  # → 저장은 회수하면서 "언제 무엇을 냈는가"의 기록과 태그(소스 대응)는 보존된다.
  # 웹사이트·업데이터는 releases/latest/download/ (= 최신 발행본) 만 참조하므로 영향 없다.
  # 태그 푸시에서만, publish 성공 후 실행. 발행과 같은 RELEASE_TOKEN(Vincs-app contents:write) 사용.
  prune:
    needs: assemble
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Archive old releases (keep newest 5 installers, strip the rest)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/Vinculums/Vincs-app"
          keep=5
          hdr=(-H "Authorization: Bearer $GH_TOKEN"
               -H "Accept: application/vnd.github+json"
               -H "X-GitHub-Api-Version: 2022-11-28")

          # 모든 릴리스(초안 포함)를 semver 내림차순 정렬. 상위 keep개는 자산 보존, 나머지는 자산 제거.
          # created_at 이 아니라 tag_name 의 semver 로 정렬 → 태그 재발행/백필에도 "진짜 최신"을 안다.
          releases=$(curl -fsS "${hdr[@]}" "$api/releases?per_page=100")
          total=$(echo "$releases" | jq 'length')
          sorted=$(echo "$releases" | jq -c '
            sort_by(.tag_name | ltrimstr("v") | split(".") | map(try tonumber catch 0)) | reverse')
          echo "총 릴리스 ${total}개 — 최근 ${keep}개 설치본 보존, 그 외 자산 제거."
          echo "── 보존(최근 ${keep}) ──"
          echo "$sorted" | jq -r --argjson k "$keep" '.[:$k][] | "  keep  " + .tag_name'

          strip_ids=$(echo "$sorted" | jq -r --argjson k "$keep" '.[$k:][] | .id')
          if [ -z "$strip_ids" ]; then
            echo "정리 대상 없음(릴리스 ${keep}개 이하) — 종료."; exit 0
          fi

          echo "── 아카이브(자산 제거, 노트·태그 유지) ──"
          for rid in $strip_ids; do
            tag=$(echo "$sorted" | jq -r --argjson id "$rid" '.[] | select(.id==$id) | .tag_name')
            aids=$(curl -fsS "${hdr[@]}" "$api/releases/$rid/assets?per_page=100" | jq -r '.[].id')
            if [ -z "$aids" ]; then echo "  ${tag} — 이미 자산 없음(스킵)"; continue; fi
            for aid in $aids; do
              curl -fsS -X DELETE "${hdr[@]}" "$api/releases/assets/$aid"
              echo "  ${tag} — 자산 ${aid} 제거"
            done
          done
          echo "완료 — 오래된 릴리스는 노트·태그만 남겨 경량 아카이브."
