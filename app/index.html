<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 파비콘 — 여태 없어서 vincs.io/app/ 탭에 브라우저 기본 지구본이 떴다(실측).
         실체는 public/favicon.svg 이고 Vite 가 dist 루트로 복사하면서 이 절대경로에
         base 를 접두한다: 웹 빌드(VITE_BASE=/app/) → /app/favicon.svg,
         셸 빌드(base "/") → /favicon.svg. 두 빌드가 각자 자기 자산을 가리킨다.
         정본은 Vinc-homepage/site/favicon.svg 와 바이트 동일(수기 동기 — 로고가
         바뀌면 두 곳을 함께 갱신할 것). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Vinc · Map of knowledge.</title>
  </head>
  <body>
    <!-- 커스텀 타이틀바(데스크탑 셸 전용 · decorations:false 프레임리스). 웹/브라우저 dev 는
         [data-shell] 미부여로 숨김. 드래그=data-tauri-drag-region, 창제어=main.ts 배선. -->
    <div id="titlebar" data-tauri-drag-region>
      <!-- 로고는 여기 하나뿐이다. 예전엔 상단 바(#brand)에 있었는데, 타이틀바가
           바로 위에 있어 창 좌상단에 마크와 이름이 두 번 나왔다. 웹 빌드는 이 줄이
           없고 공홈 GNB 가 로고를 들고 있으므로, 어느 표면에서도 한 번만 나온다. -->
      <span class="tb-title" data-tauri-drag-region>
        <svg class="brand-logo" viewBox="1.9 0 66.4 63" role="img" aria-label="Vinc">
          <defs>
            <linearGradient id="vinc-tb-tip" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="currentColor"/>
              <stop offset=".62" stop-color="currentColor"/>
              <stop offset="1" stop-color="var(--logo-tip)"/>
            </linearGradient>
          </defs>
          <path fill="url(#vinc-tb-tip)" d="M3.86041 7.35091C2.56731 4.8785 1.92075 3.6423 2.04804 2.69691C2.16092 1.85854 2.59746 1.13737 3.28792 0.64862C4.06651 0.097477 5.44973 0.0971137 8.21617 0.0963872L14.291 0.0947918C15.1057 0.0945778 15.513 0.0944709 15.5751 0.0970306C15.852 0.108439 15.6292 0.0869573 15.9032 0.128671C15.9647 0.13803 16.109 0.166174 16.3977 0.22246C16.5558 0.253299 16.5036 0.548182 16.3487 0.592308C9.52905 2.53495 8.30154 9.5045 9.79969 15.8897C10.1438 17.3277 10.6202 18.7291 11.2226 20.0751C12.215 22.3256 13.4312 24.5429 14.5848 26.7124L18.5321 34.1941L21.834 40.4412C23.6168 43.8629 24.9579 46.7259 27.8544 49.3657C34.5318 55.4509 41.8297 52.0686 46.0951 44.9843C46.1322 44.9227 46.2156 44.9074 46.2712 44.9529C46.3134 44.9873 46.3265 45.0461 46.3024 45.095C45.7979 46.1186 45.0331 47.3751 44.4811 48.4279C42.7332 51.8159 40.9544 55.1872 39.1448 58.541C37.9771 60.7226 37.3932 61.8134 36.7769 62.2292C35.7365 62.931 34.4528 62.9292 33.4144 62.2244C32.7993 61.8069 32.2244 60.7257 31.0747 58.5631L12.3646 23.3702C9.79425 18.4665 7.19672 13.5777 4.57219 8.70416C4.33567 8.25768 4.09842 7.80597 3.86041 7.35091Z"/>
          <path fill="url(#vinc-tb-tip)" d="M58.4066 0.025589C59.3877 0.046639 60.6496 0.0130453 61.5999 0.0607452C61.8525 0.0585323 62.1051 0.0576938 62.3577 0.0558624C63.6175 0.04673 64.5644 0.0399937 65.2943 0.104691C66.0242 0.169399 66.5413 0.305844 66.9398 0.586136C67.6198 1.0645 68.09 1.84095 68.1985 2.66524C68.2621 3.1483 68.1436 3.67035 67.8626 4.34688C67.5816 5.02323 67.136 5.8578 66.5443 6.96895C65.7597 8.44203 64.9704 9.91322 64.1829 11.3801L61.8343 15.7668L54.5306 29.634C54.4879 29.7143 54.3781 29.7264 54.3187 29.6574C54.2837 29.6168 54.2768 29.5591 54.3021 29.5119C55.6688 26.9687 56.9708 24.3768 58.3294 21.8283C59.689 19.2778 61.5373 14.8671 62.2064 10.6447C62.8758 6.41976 62.3625 2.39746 59.0159 0.601761C58.6938 0.428894 58.3159 0.349251 57.9485 0.323441C57.6799 0.304563 57.3916 0.283391 57.2659 0.277542C57.2391 0.276295 57.2133 0.266555 57.1927 0.249222C57.1624 0.223694 57.1486 0.186693 57.1536 0.152542C57.1589 0.117599 57.1843 0.0878384 57.2249 0.0783234C57.3771 0.042775 57.6145 0.0305941 57.8411 0.0265656C57.9548 0.0245464 58.0665 0.0252499 58.1644 0.025589C58.2626 0.0259299 58.3479 0.0264659 58.4066 0.025589Z"/>
        </svg>
        <span>Vinc</span>
      </span>
      <div class="tb-controls">
        <button class="tb-btn" id="tb-min" type="button" aria-label="Minimize">
          <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 5h8" stroke="currentColor" stroke-width="1"/></svg></button>
        <button class="tb-btn" id="tb-max" type="button" aria-label="Maximize">
          <svg viewBox="0 0 10 10" aria-hidden="true"><rect x="1.2" y="1.2" width="7.6" height="7.6" fill="none" stroke="currentColor" stroke-width="1"/></svg></button>
        <button class="tb-btn tb-close" id="tb-close" type="button" aria-label="Close">
          <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 1l8 8M9 1l-8 8" stroke="currentColor" stroke-width="1.1"/></svg></button>
      </div>
    </div>
    <!-- 공홈 GNB는 웹 빌드(data-skin=web)에서만 main.ts가 공유 /assets/gnb.js 를 런타임 주입한다.
         데스크탑 셸에선 미주입 → 앱 크롬(좌측 레일)만. (단일 소스: Vinc-homepage/site/assets/gnb.js) -->
    <!-- D69 — 셸은 상단 바 + 좌측 문서 트리 + 표면이다. D56 이 상단 바 하나로
         몰아넣었던 것을 되돌리되, 좌측에 사는 것은 **표면 목록이 아니라 문서 트리**다
         (구 레일이 장식이었던 이유가 그거다: 행을 눌러도 갈 곳이 없었다).
         LNB 는 오버레이가 아니라 **그리드 열**이라 캔버스를 덮지 않는다 — 표면이
         줄어들 뿐이므로 캔버스 안 absolute 크롬은 요소별 오프셋 없이 따라 좁아진다. -->
    <div id="shell">
      <header id="topbar">


        <!-- 셸 손잡이(설정·도구·GRAPH.md)는 **왼쪽**에 산다. 오른쪽에 있던 동안에는
             지도 손잡이(보기·관점)와 한 덩어리로 보여, 앱을 다루는 일과 지도를 보는
             방식을 고르는 일이 같은 무리로 읽혔다. 이제 왼쪽 = 앱, 오른쪽 = 지도다. -->
        <div id="tb-actions">
          <button class="tb-icon" id="settings-btn" data-icon="settings"
                  aria-haspopup="dialog"></button>
          <!-- D71 — 지식이 드나드는 문 셋(만들기·가져오기·공유)을 버튼 하나로 모은다. -->
          <button class="tb-icon" id="tb-tools"></button>
          <!-- GRAPH.md(GM-8 관례 파일) — 아이콘 하나가 두 일을 겸한다: 편집 + 재가 대기.
               뱃지가 없으면 이 자리에 있을 자격이 없다(상시 점유의 근거가 뱃지다). -->
          <button class="tb-icon tb-conv" id="tb-conv" data-icon="ring"
                  aria-haspopup="dialog"><span id="tb-conv-badge" hidden></span></button>
        </div>

        <!-- 상시 검색(D57) — 조회는 그래프를 훑는 일이 아니라 이름을 대는 일이다.
             Enter = 첫 결과로 착지, 클릭 = 그 노드로 착지(#atlas/trace/<id>).

             모드 2종(D73). 왼쪽 끝 버튼이 모드를 고른다 — 아이콘 자리를 드롭다운
             트리거가 겸한다(아이콘은 그대로 남고 라벨·캐럿이 붙는다).
               찾기 = 기존 동작(드롭다운 결과 → 착지)
               묻기 = 무LLM 대화(질문 우측 · 답변 좌측 · 이력 보존)
             모드는 바의 `data-mode` 로 드러나고 CSS·JS 가 그 하나만 본다. -->
        <div id="tb-search" data-mode="find">
          <button class="tb-mode" id="tb-mode" type="button"
                  aria-haspopup="menu" aria-expanded="false" aria-controls="tb-modemenu">
            <span class="tb-sicon" aria-hidden="true"></span>
            <span class="tb-mode-label" id="tb-mode-label"></span>
            <span class="tb-caret" aria-hidden="true"></span>
          </button>
          <input id="tb-q" type="search" autocomplete="off" spellcheck="false"
                 role="combobox" aria-expanded="false" aria-controls="tb-results" />
          <span class="tb-kbd" id="tb-kbd"></span>
          <div class="tb-modemenu" id="tb-modemenu" role="menu" hidden></div>
          <div id="tb-results" role="listbox" hidden></div>
          <!-- 대화 패널 — 내용은 ask.ts 가 채운다. 첫 턴 전까지는 hidden 이라
               바가 평소 높이 그대로다(늘어남은 첫 질문 이후에만 일어난다). -->
          <div id="tb-chat" hidden></div>
        </div>

        <!-- 지도 손잡이(D71) — 보기와 범례 + 관점 세그. 검색 **오른쪽**이다: 지도를
             보는 방식은 지도 옆에서 고르는 것이 자연스럽고, 왼쪽 셸 손잡이와 섞이지
             않는다. 내용은 Atlas 가 채우고 떠날 때 비운다(setAtlasHooks). -->
        <div id="tb-lens"></div>
        <div id="tb-views" role="group"></div>
      </header>
      <!-- 좌측 문서 트리(D69). 내용은 lnb.ts 가 채운다. 접히면 폭 0 이 되므로
           다시 여는 손잡이는 사이드바 **밖**(셸 직속)에 둔다. -->
      <aside id="lnb" aria-label="Documents"></aside>
      <button id="lnb-reopen" type="button" class="tb-icon" aria-controls="lnb"></button>
      <!-- 문서 내용 열 — 예전엔 캔버스 **위에 겹쳐 뜨는** 우측 레일(#atlas-detail)이었다.
           겹쳐 있던 동안에는 지도를 보려면 상세를 닫아야 했고, 상세를 보려면 지도를
           가려야 했다(둘을 나란히 두는 방법이 없었다). 이제 LNB 와 같은 **그리드 열**
           이므로 지도가 줄어들 뿐 가려지지 않는다: 왼쪽에서 오른쪽으로 문서 목록 →
           그 문서의 내용 → 지도로 좁혀 들어가는 한 줄이 된다.
           내용은 표면이 채운다(Atlas 가 자기 상세를 여기로 옮겨 심는다) — 열은 셸의
           것이고 그 안에 무엇이 들어갈지는 표면이 정한다. -->
      <!-- 머리는 **셸**이 갖고 본문만 표면이 채운다. 그래서 라우터가 표면을 갈아끼울
           때 비우는 것도 본문뿐이다(머리가 함께 지워지면 접기 손잡이가 사라진다). -->
      <!-- 클리핑 칸 — 패널이 접힐 때 **왼쪽으로 미끄러져 나가는데**, 그 이동은 자기
           그리드 칸을 넘어가므로 클립해 주는 부모가 없으면 LNB 위를 지나간다(실측 버그).
           칸은 표면과 같은 자리를 차지하되 `pointer-events: none` 이라 지도 조작을
           막지 않는다 — 클릭을 받는 것은 안의 패널뿐이다. -->
      <div id="docpane-slot">
      <aside id="docpane" aria-label="Document" hidden>
        <!-- 머리에 이름표는 없다(발주자 지시 2026-08-05). 열 안의 층이 이미 자기
             이름을 말하고(`노드 상세`·`문서`), 그 위에 `문서 내용`을 한 줄 더 두면
             같은 자리에서 두 번 자기소개를 하는 셈이었다. 머리가 남는 이유는 접기
             손잡이와 LNB 머리와의 높이 정렬뿐이다. 열 이름은 `aria-label` 이 든다. -->
        <div class="pane-head">
          <button class="tb-icon lnb-x" id="docpane-fold" type="button"
                  aria-controls="docpane-body"></button>
        </div>
        <div class="pane-body" id="docpane-body"></div>
      </aside>
      </div>
      <!-- 접힌 열을 다시 펴는 손잡이 — 열이 폭 0 이 되면 그 안의 버튼도 함께 사라지므로
           셸 직속이다(LNB 와 같은 이유·같은 모양). 접힘일 때만 보인다: 선택이 없는
           상태(닫힘)에서는 펼칠 내용이 없으므로 손잡이도 있을 자격이 없다. -->
      <button id="docpane-reopen" type="button" class="tb-icon" aria-controls="docpane"></button>
      <main id="surface" aria-live="polite"></main>
      <div id="settings-scrim" hidden></div>
      <div id="settings-popover" role="dialog" aria-label="Settings" aria-modal="true" hidden></div>
      <div id="palette" hidden></div>
      <div id="cheatsheet" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
