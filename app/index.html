<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 파비콘 — 여태 없어서 vincs.io/app/ 탭에 브라우저 기본 지구본이 떴다(실측).
         실체는 public/favicon.svg 이고 Vite 가 dist 루트로 복사하면서 이 절대경로에
         base 를 접두한다: 웹 빌드(VITE_BASE=/app/) → /app/favicon.svg,
         셸 빌드(base "/") → /favicon.svg. 두 빌드가 각자 자기 자산을 가리킨다.
         정본은 design-hub/assets/logo/vinc-ring-favicon.svg(판 없는 링, 다크 탭에선 흰색) 이고
         sync_out.py 가 여기로 나른다(각인 대조는 --check). **손으로 고치지 말 것** —
         예전엔 "수기 동기, 로고가 바뀌면 두 곳을 함께 갱신할 것"이라고 적혀 있었고,
         그 방식이 로고 교체를 44곳짜리 일로 만들었다. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Vinc · Map of knowledge.</title>
  </head>
  <body>
    <!-- 커스텀 타이틀바(데스크탑 셸 전용 · decorations:false 프레임리스). 웹/브라우저 dev 는
         [data-shell] 미부여로 숨김. 드래그=data-tauri-drag-region, 창제어=main.ts 배선. -->
    <div id="titlebar" data-tauri-drag-region>
      <!-- 로고는 여기 하나뿐이다. 예전엔 상단 바(#brand)에 있었는데, 타이틀바가
           바로 위에 있어 창 좌상단에 마크와 이름이 두 번 나왔다. 웹 빌드는 이 줄이
           없고 공홈 GNB 가 로고를 들고 있으므로, 어느 표면에서도 한 번만 나온다. -->
      <span class="tb-title" data-tauri-drag-region>
        <!-- 모노 마크를 CSS mask 로 깐다(app.css `.tb-title .brand-logo`).
             ⚠ `<img src>` 로는 안 된다 — currentColor 가 img 경계를 못 넘어
             주변 글자색 대신 검정으로 그려진다. mask 로 쓰면 파일은 바깥에
             남고 색은 CSS 가 준다. 구 마크가 하던 것과 같은 동작이다.
             ⚠ **다시 인라인하지 말 것.** 인라인 사본이 정본에 닿지 않는 것이
             로고 교체를 44곳짜리 일로 만들었다. 이 자리가 가리키는 파일은
             design-hub 가 sync_out.py 로 내보낸 public/vinc-mark-mono.svg 다.
             근거: [[record:a-logo-ssot-that-reaches-nobody]] -->
        <span class="brand-logo" role="img" aria-label="Vinc"></span>
        <span>Vinc</span>
      </span>
      <div class="tb-controls">
        <button class="tb-btn" id="tb-min" type="button" aria-label="Minimize">
          <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 5h8" stroke="currentColor" stroke-width="1"/></svg></button>
        <button class="tb-btn" id="tb-max" type="button" aria-label="Maximize">
          <svg viewBox="0 0 10 10" aria-hidden="true"><rect x="1.2" y="1.2" width="7.6" height="7.6" fill="none" stroke="currentColor" stroke-width="1"/></svg></button>
        <button class="tb-btn tb-close" id="tb-close" type="button" aria-label="Close">
          <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 1l8 8M9 1l-8 8" stroke="currentColor" stroke-width="1.1"/></svg></button>
      </div>
    </div>
    <!-- 공홈 GNB는 웹 빌드(data-skin=web)에서만 main.ts가 공유 /assets/gnb.js 를 런타임 주입한다.
         데스크탑 셸에선 미주입 → 앱 크롬(좌측 레일)만. (단일 소스: Vinc-homepage/site/assets/gnb.js) -->
    <!-- 셸은 종 레일 + 문서 트리 + 표면이다. 좌측 문서 트리(LNB)는 그리드 열이라
         열릴 때 표면이 좁아진다. 문서 내용 패널은 표면과 같은 칸 위에 떠서
         지도를 좁히지 않는다. 상단 바에는 검색 카드와 보기 카드가 선다. -->
    <div id="shell">
      <!-- 셸은 두 열이다: 왼쪽 LNB 한 장, 오른쪽 내용 칸(문서 홈 또는 그래프).
           LNB 는 층이 하나다(2026-10-22). 맨 위 줄에 홈 · Agent · 접기 손잡이가 서고,
           그 아래가 주제와 문서 트리, 바닥이 설정이다. 접으면 폭이 좁은 띠가 되어
           손잡이 셋과 설정만 남는다(다시 펼 손잡이가 사라지지 않는다).
           종(개념·결정·기록…) 버튼 줄은 없앴다 — 문서를 다루는 자리에서 노드 종을
           고르는 일은 그래프의 범례가 맡는다.
           근거: [[decision:the-desktop-shell-is-documents-first]] -->
      <aside id="lnb" aria-label="Documents">
        <div class="lnb-top" id="lnb-top">
          <nav class="lnb-nav" id="rail-kinds" aria-label="Kinds"></nav>
          <button class="tb-icon" id="tb-shell-toggle" type="button" aria-controls="lnb"></button>
        </div>
        <!-- 머리(`#lnb-head`)와 트리(`#lnb-body`)는 lnb.ts 가 이 자리(바닥 앞)에 심는다. -->
        <div class="lnb-foot" id="lnb-foot">
          <button class="rail-btn rail-settings" id="rail-settings" type="button"
                  aria-haspopup="dialog">
            <span id="rail-settings-badge" class="rail-n" hidden></span>
          </button>
        </div>
      </aside>
      <!-- 오른쪽 위 손잡이 묶음. 두 줄이다: 위는 검색(눌러야 길게 펴진다), 아래는
           그래프 전환과 보기 카드(관점 세그 + 옵션·범례). 바는 내용 칸 위에 뜨고
           빈 자리는 클릭을 통과시킨다(내용을 가리지 않는다). -->
      <header id="topbar">
        <div class="tb-line" id="tb-line-find">
          <!-- 상시 검색(D57). 접힌 모습은 알약 하나(아이콘 · 이름 · 단축키)이고,
               누르거나 ⌘/Ctrl K 를 치면 길게 펴진다. Enter = 첫 결과로 착지.
               모드 2종(D73): 찾기 · 묻기. 모드는 바의 `data-mode` 로 드러난다. -->
          <div class="tb-card" id="tb-find">
            <button class="tb-find-open" id="tb-find-open" type="button" aria-controls="tb-search">
              <span class="tb-find-icon" aria-hidden="true"></span>
              <span class="tb-find-label" id="tb-find-label"></span>
              <span class="tb-kbd" id="tb-find-kbd"></span>
            </button>
            <div id="tb-search" data-mode="find">
              <button class="tb-mode" id="tb-mode" type="button"
                      aria-haspopup="menu" aria-expanded="false" aria-controls="tb-modemenu">
                <span class="tb-sicon" aria-hidden="true"></span>
                <span class="tb-mode-label" id="tb-mode-label"></span>
                <span class="tb-caret" aria-hidden="true"></span>
              </button>
              <input id="tb-q" type="search" autocomplete="off" spellcheck="false"
                     role="combobox" aria-expanded="false" aria-controls="tb-results" />
              <span class="tb-kbd" id="tb-kbd"></span>
              <div class="tb-modemenu" id="tb-modemenu" role="menu" hidden></div>
              <div id="tb-results" role="listbox" hidden></div>
              <!-- 대화 패널 — 내용은 ask.ts 가 채운다. 첫 턴 전까지는 hidden 이다. -->
              <div id="tb-chat" hidden></div>
            </div>
          </div>
        </div>
        <div class="tb-line" id="tb-line-view">
          <!-- 그래프 전환. 문서 홈(#home)과 그래프(#view) 사이를 오간다. 상태는 표면이
               말한다(topbar.ts `paintGraphToggle`). -->
          <button class="tb-graph" id="tb-graph" type="button" aria-pressed="false"></button>
          <!-- 보기 카드 — 관점 세그(3D·2D·타임라인·Weave) + 렌즈(옵션·범례). 그래프에서만
               뜻이 있으므로 View 가 채우고 떠날 때 비운다. 둘 다 비면 카드째 숨는다. -->
          <div class="tb-card" id="tb-viewctl">
            <div id="tb-viewpoints" role="group"></div>
            <div id="tb-lens"></div>
          </div>
        </div>
        <!-- 숨긴 버튼만 남는다. 설정·도구·GRAPH.md 는 LNB 바닥의 설정 버튼이 흡수했고,
             팔레트·딥링크가 아직 id 로 찾을 수 있게 둔다. -->
        <div id="tb-right">
          <button class="tb-icon" id="settings-btn" data-icon="settings" hidden
                  aria-haspopup="dialog"></button>
          <button class="tb-icon" id="tb-tools" hidden></button>
          <button class="tb-icon tb-conv" id="tb-conv" data-icon="ring" hidden
                  aria-haspopup="dialog"><span id="tb-conv-badge" hidden></span></button>
        </div>
      </header>
      <!-- 문서 내용 패널은 LNB 같은 별도 열이었다가 다시 표면 위 카드로 돌아왔다.
           지도와 같은 그리드 칸을 차지하므로 문서를 열어도 지도 폭은 그대로다.
           내용은 표면이 채운다(View 가 자기 상세를 여기로 옮겨 심는다). -->
      <!-- 머리는 **셸**이 갖고 본문만 표면이 채운다. 그래서 라우터가 표면을 갈아끼울
           때 비우는 것도 본문뿐이다(머리가 함께 지워지면 접기 손잡이가 사라진다). -->
      <!-- 클리핑 칸 — 패널이 접힐 때 **왼쪽으로 미끄러져 나가는데**, 그 이동은 자기
           그리드 칸을 넘어가므로 클립해 주는 부모가 없으면 LNB 위를 지나간다(실측 버그).
           칸은 표면과 같은 자리를 차지하되 `pointer-events: none` 이라 지도 조작을
           막지 않는다 — 클릭을 받는 것은 안의 패널뿐이다. -->
      <div id="docpane-slot">
      <aside id="docpane" aria-label="Document" hidden>
        <!-- 머리에 이름표는 없다(발주자 지시 2026-08-05). 열 안의 층이 이미 자기
             이름을 말하고(`노드 상세`·`문서`), 그 위에 `문서 내용`을 한 줄 더 두면
             같은 자리에서 두 번 자기소개를 하는 셈이었다. 머리가 남는 이유는 접기
             손잡이와 LNB 머리와의 높이 정렬뿐이다. 열 이름은 `aria-label` 이 든다. -->
        <div class="pane-body" id="docpane-body"></div>
      </aside>
      </div>
      <main id="surface" aria-live="polite"></main>
      <!-- 설정은 여기 마크업이 없다. 도구·GRAPH.md 와 같은 시트(`openSheet`, size
           "panel")로 열린다(main.ts `settings-btn`). -->
      <div id="palette" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
