<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account conversion synthetic QA</title></head><body><div id="app"></div><script type="module">
import '/src/app.css';
localStorage.setItem('vinc.lang',new URLSearchParams(location.search).get('lang')||'en');
window.qaCalls=[];
let run=null;
const check={ready:true,scope:'topic',topic:'project/topic',fingerprint:'a'.repeat(64),counts:{Concept:5,Record:2,Chunk:1,ChunkVec:1},documents:1,blockers:[]};
const originalFetch=window.fetch;
window.fetch=async (url,options={})=>{
 const path=new URL(String(url),location.href).pathname;
 if (!path.startsWith('/api/')) return originalFetch(url,options);
 const method=options.method||'GET';const body=options.body?JSON.parse(options.body):{};
 window.qaCalls.push({path,method,body});
 let value={};let status=200;
 if(path==='/api/me') value={user:{username:'synthetic',email:'synthetic@example.invalid',plan:'free'}};
 else if(path==='/api/teams')value={teams:[]};
 else if(path.endsWith('/conversion/capabilities'))value={enabled:true,subject:'synthetic-qa-'+(new URLSearchParams(location.search).get('lang')||'en'),pending:run};
 else if(path.endsWith('/conversion/preflight'))value=body.topic==='project/oversize'?{...check,ready:false,topic:body.topic,counts_known:false,counts:null,documents:null,blockers:['conversion_inventory_limit']}:body.topic==='project/blocked'?{...check,ready:false,topic:body.topic,blockers:['boundary_relation','external_attachments_not_supported']}:{...check,topic:body.topic};
 else if(path.endsWith('/conversion/runs')){if(!run||run.id!==body.id)run={...body,team:'synthetic-team',state:'prepared'};value=run;}
 else if(path.endsWith('/resume')){run={...run,state:'active'};value=run;}
 else if(path.endsWith('/cancel')){run={...run,state:'cancelled'};value=run;}
 else if(path.includes('/conversion/runs/'))value=run;
 else {status=503;value={error:'synthetic_endpoint_not_defined'};}
 return new Response(JSON.stringify(value),{status,headers:{'content-type':'application/json'}});
};
const {openSettings}=await import('/src/surfaces/settings.ts');
openSettings('account');
</script></body></html>
