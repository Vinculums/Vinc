# Vinc Tauri shell — P4 packaging scaffold (DEC D1: shell = Tauri).
# 제어 = Tauri IPC(사이드카 수명주기·파일 다이얼로그), 데이터 = localhost HTTP.
# 빌드·서명·3플랫폼 설치본은 P4 마일스톤에서(클린 VM 게이트) — 본 스캐폴드는
# 구성 형태를 고정할 뿐 CI/개발 환경에서 cargo 빌드를 요구하지 않는다.
[package]
name = "vinc-app"   # 엔진이 `vinc` 를 갖는다(VIN-72). Tauri 는 사이드카와
                    # 패키지 이름이 같으면 빌드를 거절한다.
version = "0.9.2"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 파일 로깅 — 사이드카 즉사·MCP 등록 실패 같은 "조용한 고장"을 재현 없이 사후
# 추적하기 위한 표면. 릴리스 빌드는 windows_subsystem="windows" 라 stdout 이
# 사라지므로 로그 파일이 유일한 증거다. `log` 는 매크로(info!/warn!)용 파사드.
log = "0.4"
tauri-plugin-log = "2"

# 자동 업데이트(v0.3.0): 데스크탑만 대상 — updater 는 모바일 미지원이므로 target 가드.
# process 는 설치 후 재기동(relaunch)용.
# single-instance(v0.5.2): 중복 실행 시 기존 창 포커스 + 조기 종료 → 사이드카 중복
# spawn·누수 차단. 데스크탑 전용.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"

# OS 비밀 저장소(감사 M8) — Windows 자격 증명 관리자 · macOS 키체인 ·
# Linux secret-service. 손으로 쓸 수 있는 것이 아니다(플랫폼마다 다른 네이티브 API).
# 리눅스는 secret-service 를 고른다: 커널 keyutils(`linux-native`)는 세션 범위라
# 재부팅에서 사라져 **보관용으로 못 쓴다**.
# ⚠ 그 선택 때문에 리눅스 빌드에 libdbus 개발 헤더가 필요하다(워크플로의 시스템 패키지).
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
